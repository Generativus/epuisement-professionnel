<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Déduction Sociale - Lobby WebSocket</title>
    <!-- Chargement de Tailwind CSS pour un style moderne et réactif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuration de la police Inter et configuration de base */
        :root {
            font-family: 'Inter', sans-serif;
        }

        /* CRUCIAL: Utiliser 100vh ou -webkit-fill-available pour optimiser l'affichage sur mobile (incluant la barre d'adresse) */
        /* Note: L'utilisation de h-screen (100vh) est le meilleur compromis, 
           mais peut être ajusté par des navigateurs mobiles pour tenir compte de la barre d'adresse. 
           L'ajout de 'min-h-screen' assure la couverture. */
        body {
            background-color: #f7f7f7;
            /* Laissé body en layout simple, le conteneur d'app gère le flex */
        }
        
        /* Conteneur principal de l'application */
        #app-container {
            /* Fixer la hauteur pour utiliser l'espace visible complet */
            min-height: 100vh;
            height: 100vh; 
            width: 100%;
            max-width: 6xl; 
            margin: 0 auto;
            /* Flex Column pour empiler Header/Content/Footer */
            display: flex;
            flex-direction: column;
            
            /* S'assurer que les bords ne sont pas coupés */
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Conteneur des messages - DOIT prendre l'espace restant et défiler */
        #messages-container-wrapper {
            flex-grow: 1; /* Prend tout l'espace vertical disponible */
            overflow-y: auto; /* Permet le défilement vertical */
            -webkit-overflow-scrolling: touch; /* Améliore le défilement sur iOS */
            padding-bottom: 0.5rem; /* Espace avant le footer */
        }

        /* Styles pour les messages */
        .message-row {
            padding: 0.5rem 1rem;
            display: flex;
            align-items: flex-start;
        }

        .message-content {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            word-wrap: break-word; /* Important pour les longs messages */
            max-width: 90%;
        }
        
        /* Message de l'utilisateur actuel */
        .message-self .message-content {
            background-color: #3b82f6; /* Bleu (blue-500) */
            color: white;
            border-bottom-right-radius: 0;
            margin-left: auto;
        }
        
        /* Message d'un autre utilisateur */
        .message-other .message-content {
            background-color: #e5e7eb; /* Gris clair (gray-200) */
            color: #1f2937; /* Gris foncé */
            border-bottom-left-radius: 0;
        }
        
        /* Message système */
        .message-system .message-content {
            background-color: #fca5a5; /* Rouge clair (red-300) */
            color: #7f1d1d; /* Rouge foncé (red-900) */
            text-align: center;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    
    <!-- Conteneur principal: Flex Column pour une gestion de la hauteur de l'écran (Header/Content/Footer) -->
    <div id="app-container" class="bg-gray-50 max-w-lg mx-auto">
        
        <!-- Header de l'application (Barre d'information fixe) -->
        <header id="info-bar" class="bg-white shadow-lg p-3 flex justify-between items-center z-10 sticky top-0">
            <h1 id="lobby-title" class="text-xl font-bold text-gray-800 truncate mr-2">Salon: --</h1>
            <div class="flex items-center space-x-3">
                <span id="player-count" class="text-gray-600 font-medium bg-gray-200 py-1 px-3 rounded-full text-sm">0/10</span>
                <button id="leave-lobby-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-1 px-3 rounded-full shadow transition duration-150 ease-in-out text-sm">
                    Quitter
                </button>
            </div>
        </header>

        <!-- Conteneur de Navigation (invisible par défaut, seulement pour l'initialisation) -->
        <!-- La logique de navigation n'est pas modifiée, mais le conteneur principal reste visible -->
        <div id="navigation-container" class="flex-grow overflow-auto hidden">
            <!-- Contenu de la page Home/Lobby/Game -->
            
            <!-- Page Home (Laisser la structure minimale pour que la logique de navigation fonctionne) -->
            <div id="page-home" class="p-4 space-y-4">
                <div class="bg-white p-6 rounded-xl shadow">
                    <h2 class="text-2xl font-semibold mb-4 text-center text-gray-800">Bienvenue</h2>
                    <input type="text" id="nickname-input" placeholder="Votre pseudonyme" class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <button id="save-nickname-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md transition duration-150 ease-in-out mb-4">Sauvegarder le Pseudo</button>

                    <div class="flex space-x-2">
                        <input type="text" id="room-code-input" placeholder="Code du salon" class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <button id="join-lobby-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-150 ease-in-out">Rejoindre</button>
                    </div>
                    <button id="create-lobby-btn" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md mt-4 transition duration-150 ease-in-out">Créer un Salon</button>
                </div>
                
                <div id="status-message" class="text-center text-sm font-medium text-red-500 mt-4 h-5"></div>
            </div>
            
            <!-- Page Game (Placeholder pour la logique de jeu) -->
            <div id="page-game" class="p-4 space-y-4 hidden">
                <h2 class="text-2xl font-semibold text-gray-800">Phase de Jeu</h2>
                <div id="game-info" class="bg-yellow-100 p-4 rounded-lg border border-yellow-300 text-yellow-800">
                    <p>Le jeu est en cours. Vos actions et rôles seront affichés ici.</p>
                </div>
            </div>
        </div>


        <!-- Conteneur des Messages du Chat (Prend l'espace restant et DÉFILE) -->
        <!-- Ce wrapper gère le défilement pour laisser le header/footer visibles -->
        <div id="messages-container-wrapper">
             <div id="messages-container" class="min-h-full">
                <!-- Les messages seront ajoutés ici par le JavaScript -->
             </div>
        </div>

        
        <!-- Footer de l'application (Zone de saisie de texte fixe) -->
        <footer id="chat-input-bar" class="bg-white p-3 border-t border-gray-200 z-10 sticky bottom-0">
            <div class="flex items-center space-x-2">
                <input type="text" id="message-input" placeholder="Écrivez un message (max 200 caractères)" maxlength="200" 
                       class="flex-grow p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                <button id="send-message-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold p-3 rounded-full shadow-md transition duration-150 ease-in-out flex-shrink-0">
                    <!-- Icône d'envoi -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" transform="rotate(90 12 12) translate(0 24) scale(1 -1) translate(0 -24)"/>
                    </svg>
                </button>
            </div>
        </footer>

        <!-- Modal de Confirmation (Utilisé à la place d'alert/confirm) -->
        <div id="confirmation-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
                <p id="modal-message" class="text-gray-700 mb-6 text-center"></p>
                <div class="flex justify-around space-x-4">
                    <button id="confirm-yes" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg transition duration-150">Oui</button>
                    <button id="confirm-no" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded-lg transition duration-150">Non</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Script JavaScript pour la logique WebSocket et Chat -->
    <script type="module">
        // Importation des fonctions utilitaires Firebase (non utilisées ici, mais conservées pour la compatibilité du template)
        // const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
        // const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
        // const { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, getDocs, addDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
        
        // --- Variables Globales ---
        let ws;
        let nickname = '';
        let currentRoomCode = null;
        let lobbyData = {};
        
        // Constantes du jeu (pour référence, la logique principale est sur le serveur)
        const GAME_STATUS = {
            WAITING: 'WAITING',
            STARTED: 'STARTED',
            VOTING: 'VOTING',
            ENDED: 'ENDED'
        };

        // Configuration du serveur Render (URL fournie par l'utilisateur)
        // Utiliser ws:// pour http et wss:// pour https
        const RENDER_URL = "webrtc-epuisement-professionnel.onrender.com";
        const WS_URL = window.location.protocol === 'https:' ? `wss://${RENDER_URL}` : `ws://${RENDER_URL}`;

        // --- Éléments du DOM ---
        const appContainer = document.getElementById('app-container');
        const navigationContainer = document.getElementById('navigation-container');
        const pageHome = document.getElementById('page-home');
        const pageGame = document.getElementById('page-game');
        const messagesContainerWrapper = document.getElementById('messages-container-wrapper');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendMessageBtn = document.getElementById('send-message-btn');
        const nicknameInput = document.getElementById('nickname-input');
        const saveNicknameBtn = document.getElementById('save-nickname-btn');
        const roomCodeInput = document.getElementById('room-code-input');
        const joinLobbyBtn = document.getElementById('join-lobby-btn');
        const createLobbyBtn = document.getElementById('create-lobby-btn');
        const lobbyTitle = document.getElementById('lobby-title');
        const playerCountSpan = document.getElementById('player-count');
        const leaveLobbyBtn = document.getElementById('leave-lobby-btn');
        const statusMessage = document.getElementById('status-message');
        const chatInputBar = document.getElementById('chat-input-bar');
        const infoBar = document.getElementById('info-bar');
        
        // Modal de confirmation
        const confirmationModal = document.getElementById('confirmation-modal');
        const modalMessage = document.getElementById('modal-message');
        const confirmYes = document.getElementById('confirm-yes');
        const confirmNo = document.getElementById('confirm-no');
        let confirmationCallback = null;

        // --- Logique d'affichage (Navigation et État) ---

        /**
         * Navigue entre les vues principales (home, lobby, game)
         * La page "lobby" utilise le conteneur principal de l'app pour le chat.
         * @param {string} view 'home', 'lobby', 'game'
         */
        function navigate(view) {
            // Cacher toutes les vues de navigation et afficher/cacher les barres
            pageHome.classList.add('hidden');
            pageGame.classList.add('hidden');
            messagesContainerWrapper.classList.add('hidden');
            chatInputBar.classList.add('hidden');
            infoBar.classList.add('hidden');
            navigationContainer.classList.add('hidden');
            
            // Afficher la vue appropriée
            if (view === 'home') {
                navigationContainer.classList.remove('hidden');
                pageHome.classList.remove('hidden');
            } else if (view === 'lobby') {
                // Afficher le chat
                messagesContainerWrapper.classList.remove('hidden');
                chatInputBar.classList.remove('hidden');
                infoBar.classList.remove('hidden');
                // S'assurer que le titre est visible dans le lobby
                lobbyTitle.textContent = `Salon: ${currentRoomCode || '--'}`;
                scrollToBottom();
            } else if (view === 'game') {
                navigationContainer.classList.remove('hidden');
                pageGame.classList.remove('hidden');
                infoBar.classList.remove('hidden'); // Le Header reste
            }
        }

        /** Affiche un message d'état temporaire */
        function displayStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = isError 
                ? 'text-center text-sm font-medium text-red-500 mt-4 h-5' 
                : 'text-center text-sm font-medium text-green-500 mt-4 h-5';
            
            setTimeout(() => {
                statusMessage.textContent = '';
                statusMessage.className = 'h-5'; // Conserver la hauteur
            }, 5000);
        }

        /** Affiche un modal de confirmation à la place de window.confirm() */
        function showConfirmation(message, onConfirm) {
            modalMessage.textContent = message;
            confirmationCallback = onConfirm;
            confirmationModal.classList.remove('hidden');
        }

        // Gestionnaire pour le modal de confirmation
        confirmYes.onclick = () => {
            if (confirmationCallback) {
                confirmationCallback();
            }
            confirmationModal.classList.add('hidden');
            confirmationCallback = null;
        };

        confirmNo.onclick = () => {
            confirmationModal.classList.add('hidden');
            confirmationCallback = null;
        };


        // --- Logique de Persistance (Stockage Local) ---
        function initPersistance() {
            const savedNickname = localStorage.getItem('nickname');
            if (savedNickname) {
                nickname = savedNickname;
                nicknameInput.value = savedNickname;
                displayStatus(`Pseudonyme chargé: ${nickname}`);
            } else {
                displayStatus("Veuillez entrer un pseudonyme.", true);
            }
            navigate('home');
        }

        saveNicknameBtn.addEventListener('click', () => {
            const newNickname = nicknameInput.value.trim();
            if (newNickname.length > 0 && newNickname.length <= 15) {
                nickname = newNickname;
                localStorage.setItem('nickname', nickname);
                displayStatus(`Pseudonyme sauvegardé: ${nickname}`);
            } else {
                displayStatus("Le pseudonyme doit faire entre 1 et 15 caractères.", true);
            }
        });
        
        // --- Logique WebSocket ---
        function initWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('Connecté au serveur WebSocket.');
                clearMessage();
                displayStatus("Connecté au serveur.");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (error) {
                    console.error('Erreur lors du parsing du message:', error, event.data);
                }
            };

            ws.onclose = (event) => {
                console.log('Déconnecté du serveur WebSocket.', event.code, event.reason);
                clearMessage();
                displayStatus(`Déconnecté du serveur. Code: ${event.code}`, true);
                // Si l'on est dans un lobby, revenir à l'accueil
                if (currentRoomCode) {
                    messagesContainer.innerHTML = '';
                    currentRoomCode = null;
                    lobbyData = {};
                    stopTimer(); 
                    stopEnergyGain();
                    navigate('home');
                }
                
                // Tentative de reconnexion après un court délai
                setTimeout(initWebSocket, 5000);
            };

            ws.onerror = (error) => {
                console.error('Erreur WebSocket:', error);
                displayStatus('Erreur de connexion WebSocket.', true);
            };
        }

        function sendToServer(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            } else {
                console.error('WebSocket non connecté ou en cours de fermeture.');
                displayStatus('Erreur: Connexion au serveur perdue. Reconnexion en cours.', true);
            }
        }
        
        function clearMessage() {
            messagesContainer.innerHTML = ''; // Nettoyer les messages du chat
        }

        // --- Gestion des Messages du Serveur ---
        function handleMessage(data) {
            console.log('Message reçu:', data);
            
            switch (data.action) {
                case 'ROOM_CREATED':
                case 'ROOM_JOINED':
                    currentRoomCode = data.code;
                    lobbyData = data.lobbyData;
                    displayStatus(data.message);
                    lobbyTitle.textContent = `Salon: ${currentRoomCode}`;
                    navigate('lobby');
                    updateLobbyUI();
                    break;

                case 'ERROR':
                    displayStatus(`Erreur: ${data.message}`, true);
                    break;
                
                case 'MESSAGE':
                case 'SYSTEM_MESSAGE':
                    addMessage(data);
                    break;

                case 'LOBBY_UPDATE':
                    lobbyData = data.lobbyData;
                    updateLobbyUI();
                    break;

                case 'GAME_STATUS_UPDATE':
                    lobbyData.gameStatus = data.gameStatus;
                    updateLobbyUI(); // Met à jour le bouton Start/Leave si l'on veut ajouter plus de logique
                    addMessage({
                        action: 'SYSTEM_MESSAGE',
                        content: `Le jeu est désormais en état: ${data.gameStatus}`
                    });
                    if (data.gameStatus === GAME_STATUS.STARTED) {
                         // Démarrer la logique du jeu
                         navigate('game');
                    } else if (data.gameStatus === GAME_STATUS.WAITING || data.gameStatus === GAME_STATUS.ENDED) {
                         navigate('lobby');
                    }
                    break;

                case 'LOBBY_LEFT':
                    leaveLobby();
                    displayStatus('Vous avez quitté le salon.');
                    break;
                    
                default:
                    console.warn('Action inconnue reçue:', data.action);
            }
        }

        /** Met à jour l'interface utilisateur du lobby (compteur, statut du jeu, etc.) */
        function updateLobbyUI() {
            if (currentRoomCode && lobbyData.players) {
                const playerCount = Object.keys(lobbyData.players).length;
                playerCountSpan.textContent = `${playerCount}/${lobbyData.maxPlayers || 10}`;
                
                // Exemple de logique UI pour l'hôte:
                // const isHost = lobbyData.hostId === ws.userId; // userId n'est pas utilisé dans cette version simplifiée, mais c'est la bonne approche.
                // lobbyTitle.textContent = `Salon: ${currentRoomCode}${isHost ? ' (Hôte)' : ''}`;
            } else {
                playerCountSpan.textContent = '0/10';
            }
        }

        /** * Ajoute un message au conteneur de messages.
         * @param {object} data - Contient content, action, (userId), (nickname)
         */
        function addMessage(data) {
            const messageRow = document.createElement('div');
            const messageContent = document.createElement('div');
            
            // Formater l'heure
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            messageRow.classList.add('message-row');
            messageContent.classList.add('message-content');
            
            // Déterminer le type de message et le style
            if (data.action === 'SYSTEM_MESSAGE') {
                messageRow.classList.add('message-system', 'justify-center');
                messageContent.classList.remove('message-content');
                messageContent.classList.add('text-sm', 'italic', 'text-gray-500', 'text-center', 'w-full');
                messageContent.textContent = data.content;
            } else if (data.nickname === nickname) {
                // Mon propre message
                messageRow.classList.add('message-self', 'justify-end');
                const timestampSpan = `<span class="text-xs text-gray-300 mr-2">${timeString}</span>`;
                messageContent.innerHTML = `${data.content} ${timestampSpan}`;
            } else {
                // Message d'un autre joueur
                messageRow.classList.add('message-other', 'justify-start');
                const timestampSpan = `<span class="text-xs text-gray-500 ml-2">${timeString}</span>`;
                const nicknameSpan = `<span class="font-bold mr-2">${data.nickname}:</span>`;
                messageContent.innerHTML = `${nicknameSpan}${data.content}${timestampSpan}`;
            }

            messageRow.appendChild(messageContent);
            messagesContainer.appendChild(messageRow);
            
            // Défilement automatique vers le bas
            scrollToBottom();
        }

        /** Défile le conteneur de messages jusqu'en bas */
        function scrollToBottom() {
            // Utiliser le wrapper qui gère le défilement
            messagesContainerWrapper.scrollTop = messagesContainerWrapper.scrollHeight;
        }

        // --- Logique du Lobby ---

        joinLobbyBtn.addEventListener('click', () => {
            const code = roomCodeInput.value.trim();
            if (!code || code.length !== 5) {
                displayStatus("Veuillez entrer un code de salon valide de 5 chiffres.", true);
                return;
            }
            if (!nickname) {
                displayStatus("Veuillez d'abord définir votre pseudonyme.", true);
                return;
            }
            
            sendToServer({
                action: 'JOIN_LOBBY',
                code: code,
                nickname: nickname
            });
        });

        createLobbyBtn.addEventListener('click', () => {
            if (!nickname) {
                displayStatus("Veuillez d'abord définir votre pseudonyme.", true);
                return;
            }
            
            sendToServer({
                action: 'CREATE_LOBBY',
                nickname: nickname
            });
        });
        
        // --- Logique du Chat ---
        
        // Placeholders pour les fonctions de gain d'énergie/timer (non implémentées ici, mais conservées pour la structure)
        let energyInterval = null;
        let gameTimer = null;
        
        function stopEnergyGain() {
            if (energyInterval) clearInterval(energyInterval);
            energyInterval = null;
        }

        function stopTimer() {
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = null;
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            
            if (!currentRoomCode) {
                displayStatus("Vous n'êtes pas dans un salon.", true);
                return;
            }
            
            if (content.length === 0) {
                // Ne rien faire si le message est vide
                return;
            }
            
            // TODO: Vérifier si le joueur a assez d'énergie pour parler et la dépenser.
            // Pour l'instant, on laisse le chat libre pour les tests.

            sendToServer({
                action: 'MESSAGE',
                content: content,
                nickname: nickname // Pour simplifier, on envoie le pseudo
            });

            messageInput.value = '';
        }
        
        leaveLobbyBtn.addEventListener('click', () => {
            showConfirmation("Êtes-vous sûr de vouloir quitter le salon ? La déconnexion est immédiate.", () => {
                sendToServer({
                    action: 'LEAVE_LOBBY'
                });
            });
        });
        
        function leaveLobby() {
            messagesContainer.innerHTML = '';
            currentRoomCode = null;
            lobbyData = {};
            stopTimer(); 
            stopEnergyGain(); // S'assurer que le gain d'énergie s'arrête en quittant
            navigate('home');
            clearMessage();
        }

        // --- Événements Clavier/Bouton ---\
        
        sendMessageBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // --- Initialisation ---\
        initPersistance(); 
        window.onload = initWebSocket;
    </script>
</body>
</html>
