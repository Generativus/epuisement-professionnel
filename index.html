<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épuisement Professionnel - P2P Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs du jeu */
            --color-bg-dark: #2A2E33; /* Gris ardoise foncé */
            --color-chat-dark: #373b40;
            --color-accent-white: #e0e0e0;
            --color-progress-bar: #e0e0e0;
            /* Couleur d'accent par défaut (blanc avant la connexion P2P) */
            --accent-player: var(--color-accent-white); 
        }

        /* Couleurs des joueurs (pâles) - Utilisées par l'hôte pour l'affectation et par tous pour l'affichage */
        .color-A { --player-color-value: #F8BBD0; } /* Rose */
        .color-B { --player-color-value: #FFCC80; } /* Orange */
        .color-C { --player-color-value: #BBDEFB; } /* Bleu */
        .color-D { --player-color-value: #E1BEE7; } /* Mauve (Purple) */
        .color-E { --player-color-value: #C8E6C9; } /* Vert */
        .color-F { --player-color-value: #FFE082; } /* Jaune */
        .color-G { --player-color-value: #B2EBF2; } /* Turquoise */
        .color-H { --player-color-value: #F0F4C3; } /* Beige clair */
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Conteneur principal du jeu pour centrer */
        #game-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            max-width: 600px; /* Largeur maximale pour un style de chat */
            margin: 0 auto;
            width: 100%;
            height: 100%;
        }

        /* Barres et affichages du haut */
        #top-bar {
            background-color: var(--color-bg-dark);
            padding: 1rem;
            border-bottom: 2px solid var(--accent-player);
            transition: border-color 0.5s;
        }

        /* Barre de progression */
        #progress-bar-container {
            height: 8px;
            background-color: var(--color-chat-dark);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--color-progress-bar);
            transition: width 0.3s ease;
        }

        /* Affichage des compteurs */
        #counters-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .work-points {
            font-weight: 700;
            color: var(--accent-player); /* Couleur du joueur */
            transition: color 0.5s;
        }
        .timer {
             color: var(--color-accent-white);
        }

        /* Zone de chat */
        #chat-messages {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            background-color: var(--color-chat-dark);
        }
        
        /* Style des bulles de message */
        .message-bubble {
            max-width: 75%;
            padding: 0.5rem 0.75rem;
            border-radius: 1rem;
            margin-bottom: 0.5rem;
            word-wrap: break-word;
            position: relative;
        }
        .message-bubble.mine {
            background-color: var(--accent-player); /* Utilise la couleur d'accent du joueur */
            color: var(--color-bg-dark); /* Texte foncé sur accent clair */
            margin-left: auto;
            border-top-right-radius: 0.25rem;
        }
        .message-bubble.other {
            background-color: #4b525a; /* Gris neutre pour les autres */
            color: var(--color-accent-white);
            margin-right: auto;
            border-top-left-radius: 0.25rem;
            border: 1px solid var(--bubble-accent-color); /* Contour coloré par joueur */
        }
        .message-sender-name {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .sender-color {
            color: var(--bubble-accent-color, var(--color-accent-white));
        }

        /* Formulaire de saisie de message */
        #chat-input-area {
            display: flex;
            padding: 1rem;
            background-color: var(--color-bg-dark);
            border-top: 2px solid var(--accent-player);
            transition: border-color 0.5s;
        }
        #message-input {
            flex-grow: 1;
            background-color: var(--color-chat-dark);
            color: var(--color-accent-white);
            border: 1px solid var(--accent-player);
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            margin-right: 0.5rem;
            transition: border-color 0.5s;
        }
        #send-button {
            background-color: var(--accent-player);
            color: var(--color-bg-dark);
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            font-weight: 700;
            transition: background-color 0.5s, opacity 0.2s;
        }
        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Style du modal */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal-content {
            background-color: var(--color-chat-dark);
            padding: 2rem;
            border-radius: 0.75rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border: 2px solid var(--accent-player);
        }
        #modal-name-input, #modal-host-code-input {
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
            border: 1px solid var(--color-accent-white);
            border-radius: 0.5rem;
            padding: 0.5rem;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }
        .modal-button {
            background-color: var(--color-accent-white);
            color: var(--color-bg-dark);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 700;
            margin-top: 0.75rem;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .modal-button:hover:not(:disabled) {
            background-color: #ccc;
        }
        .modal-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Style du lobby */
        #lobby-view {
            padding: 1rem;
            text-align: center;
            flex-grow: 1;
            overflow-y: auto;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background-color: var(--color-bg-dark);
            border-radius: 0.5rem;
            border: 1px solid var(--accent-player);
            transition: border-color 0.5s;
        }
        .player-status {
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-connected { color: #81C784; } /* Vert clair */
        .status-signaling { color: #FFD54F; } /* Jaune */
        .status-joining { color: #64B5F6; } /* Bleu clair */

        .host-code-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-player);
        }

        /* Message d'alerte/info (comme alternative à alert()) */
        #alert-message {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: #FF5722; /* Orange pour alerte */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            z-index: 2000;
        }
        #alert-message.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Message d'alerte / Info -->
    <div id="alert-message"></div>

    <!-- Conteneur principal du jeu -->
    <div id="game-container">
        
        <!-- Barre d'information supérieure (Visible uniquement IN_GAME) -->
        <div id="top-bar" class="hidden">
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="counters-display">
                <div class="timer">Temps restant: <span id="timer-display">00:00</span></div>
                <div class="work-points">Points de travail: <span id="work-points-display">0</span></div>
            </div>
        </div>

        <!-- Vue du lobby (Affichée après la connexion, avant le jeu) -->
        <div id="lobby-view" class="hidden">
            <h2 class="text-2xl font-bold mb-4">Lobby de la Partie</h2>
            <div id="host-info" class="mb-6 hidden">
                <p>Code de la Partie: <span id="host-code-display" class="host-code-display"></span></p>
                <p class="text-sm text-gray-400">Partagez ce code pour que les autres puissent vous rejoindre.</p>
            </div>
            <div id="lobby-players-list" class="text-left w-full max-w-sm mx-auto">
                <!-- Les joueurs s'affichent ici -->
            </div>
            <p class="text-sm mt-4 text-gray-400">Minimum de <span id="start-min-count">4</span> joueurs requis pour commencer.</p>
            <button id="start-game-button" class="modal-button" disabled>Démarrer la Partie</button>
        </div>
        
        <!-- Zone de chat (Visible uniquement IN_GAME) -->
        <div id="chat-messages" class="hidden">
            <!-- Les messages s'affichent ici -->
        </div>

        <!-- Zone de saisie de message (Visible uniquement IN_GAME) -->
        <div id="chat-input-area" class="hidden">
            <input type="text" id="message-input" placeholder="Écrivez votre message..." class="flex-grow">
            <button id="send-button">Envoyer</button>
        </div>
    </div>
    
    <!-- Modal de Connexion (Visible au lancement) -->
    <div id="modal-overlay">
        <div id="modal-content">
            <h2 class="text-xl font-bold mb-2">Bienvenue</h2>
            <p class="text-sm mb-4 text-gray-400">Choisissez un nom et hébergez ou rejoignez une partie.</p>
            
            <label for="modal-name-input" class="block text-sm font-medium">Votre Nom:</label>
            <input type="text" id="modal-name-input" maxlength="15" placeholder="Entrez votre nom">
            
            <div class="flex space-x-4 mt-2">
                <button id="host-button" class="modal-button flex-1" disabled>Créer Partie</button>
                <button id="join-mode-button" class="modal-button flex-1">Rejoindre</button>
            </div>
            
            <div id="join-mode-area" class="mt-4 hidden">
                <label for="modal-host-code-input" class="block text-sm font-medium">Code de l'Hôte:</label>
                <input type="text" id="modal-host-code-input" maxlength="6" placeholder="Code (Ex: BRGG3I)">
                <button id="join-button" class="modal-button w-full" disabled>Rejoindre Partie</button>
            </div>
        </div>
    </div>

    <script>
        // ====================================================================
        // CONFIGURATION GLOBALE
        // ====================================================================
        const MIN_PLAYERS = 4;
        const SIGNALING_SERVER_URL = "wss://webrtc-epuisement-professionnel.onrender.com";
        const POINTS_PER_INTERVAL = 10; // Variable de points pour l'accumulation de travail
        const TIME_BETWEEN_POINTS_MS = 10000; // 10 secondes

        // NOUVELLE CONFIGURATION WEBRTC AMÉLIORÉE
        const PEER_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' },
                { urls: 'stun:stun.nextcloud.com:443' },
            ]
        };
        // FIN NOUVELLE CONFIGURATION

        const GAME_STATES = {
            SETUP: 'setup',
            LOBBY: 'lobby',
            IN_GAME: 'in_game'
        };

        // ====================================================================
        // ÉTATS LOCAUX
        // ====================================================================
        let signalingSocket = null;
        let gameState = GAME_STATES.SETUP;

        // Informations sur le joueur local
        const localPlayer = {
            id: crypto.randomUUID(), // ID unique pour l'enregistrement auprès du serveur de signalisation
            name: '',
            isHost: false,
            hostCode: '',
            colorClass: '',
            workPoints: 0,
        };

        // État des pairs connectés (Hôte : tous les pairs | Joueur : uniquement l'hôte)
        let connectedPlayers = {}; // { 'peerId': { name, colorClass, peerConnection, dataChannel, isConnected, isHost } }
        
        // Map pour stocker les PeerConnections (utilisé par l'hôte pour tous les pairs, par le joueur pour l'hôte)
        const peerConnections = {}; // { 'peerId': RTCPeerConnection }
        const dataChannels = {};      // { 'peerId': RTCDataChannel }

        // ====================================================================
        // ÉLÉMENTS DU DOM
        // ====================================================================
        const $modalOverlay = document.getElementById('modal-overlay');
        const $modalNameInput = document.getElementById('modal-name-input');
        const $modalHostCodeInput = document.getElementById('modal-host-code-input');
        const $hostButton = document.getElementById('host-button');
        const $joinButton = document.getElementById('join-button');
        const $joinModeArea = document.getElementById('join-mode-area');
        const $joinModeButton = document.getElementById('join-mode-button');
        const $chatMessages = document.getElementById('chat-messages');
        const $messageInput = document.getElementById('message-input');
        const $sendButton = document.getElementById('send-button');
        const $lobbyView = document.getElementById('lobby-view');
        const $lobbyPlayersList = document.getElementById('lobby-players-list');
        const $hostInfo = document.getElementById('host-info');
        const $hostCodeDisplay = document.getElementById('host-code-display');
        const $topBar = document.getElementById('top-bar');
        const $chatInputArea = document.getElementById('chat-input-area');
        const $workPointsDisplay = document.getElementById('work-points-display');
        const $startGameButton = document.getElementById('start-game-button');
        const $startMinCount = document.getElementById('start-min-count');
        const $alertMessage = document.getElementById('alert-message');

        // ====================================================================
        // FONCTIONS D'INTERFACE UTILISATEUR
        // ====================================================================

        /** Affiche un message d'alerte temporaire (remplace alert()) */
        function showAlert(message) {
            $alertMessage.textContent = message;
            $alertMessage.classList.add('visible');
            setTimeout(() => {
                $alertMessage.classList.remove('visible');
            }, 3000);
        }

        /** Met à jour la couleur d'accent du joueur local sur l'interface */
        function updateAccentColor(colorClass) {
            const root = document.documentElement;
            const playerColor = colorClass ? getComputedStyle(document.querySelector(`.${colorClass}`)).getPropertyValue('--player-color-value') : 'var(--color-accent-white)';
            root.style.setProperty('--accent-player', playerColor);
            localPlayer.colorClass = colorClass;
        }

        /** Génère un code d'hôte aléatoire (Ex: BRGG3I) */
        function generateHostCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        /** Met à jour l'affichage des points de travail */
        function updateWorkPoints(newPoints) {
            localPlayer.workPoints = newPoints;
            $workPointsDisplay.textContent = newPoints;
        }

        /** Change l'état de l'interface utilisateur */
        function setGameState(newState) {
            gameState = newState;
            
            // Masquer tout d'abord
            $modalOverlay.classList.add('hidden');
            $topBar.classList.add('hidden');
            $chatMessages.classList.add('hidden');
            $chatInputArea.classList.add('hidden');
            $lobbyView.classList.add('hidden');

            // Afficher l'état approprié
            if (newState === GAME_STATES.LOBBY) {
                $lobbyView.classList.remove('hidden');
            } else if (newState === GAME_STATES.IN_GAME) {
                $topBar.classList.remove('hidden');
                $chatMessages.classList.remove('hidden');
                $chatInputArea.classList.remove('hidden');
            } else { // SETUP
                $modalOverlay.classList.remove('hidden');
            }
        }

        /** Met à jour la liste des joueurs dans le lobby */
        function updateLobbyPlayersDisplay(players) {
            $lobbyPlayersList.innerHTML = '';
            let playerCount = 0;

            // Ajouter le joueur local en premier (toujours l'hôte si c'est le lobby de l'hôte)
            const isLocalConnected = localPlayer.isHost || connectedPlayers[localPlayer.hostCode]?.isConnected;
            const localStatus = localPlayer.isHost ? 'HÔTE / Connecté' : (isLocalConnected ? 'Connecté' : 'Signalisation');
            const localStatusClass = localPlayer.isHost || isLocalConnected ? 'status-connected' : 'status-signaling';
            
            const localElement = document.createElement('div');
            localElement.className = `player-item ${localPlayer.colorClass}`;
            localElement.innerHTML = `
                <div class="font-bold">
                    <span class="sender-color" style="--bubble-accent-color: ${getComputedStyle(document.querySelector(`.${localPlayer.colorClass || 'color-A'}`)).getPropertyValue('--player-color-value')};">${localPlayer.name}</span> 
                    ${localPlayer.isHost ? '(Moi, Hôte)' : '(Moi)'}
                </div>
                <div class="player-status ${localStatusClass}">${localStatus}</div>
            `;
            $lobbyPlayersList.appendChild(localElement);
            playerCount++;

            // Ajouter les autres joueurs (joueurs distants)
            for (const id in players) {
                const player = players[id];
                // Éviter de lister l'hôte si on est l'hôte, ou se lister soi-même
                if (id === localPlayer.id) continue; 
                if (id === localPlayer.hostCode && !localPlayer.isHost) continue; // Le joueur rejoignant ne se liste pas deux fois

                const statusText = player.isConnected ? 'Connecté' : 'Signalisation';
                const statusClass = player.isConnected ? 'status-connected' : 'status-signaling';
                
                const playerElement = document.createElement('div');
                playerElement.className = `player-item ${player.colorClass}`;
                playerElement.innerHTML = `
                    <div class="font-bold">
                        <span class="sender-color" style="--bubble-accent-color: ${getComputedStyle(document.querySelector(`.${player.colorClass || 'color-A'}`)).getPropertyValue('--player-color-value')};">${player.name}</span>
                    </div>
                    <div class="player-status ${statusClass}">${statusText}</div>
                `;
                $lobbyPlayersList.appendChild(playerElement);
                playerCount++;
            }
            
            // Mettre à jour l'état du bouton "Démarrer la Partie"
            $startGameButton.disabled = playerCount < MIN_PLAYERS;
            
            // Afficher le code d'hôte si on est l'hôte
            if (localPlayer.isHost) {
                $hostCodeDisplay.textContent = localPlayer.hostCode;
                $hostInfo.classList.remove('hidden');
            } else {
                $hostInfo.classList.add('hidden');
            }
        }


        /** Ajoute un message au chat */
        function addChatMessage({ senderId, senderName, colorClass, text }) {
            const isMine = senderId === localPlayer.id;
            const messageElement = document.createElement('div');
            messageElement.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;

            messageElement.innerHTML = `
                <div class="message-bubble ${isMine ? 'mine' : 'other'}" style="${!isMine ? `--bubble-accent-color: ${getComputedStyle(document.querySelector(`.${colorClass || 'color-A'}`)).getPropertyValue('--player-color-value')};` : ''}">
                    ${isMine ? '' : `<div class="message-sender-name"><span class="sender-color">${senderName}</span></div>`}
                    <div class="message-text">${text.replace(new RegExp(Object.values(connectedPlayers).map(p => p.name).join('|'), 'g'), (match) => 
                        `<span class="sender-color">${match}</span>`
                    )}</div>
                </div>
            `;

            $chatMessages.appendChild(messageElement);
            $chatMessages.scrollTop = $chatMessages.scrollHeight;
        }

        // ====================================================================
        // WEBSOCKET & SIGNALISATION
        // ====================================================================

        /** Se connecte au serveur de signalisation via WebSocket */
        function connectSignalingServer() {
            try {
                signalingSocket = new WebSocket(SIGNALING_SERVER_URL);
            } catch (error) {
                showAlert('Erreur de connexion au serveur de signalisation. Vérifiez l\'URL.');
                console.error("Erreur de connexion WS:", error);
                return;
            }

            signalingSocket.onopen = () => {
                console.log("[WS] Connecté au serveur de signalisation.");
                // Enregistrer le client immédiatement avec son ID unique
                sendSignalingMessage({
                    type: 'register_client',
                    senderId: localPlayer.id,
                });
                showAlert('Connecté au serveur de signalisation.');
            };

            signalingSocket.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleSignalingMessage(message);
                } catch (e) {
                    console.error("[WS] Erreur de parsing du message:", e, event.data);
                }
            };

            signalingSocket.onclose = (event) => {
                console.log("[WS] Déconnecté du serveur de signalisation:", event.code, event.reason);
                showAlert('Déconnecté du serveur de signalisation. Tentative de reconnexion...');
                // Implémenter une reconnexion simple
                setTimeout(connectSignalingServer, 5000);
            };

            signalingSocket.onerror = (error) => {
                console.error("[WS] Erreur WebSocket:", error);
                showAlert('Erreur de connexion au serveur de signalisation.');
            };
        }

        /** Envoie un message au serveur de signalisation */
        function sendSignalingMessage(message) {
            if (signalingSocket && signalingSocket.readyState === WebSocket.OPEN) {
                signalingSocket.send(JSON.stringify(message));
            } else {
                console.warn("[WS] Tentative d'envoi échouée : Socket non ouvert.", message);
            }
        }

        /** Gère les messages reçus du serveur de signalisation */
        async function handleSignalingMessage(message) {
            const senderId = message.senderId;
            
            // --- 1. Join Request (Hôte reçoit) ---
            if (message.type === 'join_request' && localPlayer.isHost && message.hostId === localPlayer.hostCode) {
                console.log(`[LOBBY] Hôte traite la demande de jonction de : ${message.joinerName} (${message.joinerId})`); 
                const peerId = message.joinerId;
                
                // 1. Enregistrer le nouveau joueur
                connectedPlayers[peerId] = { 
                    name: message.joinerName, 
                    colorClass: message.joinerColorClass, 
                    isHost: false, 
                    isConnected: false,
                    isReady: false 
                };
                updateLobbyPlayersDisplay(connectedPlayers);

                // 2. Initialiser la connexion P2P (créer offre)
                const pc = createPeerConnection(peerId, true); // true = isOffering
                
                // Le canal de données est créé par l'offreur (l'hôte)
                const dc = pc.createDataChannel("chat");
                setupDataChannelListeners(dc, peerId);
                dataChannels[peerId] = dc;
                
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // 3. Envoyer l'offre via le serveur de signalisation
                sendSignalingMessage({
                    type: 'offer',
                    senderId: localPlayer.id,
                    targetId: peerId,
                    offer: pc.localDescription,
                    hostPlayersState: connectedPlayers // Envoyer l'état du lobby à l'offreur
                });
            }

            // --- 2. Offer (Joueur reçoit) ---
            else if (message.type === 'offer' && message.targetId === localPlayer.id && !localPlayer.isHost) {
                console.log(`[WEBRTC] Reçu offre de l'hôte ${senderId}`);

                // 1. Initialiser la connexion P2P (créer réponse)
                const pc = createPeerConnection(senderId, false); // false = !isOffering (répondeur)

                // Enregistrer l'état du lobby reçu de l'hôte (pour la mise à jour initiale)
                Object.assign(connectedPlayers, message.hostPlayersState);
                updateLobbyPlayersDisplay(connectedPlayers);

                await pc.setRemoteDescription(new RTCSessionDescription(message.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                // 2. Envoyer la réponse
                sendSignalingMessage({
                    type: 'answer',
                    senderId: localPlayer.id,
                    targetId: senderId,
                    answer: pc.localDescription
                });
                
                // 3. Attacher le DataChannel lorsque l'hôte le crée et l'envoie
                pc.ondatachannel = (event) => {
                    const dc = event.channel;
                    setupDataChannelListeners(dc, senderId);
                    dataChannels[senderId] = dc;
                };
            }

            // --- 3. Answer (Hôte reçoit) ---
            else if (message.type === 'answer' && localPlayer.isHost && message.targetId === localPlayer.id) {
                console.log(`[WEBRTC] Reçu réponse du pair ${senderId}`);
                const pc = peerConnections[senderId];
                if (pc && pc.signalingState !== 'closed') {
                    await pc.setRemoteDescription(new RTCSessionDescription(message.answer));
                }
            }
            
            // --- 4. ICE Candidate ---
            else if (message.type === 'candidate' && message.targetId === localPlayer.id) {
                const pc = peerConnections[senderId];
                if (pc) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
                    } catch (e) {
                        console.error("[WEBRTC] Erreur lors de l'ajout du candidat ICE:", e);
                    }
                }
            }

            // --- 5. Broadcast (Tous reçoivent) ---
            else if (message.type === 'broadcast') {
                handleBroadcast(message.data);
            }
        }

        // ====================================================================
        // PEER CONNECTION (WebRTC)
        // ====================================================================

        /** Crée et configure une nouvelle RTCPeerConnection */
        function createPeerConnection(peerId, isOffering) {
            console.log(`[WEBRTC] Création de PeerConnection pour ${peerId} (Offreur: ${isOffering})`);
            
            const pc = new RTCPeerConnection(PEER_CONFIG);
            peerConnections[peerId] = pc;

            // Événement pour trouver les candidats ICE (adresses réseau)
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log(`[ICE] Envoi du candidat ICE à ${peerId}`);
                    sendSignalingMessage({
                        type: 'candidate',
                        senderId: localPlayer.id,
                        targetId: peerId,
                        candidate: event.candidate
                    });
                }
            };

            // Événement crucial pour connaître l'état de la connexion P2P
            pc.onconnectionstatechange = () => {
                console.log(`[WEBRTC] État de connexion pour ${peerId}: ${pc.connectionState}`);
                if (pc.connectionState === 'connected') {
                    // Mettre à jour l'état de connexion et le lobby
                    if (localPlayer.isHost) {
                        connectedPlayers[peerId].isConnected = true;
                        updateLobbyPlayersDisplay(connectedPlayers);
                    } else if (peerId === localPlayer.hostCode) {
                        // Le joueur rejoint son hôte
                        connectedPlayers[localPlayer.hostCode].isConnected = true;
                        updateLobbyPlayersDisplay(connectedPlayers);
                    }
                    showAlert(`Connexion P2P établie avec ${connectedPlayers[peerId]?.name || peerId} !`);
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                     console.error(`[WEBRTC] Connexion échouée/déconnectée avec ${peerId}`);
                     if (localPlayer.isHost) {
                        connectedPlayers[peerId].isConnected = false;
                        updateLobbyPlayersDisplay(connectedPlayers);
                     } else {
                         showAlert(`Connexion P2P perdue avec l'hôte.`);
                     }
                }
            };
            
            // Événement lorsque l'état de la collecte ICE change
            pc.onicegatheringstatechange = () => {
                console.log(`[ICE] État de collecte pour ${peerId}: ${pc.iceGatheringState}`);
            };


            return pc;
        }

        /** Configure les écouteurs pour un RTCDataChannel */
        function setupDataChannelListeners(dc, peerId) {
            dc.onopen = () => {
                console.log(`[DC] DataChannel ouvert pour ${peerId}`);
                if (localPlayer.isHost) {
                    // L'hôte envoie immédiatement sa couleur à l'invité
                    sendData(peerId, { type: 'color_assignment', colorClass: connectedPlayers[peerId].colorClass });
                    // Envoyer l'état complet du lobby après la connexion (pour synchronisation)
                    sendData(peerId, { type: 'lobby_sync', state: connectedPlayers });
                } else {
                    // Le joueur rejoignant envoie son nom à l'hôte si la connexion est ouverte
                    sendData(peerId, { type: 'name_sync', name: localPlayer.name, colorClass: localPlayer.colorClass });
                }
            };

            dc.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleDataChannelMessage(message, peerId);
                } catch (e) {
                    console.error("[DC] Erreur de parsing du message:", e, event.data);
                }
            };

            dc.onclose = () => {
                console.log(`[DC] DataChannel fermé pour ${peerId}`);
                // Gérer la déconnexion
            };
            
            dc.onerror = (error) => {
                console.error(`[DC] Erreur sur DataChannel pour ${peerId}:`, error);
            };
        }

        /** Envoie des données sur un DataChannel spécifique */
        function sendData(peerId, data) {
            const dc = dataChannels[peerId];
            if (dc && dc.readyState === 'open') {
                dc.send(JSON.stringify(data));
                return true;
            }
            console.warn(`[DC] Impossible d'envoyer à ${peerId}: DataChannel non ouvert.`);
            return false;
        }
        
        /** Envoie un message à tous les pairs connectés (pour le chat ou le jeu) */
        function broadcastData(data) {
            let sent = false;
            // Si on est hôte, on envoie à tous les invités
            if (localPlayer.isHost) {
                 for (const peerId in connectedPlayers) {
                     if (peerId !== localPlayer.id) { // Ne pas s'envoyer à soi-même
                        if (sendData(peerId, data)) sent = true;
                     }
                 }
            // Si on est joueur, on envoie uniquement à l'hôte
            } else if (dataChannels[localPlayer.hostCode]) {
                if (sendData(localPlayer.hostCode, data)) sent = true;
            }
            
            // Traiter le message localement (il n'est pas envoyé par le DataChannel)
            handleDataChannelMessage(data, localPlayer.id);

            return sent;
        }

        /** Gère les messages reçus via RTCDataChannel */
        function handleDataChannelMessage(message, senderId) {
            // Identifier l'expéditeur pour l'affichage (hôte ou pair)
            const senderName = (senderId === localPlayer.id) 
                ? localPlayer.name
                : connectedPlayers[senderId]?.name || "Joueur Inconnu";
            const colorClass = (senderId === localPlayer.id) 
                ? localPlayer.colorClass 
                : connectedPlayers[senderId]?.colorClass || 'color-A'; // Default pour éviter l'erreur

            switch (message.type) {
                case 'chat_message':
                    addChatMessage({ 
                        senderId: senderId, 
                        senderName: senderName, 
                        colorClass: colorClass, 
                        text: message.text 
                    });
                    // L'hôte diffuse le message à tous les autres pairs
                    if (localPlayer.isHost && senderId !== localPlayer.id) {
                        broadcastData(message);
                    }
                    break;
                
                case 'color_assignment':
                    // Reçu par le joueur qui rejoint
                    if (!localPlayer.isHost) {
                        localPlayer.colorClass = message.colorClass;
                        updateAccentColor(message.colorClass);
                        updateLobbyPlayersDisplay(connectedPlayers);
                    }
                    break;

                case 'lobby_sync':
                    // Reçu par le joueur après connexion réussie (mise à jour complète)
                    if (!localPlayer.isHost) {
                        // Conserver seulement la connexion à l'hôte, mais mettre à jour les joueurs
                        const hostPc = connectedPlayers[localPlayer.hostCode];
                        connectedPlayers = message.state;
                        connectedPlayers[localPlayer.hostCode] = hostPc; // S'assurer que l'état local de l'hôte est correct
                        updateLobbyPlayersDisplay(connectedPlayers);
                    }
                    break;
                
                case 'name_sync':
                    // Reçu par l'hôte après DataChannel ouvert par un pair
                    if (localPlayer.isHost) {
                        if (connectedPlayers[senderId]) {
                            connectedPlayers[senderId].name = message.name;
                            connectedPlayers[senderId].colorClass = message.colorClass;
                            updateLobbyPlayersDisplay(connectedPlayers);
                        }
                    }
                    break;
                
                // AJOUTEZ D'AUTRES LOGIQUES DE JEU ICI (e.g., 'game_start', 'work_update', etc.)

                default:
                    console.warn(`[DC] Message de type inconnu reçu: ${message.type}`);
            }
        }

        // ====================================================================
        // GESTIONNAIRES D'ÉVÉNEMENTS
        // ====================================================================

        /** Vérifie si les champs sont remplis dans le modal */
        function checkModalReadiness() {
            const name = $modalNameInput.value.trim();
            const hostCode = $modalHostCodeInput.value.trim();
            
            $hostButton.disabled = name.length === 0;

            const isJoinMode = !$joinModeArea.classList.contains('hidden');
            if (isJoinMode) {
                 $joinButton.disabled = name.length === 0 || hostCode.length < 6;
            }
        }

        /** Gère l'action "Créer Partie" */
        $hostButton.addEventListener('click', () => {
            localPlayer.name = $modalNameInput.value.trim();
            localPlayer.isHost = true;
            localPlayer.hostCode = generateHostCode();
            
            // 1. Déterminer la couleur locale de l'hôte (Couleur A par défaut)
            // L'hôte reçoit sa propre couleur ici. Les autres couleurs sont réservées.
            const colorKeys = Object.keys(document.styleSheets[0].cssRules).filter(i => document.styleSheets[0].cssRules[i].selectorText && document.styleSheets[0].cssRules[i].selectorText.startsWith('.color-'));
            const colors = colorKeys.map(i => document.styleSheets[0].cssRules[i].selectorText.substring(1));
            
            localPlayer.colorClass = colors[0]; // Hôte est toujours la première couleur (A)
            updateAccentColor(localPlayer.colorClass);
            
            // 2. Initialiser le lobby de l'hôte (seul joueur présent initialement)
            connectedPlayers[localPlayer.id] = {
                name: localPlayer.name,
                colorClass: localPlayer.colorClass,
                isHost: true,
                isConnected: true, // L'hôte est toujours 'connecté' localement
                isReady: true // L'hôte est prêt par défaut
            };
            
            setGameState(GAME_STATES.LOBBY);
            updateLobbyPlayersDisplay(connectedPlayers);
            showAlert(`Partie créée! Code: ${localPlayer.hostCode}`);
            
            // L'hôte est prêt à recevoir des requêtes P2P via le serveur de signalisation
        });

        /** Gère l'action "Rejoindre Partie" */
        $joinButton.addEventListener('click', () => {
            localPlayer.name = $modalNameInput.value.trim();
            localPlayer.isHost = false;
            localPlayer.hostCode = $modalHostCodeInput.value.trim().toUpperCase(); // hostCode stocke le code de l'hôte à joindre

            // 1. Déterminer une couleur temporaire (la couleur finale sera assignée par l'hôte)
            localPlayer.colorClass = 'color-F'; // Couleur temporaire
            updateAccentColor(localPlayer.colorClass);

            // 2. Envoyer la demande de jonction via le serveur de signalisation
            sendSignalingMessage({
                type: 'join_request',
                senderId: localPlayer.id,
                hostId: localPlayer.hostCode,
                joinerId: localPlayer.id,
                joinerName: localPlayer.name,
                joinerColorClass: localPlayer.colorClass, // Envoyé pour la couleur par défaut
            });
            
            // 3. Ajouter l'hôte à la liste des joueurs connectés (status: Signalisation)
            connectedPlayers[localPlayer.hostCode] = {
                name: `Hôte (${localPlayer.hostCode})`,
                colorClass: 'color-A', // Temporaire
                isHost: true,
                isConnected: false, // En attente de connexion P2P
                isReady: false
            };

            setGameState(GAME_STATES.LOBBY);
            updateLobbyPlayersDisplay(connectedPlayers);
            showAlert(`Demande de jonction envoyée à l'hôte ${localPlayer.hostCode}.`);
        });
        
        /** Bascule entre les boutons "Héberger" et le champ "Code d'hôte" */
        $joinModeButton.addEventListener('click', () => {
            const isJoinMode = !$joinModeArea.classList.contains('hidden');
            if (isJoinMode) {
                // Retour à l'hébergement
                $joinModeArea.classList.add('hidden');
                $hostButton.classList.remove('hidden');
                $joinModeButton.textContent = 'Rejoindre';
            } else {
                // Passer au mode rejoindre
                $joinModeArea.classList.remove('hidden');
                $hostButton.classList.add('hidden');
                $joinModeButton.textContent = 'Annuler';
            }
            checkModalReadiness();
            $modalHostCodeInput.focus();
        });

        /** Gère l'envoi de message du chat */
        function handleMessageSend() {
            const text = $messageInput.value.trim();
            if (text.length > 0) {
                // Le message est une donnée de type 'chat_message'
                const chatMessage = {
                    type: 'chat_message',
                    senderId: localPlayer.id,
                    senderName: localPlayer.name,
                    colorClass: localPlayer.colorClass,
                    text: text,
                };
                
                // Envoi à travers le DataChannel(s)
                broadcastData(chatMessage);
                
                $messageInput.value = '';
                $messageInput.focus();
            } else {
                 showAlert("Erreur: Le message ne peut pas être vide.");
            }
        }
        
        // --- Événements Clavier/Click ---
        $modalNameInput.addEventListener('input', checkModalReadiness);
        $modalHostCodeInput.addEventListener('input', checkModalReadiness);
        $sendButton.addEventListener('click', handleMessageSend);
        $messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                handleMessageSend();
            }
        });
        
        // Démarre le jeu (Hôte seulement)
        $startGameButton.addEventListener('click', () => {
            if (localPlayer.isHost && Object.keys(connectedPlayers).length >= MIN_PLAYERS) {
                 // Logique de début de jeu (attribution finale des rôles/couleurs, changement d'état)
                 setGameState(GAME_STATES.IN_GAME);
                 showAlert("La partie commence !");
                 // Envoi d'un broadcast 'game_start' à tous les pairs
                 broadcastData({ type: 'game_start', timestamp: Date.now() });
            } else {
                 showAlert(`Vous devez avoir au moins ${MIN_PLAYERS} joueurs.`);
            }
        });

        // ====================================================================
        // INITIALIZATION
        // ====================================================================

        window.onload = () => {
            // 1. Initialiser la connexion au serveur de signalisation
            connectSignalingServer(); 
            
            // 2. Initialiser la couleur d'accent par défaut (blanc)
            document.documentElement.style.setProperty('--accent-player', 'var(--color-accent-white)');
            
            // 3. Afficher le nombre minimum de joueurs pour commencer
            $startMinCount.textContent = MIN_PLAYERS;
            
            // 4. Focus sur l'input modal
            $modalNameInput.focus();
            
            // 5. Vérifier l'état initial des boutons
            checkModalReadiness();
            
            // 6. Démonstration de l'accumulation de points de travail
            setInterval(() => {
                if (localPlayer.name && gameState === GAME_STATES.IN_GAME) { 
                    updateWorkPoints(localPlayer.workPoints + POINTS_PER_INTERVAL);
                }
            }, TIME_BETWEEN_POINTS_MS);
        };

    </script>
