<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épuisement Professionnel - Jeu Centralisé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs du jeu */
            --color-bg-dark: #2A2E33; /* Gris ardoise foncé */
            --color-chat-dark: #373b40;
            --color-accent-white: #e0e0e0;
            --color-progress-bar: #e0e0e0;
            --accent-player: var(--color-accent-white); 
        }

        /* Couleurs des joueurs (maintenant définies par le serveur) */
        .color-A { --player-color-value: #F8BBD0; } /* Rose pâle */
        .color-B { --player-color-value: #FFCC80; } /* Orange pâle */
        .color-C { --player-color-value: #BBDEFB; } /* Bleu pâle */
        .color-D { --player-color-value: #E1BEE7; } /* Violet pâle */
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
        }

        /* Styles pour les barres de progression */
        .progress-bar-container {
            border: 1px solid var(--player-color-value);
            background-color: var(--color-chat-dark);
        }

        .progress-bar {
            background-color: var(--player-color-value);
            transition: width 0.5s ease-out;
        }
        
        .chat-message-bubble {
            background-color: var(--color-chat-dark);
            border-left: 4px solid var(--accent-player);
            transition: border-left 0.3s ease;
        }

        .chat-message-self {
             /* La couleur du joueur local est définie par --accent-player */
             border-left: 4px solid var(--accent-player);
        }

        .chat-message-other {
             /* Définition dynamique par JS pour les autres joueurs */
        }
        
        /* Style des boutons */
        .btn-primary {
            background-color: #3B82F6; /* blue-500 */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #2563EB; /* blue-600 */
        }
        .btn-primary:disabled {
            background-color: #6B7280; /* gray-500 */
            cursor: not-allowed;
        }

        /* Styles de l'overlay/modale */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 50;
        }
        .modal-content {
            background-color: var(--color-chat-dark);
            border: 2px solid var(--accent-player);
            transition: border-color 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 60;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Modale d'accueil (Connexion) -->
    <div id="modal-container" class="fixed inset-0 flex items-center justify-center modal-overlay">
        <div id="modal-content" class="modal-content p-6 rounded-lg max-w-sm w-full transition-all duration-300">
            <h2 class="text-xl font-bold mb-4 text-center">Bienvenue au Bureau!</h2>
            
            <label for="name-input" class="block mb-2 text-sm font-medium">Votre Nom/Surnom:</label>
            <input type="text" id="name-input" maxlength="20" class="w-full p-2 mb-4 rounded bg-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 outline-none">

            <div class="mb-4">
                <label for="room-input" class="block mb-2 text-sm font-medium">ID du Salon (pour joindre):</label>
                <input type="text" id="room-input" placeholder="Laissez vide pour créer" class="w-full p-2 rounded bg-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <button id="connect-button" class="btn-primary w-full" disabled>
                <span id="connect-text">Connexion...</span>
            </button>
            <p id="min-player-text" class="text-xs text-center mt-3 text-gray-400">Min. <span id="start-min-count">2</span> joueurs requis pour commencer.</p>
        </div>
    </div>

    <!-- Interface principale du jeu -->
    <div id="game-container" class="hidden w-full max-w-6xl flex flex-col lg:flex-row rounded-xl shadow-2xl overflow-hidden bg-gray-700">

        <!-- Colonne Gauche: État du Jeu/Joueurs -->
        <div class="lg:w-2/3 p-6 space-y-6">
            
            <div class="flex justify-between items-center pb-2 border-b border-gray-600">
                <h1 class="text-2xl font-bold">Projet Burnout</h1>
                <div class="text-sm font-mono text-gray-300">
                    ID Salon: <span id="current-room-id" class="font-bold text-lg text-yellow-400"></span>
                </div>
            </div>

            <!-- Boutons de l'Hôte -->
            <div id="host-controls" class="hidden flex justify-center space-x-4">
                <button id="start-game-btn" class="btn-primary" disabled>Démarrer la Partie</button>
            </div>

            <!-- Liste des Joueurs -->
            <div id="players-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Les cartes de joueur seront insérées ici par JS -->
            </div>

            <!-- Espace d'Affichage du Jeu Principal -->
            <div class="bg-gray-800 p-4 rounded-lg h-64 flex items-center justify-center">
                <p id="game-status-message" class="text-xl font-semibold text-center text-gray-400">En attente des joueurs...</p>
            </div>

        </div>

        <!-- Colonne Droite: Chat -->
        <div class="lg:w-1/3 flex flex-col bg-gray-800 p-4">
            <h2 class="text-lg font-bold mb-3 border-b border-gray-600 pb-2">Chat du Bureau</h2>
            
            <!-- Zone de Messages -->
            <div id="chat-messages" class="flex-grow overflow-y-auto space-y-3 p-2 mb-4 bg-gray-700 rounded">
                <!-- Les messages de chat seront insérés ici par JS -->
            </div>

            <!-- Entrée de Message -->
            <div class="flex space-x-2">
                <input type="text" id="message-input" placeholder="Écrire un message..." class="flex-grow p-2 rounded bg-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 outline-none">
                <button id="send-button" class="btn-primary text-sm p-2">Envoyer</button>
            </div>
        </div>

    </div>

    <script>
        // Référence aux éléments DOM
        const $modalContainer = document.getElementById('modal-container');
        const $modalContent = document.getElementById('modal-content');
        const $modalNameInput = document.getElementById('name-input');
        const $modalRoomInput = document.getElementById('room-input');
        const $connectButton = document.getElementById('connect-button');
        const $connectText = document.getElementById('connect-text');
        const $startMinCount = document.getElementById('start-min-count');
        
        const $gameContainer = document.getElementById('game-container');
        const $currentRoomId = document.getElementById('current-room-id');
        const $hostControls = document.getElementById('host-controls');
        const $startGameBtn = document.getElementById('start-game-btn');
        const $playersList = document.getElementById('players-list');
        const $gameStatusMessage = document.getElementById('game-status-message');
        
        const $chatMessages = document.getElementById('chat-messages');
        const $messageInput = document.getElementById('message-input');
        const $sendButton = document.getElementById('send-button');

        // --- CONSTANTES ET ÉTATS LOCAUX ---
        
        // CORRECTION DE L'ERREUR SYNTAXIQUE (ws:// est une chaîne invalide si l'hôte est vide)
        let wsHost = window.location.host;
        
        // Si window.location.host est vide (ce qui se produit souvent dans les environnements sandboxes sécurisés), 
        // nous devons reconstruire l'URL en utilisant le port connu du serveur (8080).
        if (!wsHost || wsHost.trim() === '') {
            // Utiliser le nom d'hôte actuel ou 'localhost' en dernier recours.
            let hostName = window.location.hostname || 'localhost';
            
            // Reconstruire l'hôte en incluant le port 8080, où le serveur Node.js est censé écouter.
            wsHost = `${hostName}:8080`;
        }

        // Utiliser le protocole ws:// (même si le client est en https, car le serveur Node.js écoute en ws).
        const SERVER_URL = `ws://${wsHost}`;

        const MIN_PLAYERS = 2; // Doit correspondre à la constante serveur
        const POINTS_PER_INTERVAL = 1;
        const TIME_BETWEEN_POINTS_MS = 1000; // 1 point par seconde
        const BURNOUT_REDUCTION_PER_POINT = 0.05; // Réduction du burnout par point dépensé

        const GAME_STATES = {
            WAITING_FOR_CLIENT_ID: 'waiting_id',
            WAITING_FOR_LOBBY: 'waiting_lobby',
            LOBBY: 'lobby',
            IN_GAME: 'in_game',
            GAME_OVER: 'game_over'
        };

        let ws = null;
        let clientId = null;
        let localPlayer = {
            id: null,
            name: '',
            color: 'color-A', // Couleur par défaut avant la connexion
            isHost: false,
            workPoints: 0,
            burnout: 0
        };
        let gameState = GAME_STATES.WAITING_FOR_CLIENT_ID;
        let currentRoomId = null;
        let playersState = new Map(); // Map<id, player>

        // --- COMMUNICATION AVEC LE SERVEUR ---

        /**
         * Envoie un message JSON au serveur.
         * @param {object} data L'objet de données à envoyer.
         */
        function sendToServer(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            } else {
                showAlert('Erreur: Connexion au serveur perdue ou non établie.');
            }
        }

        /**
         * Connecte le client au serveur WebSocket.
         */
        function connectSignalingServer() {
            $connectText.textContent = "Connexion...";
            $connectButton.disabled = true;

            console.log(`Tentative de connexion au serveur via: ${SERVER_URL}`);
            
            ws = new WebSocket(SERVER_URL);

            ws.onopen = () => {
                console.log("Connecté au serveur de jeu.");
                gameState = GAME_STATES.WAITING_FOR_CLIENT_ID;
                checkModalReadiness();
                
                // Si la connexion réussit, on doit demander au serveur notre ID.
                sendToServer({ type: 'get_client_id' }); 
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };

            ws.onclose = () => {
                console.log("Déconnexion du serveur.");
                showAlert("Déconnexion du serveur. Veuillez rafraîchir la page.", 'error');
                resetGame();
            };

            ws.onerror = (err) => {
                console.error("Erreur WebSocket:", err);
                // Le message d'erreur est conservé pour le debug
                showAlert(`Erreur de connexion au serveur. Assurez-vous que le serveur tourne sur ${SERVER_URL}`, 'error');
                
                // Mettre le bouton dans un état permettant la nouvelle tentative (s'il n'y a pas d'ID)
                if (clientId === null) {
                    $connectText.textContent = "Échec de connexion";
                    $connectButton.disabled = true;
                }
            };
        }

        /**
         * Gère les messages reçus du serveur.
         * @param {object} data Le message JSON du serveur.
         */
        function handleServerMessage(data) {
            console.log(`Message serveur reçu: ${data.type}`, data);

            switch (data.type) {
                case 'client_id':
                    clientId = data.id;
                    localPlayer.id = data.id;
                    gameState = GAME_STATES.WAITING_FOR_LOBBY;
                    $connectText.textContent = "Créer/Joindre la Partie";
                    checkModalReadiness();
                    break;
                
                case 'lobby_created':
                case 'lobby_joined':
                    currentRoomId = data.roomId;
                    $currentRoomId.textContent = data.roomId;
                    $modalContainer.classList.add('hidden');
                    $gameContainer.classList.remove('hidden');
                    gameState = GAME_STATES.LOBBY;
                    break;

                case 'game_state_sync':
                    // Mise à jour de l'état global du jeu
                    const oldState = gameState;
                    gameState = data.state;
                    
                    // Mise à jour de la liste des joueurs
                    playersState.clear();
                    data.players.forEach(p => {
                        playersState.set(p.id, p);
                        if (p.id === clientId) {
                            localPlayer = p;
                        }
                    });

                    // Si on passe de LOBBY à IN_GAME, on démarre l'accumulation de points
                    if (oldState === GAME_STATES.LOBBY && gameState === GAME_STATES.IN_GAME) {
                        startPointAccumulation();
                    }
                    
                    // Mise à jour de l'affichage
                    updateLocalPlayerAccent();
                    renderPlayersList();
                    renderGameStatus();
                    
                    // Mise à jour des contrôles de l'hôte
                    const isHost = localPlayer.isHost;
                    $hostControls.classList.toggle('hidden', !isHost);
                    if (isHost && gameState === GAME_STATES.LOBBY) {
                        $startGameBtn.disabled = playersState.size < MIN_PLAYERS;
                    }
                    
                    break;

                case 'game_start':
                    addSystemMessage("La partie a commencé! Au travail!", 'system');
                    break;

                case 'game_over':
                    stopPointAccumulation();
                    addSystemMessage(`Partie terminée! Le joueur ${playersState.get(data.winnerId)?.name || 'Inconnu'} a gagné par épuisement professionnel.`, 'warning');
                    gameState = GAME_STATES.GAME_OVER;
                    // Mettre à jour l'état local pour passer en mode lobby pour les déconnexions
                    localPlayer.isHost = (data.winnerId === clientId); // Garde la notion d'hôte
                    currentRoomId = data.roomId;
                    break;

                case 'chat_message':
                    const sender = playersState.get(data.senderId);
                    if (sender) {
                        addChatMessage(data.senderId, sender.name, data.text, sender.color);
                    } else {
                        addChatMessage(data.senderId, '???', data.text, 'color-A'); // Message d'un joueur inconnu
                    }
                    break;
                
                case 'player_left':
                    addSystemMessage(`Un joueur a quitté la partie.`, 'warning');
                    break;

                case 'error':
                    showAlert(`Erreur Serveur: ${data.message}`, 'error');
                    break;
            }
        }

        // --- LOGIQUE DE L'INTERFACE UTILISATEUR ET DU JEU ---

        /**
         * Affiche un message d'alerte (remplace window.alert).
         * @param {string} message Le message à afficher.
         * @param {string} [type='info'] Le type de message ('info', 'error', 'warning').
         */
        function showAlert(message, type = 'info') {
            const colorMap = {
                'info': 'border-blue-500',
                'error': 'border-red-500',
                'warning': 'border-yellow-500'
            };
            const colorClass = colorMap[type] || colorMap['info'];
            
            // Créer un simple message en haut de l'écran (à améliorer avec une vraie modale)
            const alertDiv = document.createElement('div');
            alertDiv.className = `fixed top-0 left-1/2 transform -translate-x-1/2 mt-4 p-4 rounded-lg shadow-lg text-white font-semibold ${colorClass} bg-gray-700 z-50 transition-all duration-300 border-l-4`;
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.classList.add('opacity-0');
                setTimeout(() => alertDiv.remove(), 300);
            }, 5000);
        }

        /**
         * Met à jour la couleur d'accentuation basée sur la couleur du joueur local.
         */
        function updateLocalPlayerAccent() {
            const playerColorVar = localPlayer.color;
            // Récupère la valeur de la variable CSS --player-color-value associée à la classe du joueur
            const colorElement = document.createElement('div');
            colorElement.className = playerColorVar;
            document.body.appendChild(colorElement);
            const playerColorValue = getComputedStyle(colorElement).getPropertyValue('--player-color-value').trim() || 'var(--color-accent-white)';
            colorElement.remove();

            document.documentElement.style.setProperty('--accent-player', playerColorValue);
            $modalContent.style.borderColor = playerColorValue;
        }

        /**
         * Vérifie si le bouton de connexion de la modale doit être activé.
         */
        function checkModalReadiness() {
            const name = $modalNameInput.value.trim();
            // Le bouton est activé si on a un nom ET qu'on a reçu notre ID du serveur (donc la WS est ouverte)
            const canConnect = name.length > 0 && clientId !== null; 
            $connectButton.disabled = !canConnect;
            $connectText.textContent = canConnect ? "Créer/Joindre la Partie" : (clientId === null ? "Connexion au serveur..." : "Entrez votre nom");
        }
        
        /**
         * Rend la liste des joueurs dans le DOM.
         */
        function renderPlayersList() {
            $playersList.innerHTML = '';
            
            playersState.forEach(player => {
                // Créer un élément temporaire pour obtenir la variable CSS du joueur
                const colorElement = document.createElement('div');
                colorElement.className = player.color;
                document.body.appendChild(colorElement);
                const playerColorValue = getComputedStyle(colorElement).getPropertyValue('--player-color-value').trim() || 'var(--color-accent-white)';
                colorElement.remove();

                const isLocal = player.id === clientId;
                const playerCard = `
                    <div class="p-4 rounded-xl shadow-lg transition-all duration-300" 
                         style="border: 2px solid ${playerColorValue}; background-color: var(--color-chat-dark);">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-bold" style="color: ${playerColorValue};">
                                ${player.name} ${isLocal ? '(Moi)' : ''} 
                                ${player.isHost ? '<span class="text-xs ml-1 bg-yellow-600 px-2 py-0.5 rounded-full text-black">Hôte</span>' : ''}
                            </h3>
                            <span class="text-xs font-mono text-gray-400">ID: ${player.id}</span>
                        </div>

                        <!-- Barre de points de travail -->
                        <div class="mb-3">
                            <p class="text-xs font-semibold mb-1 text-gray-300">Points de Travail: ${player.workPoints}</p>
                            <div class="h-2 rounded-full progress-bar-container" style="border-color: ${playerColorValue};">
                                <div class="h-full rounded-full progress-bar" 
                                     style="width: ${Math.min(100, player.workPoints)}%; background-color: ${playerColorValue};">
                                </div>
                            </div>
                        </div>

                        <!-- Barre de Burnout -->
                        <div>
                            <p class="text-xs font-semibold mb-1 text-red-400">Burnout: ${player.burnout.toFixed(1)}%</p>
                            <div class="h-2 rounded-full progress-bar-container border-red-500">
                                <div class="h-full rounded-full" 
                                     style="width: ${player.burnout}%; background-color: #EF4444;">
                                </div>
                            </div>
                        </div>

                        <!-- Bouton d'action (exemple de dépense de points) -->
                        <button onclick="spendWorkPoints('${player.id}')" 
                                class="mt-4 w-full text-xs font-semibold py-1 rounded transition-colors duration-200 
                                       ${isLocal && player.workPoints >= 1 ? 'bg-green-600 hover:bg-green-700' : 'bg-gray-500 cursor-not-allowed'}"
                                       ${isLocal && player.workPoints >= 1 ? '' : 'disabled'}
                                >
                                Dépenser 1 pt (Réduit Burnout)
                        </button>
                    </div>
                `;
                $playersList.insertAdjacentHTML('beforeend', playerCard);
            });
        }
        
        /**
         * Rend le message d'état du jeu.
         */
        function renderGameStatus() {
            let message = "";
            let color = "text-gray-400";
            
            switch (gameState) {
                case GAME_STATES.LOBBY:
                    message = `Salon Prêt. ${playersState.size}/${MIN_PLAYERS} joueurs. ${localPlayer.isHost ? "Cliquez sur Démarrer quand prêt." : "En attente de l'hôte."}`;
                    color = "text-yellow-400";
                    break;
                case GAME_STATES.IN_GAME:
                    message = "Travail en cours... Accumulez des points!";
                    color = "text-green-400";
                    break;
                case GAME_STATES.GAME_OVER:
                    message = "Partie terminée! Félicitations (ou non)!";
                    color = "text-red-400";
                    break;
                case GAME_STATES.WAITING_FOR_LOBBY:
                    message = "En attente de création/jonction de salon.";
                    color = "text-gray-400";
                    break;
                default:
                    message = "État inconnu.";
            }

            $gameStatusMessage.className = `text-xl font-semibold text-center ${color}`;
            $gameStatusMessage.textContent = message;
        }


        /**
         * Ajoute un message de chat normal à l'interface.
         */
        function addChatMessage(senderId, senderName, text, playerColorClass) {
            const isSelf = senderId === clientId;
            
            // Créer un élément temporaire pour obtenir la variable CSS du joueur
            const colorElement = document.createElement('div');
            colorElement.className = playerColorClass;
            document.body.appendChild(colorElement);
            const colorVar = getComputedStyle(colorElement).getPropertyValue('--player-color-value').trim() || 'var(--color-accent-white)';
            colorElement.remove();

            const messageHtml = `
                <div class="chat-message-bubble p-3 rounded-lg shadow-md transition-all duration-300"
                     style="border-left: 4px solid ${colorVar};">
                    <p class="text-xs font-semibold mb-1" style="color: ${colorVar};">${senderName}</p>
                    <p class="text-sm text-white">${text}</p>
                </div>
            `;
            $chatMessages.insertAdjacentHTML('beforeend', messageHtml);
            $chatMessages.scrollTop = $chatMessages.scrollHeight; // Scroll vers le bas
        }

        /**
         * Ajoute un message système (ex: joueur a rejoint, partie démarrée).
         */
        function addSystemMessage(text, type = 'info') {
            const colorMap = {
                'info': 'text-blue-400',
                'warning': 'text-yellow-400',
                'system': 'text-green-400'
            };
            const colorClass = colorMap[type] || colorMap['info'];
            
            const messageHtml = `
                <p class="text-center text-xs italic ${colorClass} pt-2 border-t border-gray-600">${text}</p>
            `;
            $chatMessages.insertAdjacentHTML('beforeend', messageHtml);
            $chatMessages.scrollTop = $chatMessages.scrollHeight;
        }

        // --- GESTION DES POINTS DE TRAVAIL ET BURNOUT (Logique Client) ---
        
        let pointInterval = null;

        function startPointAccumulation() {
            if (pointInterval) clearInterval(pointInterval);
            pointInterval = setInterval(() => {
                if (localPlayer.id && gameState === GAME_STATES.IN_GAME) { 
                    updateWorkPoints(localPlayer.workPoints + POINTS_PER_INTERVAL);
                }
            }, TIME_BETWEEN_POINTS_MS);
        }

        function stopPointAccumulation() {
            if (pointInterval) clearInterval(pointInterval);
            pointInterval = null;
        }

        /**
         * Met à jour les points de travail et les envoie au serveur.
         * @param {number} newPoints La nouvelle valeur des points.
         */
        function updateWorkPoints(newPoints) {
            localPlayer.workPoints = newPoints;
            sendToServer({
                type: 'game_action',
                action: 'update_work_points',
                value: newPoints
            });
        }
        
        /**
         * Met à jour le niveau de burnout et l'envoie au serveur.
         * @param {number} newBurnout La nouvelle valeur du burnout.
         */
        function updateBurnout(newBurnout) {
            localPlayer.burnout = Math.max(0, Math.min(100, newBurnout));
            sendToServer({
                type: 'game_action',
                action: 'update_burnout',
                value: localPlayer.burnout
            });
        }

        /**
         * Fonction appelée lorsque le joueur local clique pour dépenser des points.
         * @param {string} playerId L'ID du joueur pour lequel dépenser (doit être le joueur local).
         */
        function spendWorkPoints(playerId) {
            if (playerId !== clientId || gameState !== GAME_STATES.IN_GAME) return;
            
            if (localPlayer.workPoints >= 1) {
                // Dépenser 1 point de travail
                updateWorkPoints(localPlayer.workPoints - 1);
                
                // Réduire le burnout (exemple: 0.05% de réduction par point)
                updateBurnout(localPlayer.burnout - BURNOUT_REDUCTION_PER_POINT);
            }
        }
        
        // --- GESTION DES ÉVÉNEMENTS DOM ---

        // Événement: Connexion au salon
        $connectButton.addEventListener('click', () => {
            localPlayer.name = $modalNameInput.value.trim();
            const roomId = $modalRoomInput.value.trim();

            if (localPlayer.name.length === 0) {
                showAlert('Veuillez entrer un nom.');
                return;
            }

            if (roomId.length > 0) {
                // Tente de joindre un salon
                sendToServer({
                    type: 'join_lobby',
                    roomId: roomId,
                    playerName: localPlayer.name
                });
            } else {
                // Crée un nouveau salon
                sendToServer({
                    type: 'create_lobby',
                    playerName: localPlayer.name
                });
            }
        });
        
        // Événement: L'hôte clique sur Démarrer la Partie
        $startGameBtn.addEventListener('click', () => {
            if (localPlayer.isHost && gameState === GAME_STATES.LOBBY) {
                sendToServer({
                    type: 'game_action',
                    action: 'start_game'
                });
                // L'accumulation est démarrée par la réception du message game_state_sync si le jeu démarre.
            }
        });

        // Événement: Saisie du nom ou de l'ID du salon
        $modalNameInput.addEventListener('input', checkModalReadiness);
        $modalRoomInput.addEventListener('input', checkModalReadiness);


        // Événement: Envoi de Message de Chat
        function handleMessageSend() {
            const message = $messageInput.value.trim();
            if (message.length > 0 && gameState === GAME_STATES.IN_GAME) {
                sendToServer({
                    type: 'game_action',
                    action: 'chat_message',
                    text: message
                });
                $messageInput.value = '';
                $messageInput.focus();
            } else if (message.length > 0) {
                 showAlert("Vous ne pouvez chatter qu'une fois la partie démarrée.", 'warning');
                 $messageInput.value = '';
            }
        }
        
        $sendButton.addEventListener('click', handleMessageSend);
        $messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                handleMessageSend();
            }
        });

        // Mise à jour continue du Burnout (Logique de danger)
        setInterval(() => {
            // Le burnout augmente passivement en jeu
            if (gameState === GAME_STATES.IN_GAME && localPlayer.id) {
                // Simuler l'accumulation de burnout
                updateBurnout(localPlayer.burnout + 0.1); 
            }
        }, 3000); // Augmente de 0.1% toutes les 3 secondes

        // --- INITIALISATION ---

        window.onload = () => {
            // 1. Initialize signaling server connection
            connectSignalingServer(); 
            
            // 2. Initialiser la couleur d'accent par défaut (blanc)
            document.documentElement.style.setProperty('--accent-player', 'var(--color-accent-white)');
            
            // 3. Afficher le nombre minimum de joueurs pour commencer
            $startMinCount.textContent = MIN_PLAYERS;
            
            // 4. Focus sur l'entrée de la modale
            $modalNameInput.focus();
            
            // 5. Vérifier la préparation initiale du bouton
            checkModalReadiness();
        };

        function resetGame() {
            stopPointAccumulation();
            clientId = null;
            localPlayer = { id: null, name: '', color: 'color-A', isHost: false, workPoints: 0, burnout: 0 };
            gameState = GAME_STATES.WAITING_FOR_CLIENT_ID;
            currentRoomId = null;
            playersState.clear();
            $gameContainer.classList.add('hidden');
            $modalContainer.classList.remove('hidden');
            checkModalReadiness();
            $chatMessages.innerHTML = '';
            $playersList.innerHTML = '';
            $currentRoomId.textContent = '';
        }

    </script>
</body>
</html>
