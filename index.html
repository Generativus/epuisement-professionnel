<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Déduction Sociale - Lobby WebSocket</title>
    <!-- Chargement de Tailwind CSS pour un style moderne et réactif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuration de la police Inter et configuration de base */
        :root {
            font-family: 'Inter', sans-serif;
        }

        /* FLEXBOX CRUCIAL pour l'optimisation mobile/clavier */
        /* Le corps prend la hauteur de l'écran visible */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; /* Retirer le padding du body global */
            background-color: #1f2937; /* Fond sombre pour le corps */
        }
        
        /* Le conteneur d'application prend la hauteur totale de l'écran ou une taille maximale sur desktop */
        #app-container {
            height: 100vh; /* Permet au Flexbox de fonctionner en pleine hauteur */
            max-height: 100vh; /* S'assure qu'il ne dépasse pas sur mobile */
            width: 100%;
            max-width: 6xl; /* Taille maximale pour desktop */
            margin: 0 auto; /* Centrage pour les grands écrans */
            border-radius: 0; 
            /* AJOUT CLÉ 1: Conteneur Flexbox vertical principal */
            display: flex;
            flex-direction: column; 
            background-color: #f3f4f6; /* Fond clair pour l'application */
        }

        /* Masquage/Affichage des écrans */
        .screen {
            display: none;
        }

        .screen.active {
            display: flex; /* Utiliser flex pour tous les écrans actifs pour gérer la mise en page */
        }

        /* Style pour les messages du chat */
        .system-message {
            font-style: italic;
            color: #4b5563;
            text-align: center;
        }
        .user-message-self {
            background-color: #3b82f6; /* Bleu */
            color: white;
            align-self: flex-end;
            border-radius: 1rem 1rem 0 1rem;
            max-width: 80%;
            padding: 0.5rem 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .user-message-other {
            background-color: #ffffff; /* Blanc */
            color: #1f2937;
            align-self: flex-start;
            border-radius: 1rem 1rem 1rem 0;
            max-width: 80%;
            padding: 0.5rem 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .message-nickname {
            font-weight: bold;
            font-size: 0.75rem; /* text-xs */
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        /* Animations pour les transitions d'écran (optionnel) */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .active {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="app-container" class="w-full h-full max-w-lg mx-auto bg-white shadow-xl rounded-lg">

        <!-- Écran d'Accueil -->
        <div id="home-screen" class="screen active p-8 flex flex-col items-center justify-center h-full">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-6">Jeu de Déduction Sociale</h1>
            
            <input type="text" id="nickname-input" placeholder="Votre Pseudo" class="w-full p-3 mb-4 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-blue-500 transition duration-150">
            
            <div class="w-full space-y-3">
                <button id="create-lobby-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01]">
                    Créer un Salon
                </button>

                <div class="flex items-center space-x-2">
                    <input type="text" id="join-code-input" placeholder="Code du Salon (5 chiffres)" maxlength="5" class="flex-grow p-3 border-2 border-gray-300 rounded-lg text-center tracking-widest uppercase transition duration-150">
                    <button id="join-lobby-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01]">
                        Rejoindre
                    </button>
                </div>
            </div>
            
            <p id="error-message" class="text-red-500 mt-4 h-6 text-sm"></p>
        </div>

        <!-- Écran de Lobby -->
        <div id="lobby-screen" class="screen w-full h-full flex flex-col p-4 bg-gray-50">
            
            <!-- 1. En-tête / Informations du Lobby (Fixe en haut) -->
            <div id="lobby-info" class="w-full p-3 bg-white border-b border-gray-200 shadow-sm rounded-lg mb-4 flex-shrink-0">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Salon #<span id="lobby-code-display"></span></h2>
                    <span id="player-count" class="text-lg font-semibold text-blue-600">Joueurs: 0</span>
                </div>
                <p id="host-info" class="text-sm text-gray-500">Hôte: <span id="host-name-display"></span></p>
                <div id="game-status-info" class="mt-2 text-sm text-gray-700">
                    Statut: <span id="status-display" class="font-medium">EN ATTENTE</span>
                </div>
                <!-- Boutons d'Action Hôte/Joueur -->
                <div class="mt-3 flex justify-end space-x-3">
                    <button id="leave-lobby-btn" class="text-sm bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition duration-150">
                        Quitter
                    </button>
                    <button id="start-game-btn" class="hidden text-sm bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg transition duration-150">
                        Démarrer le Jeu
                    </button>
                </div>
            </div>
            
            <!-- 2. Conteneur des Messages (Doit défiler) -->
            <!-- AJOUT CLÉ 2: flex-grow pour prendre l'espace, overflow-y-auto pour le défilement -->
            <div id="messages-container" class="flex-grow w-full overflow-y-auto bg-white p-3 rounded-lg shadow-inner space-y-2 border border-gray-200">
                <!-- Les messages seront ajoutés ici par JavaScript -->
            </div>
            
            <!-- 3. Zone de Saisie de Message (Fixe en bas) -->
            <!-- AJOUT CLÉ 3: flex-shrink-0 pour rester en bas, mt-4 pour l'espacement avec le chat -->
            <div id="message-input-area" class="w-full mt-4 flex space-x-2 flex-shrink-0">
                <textarea id="message-input" rows="1" placeholder="Tapez votre message..." 
                          class="flex-grow p-3 border-2 border-gray-300 rounded-full resize-none focus:border-blue-500 focus:ring-blue-500 transition duration-150"></textarea>
                <button id="send-message-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold w-12 h-12 rounded-full shadow-lg flex items-center justify-center transition duration-150 transform hover:scale-[1.05]">
                    <!-- Icône d'envoi SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 transform rotate-90 translate-y-[-1px] translate-x-[1px]">
                        <path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.599 60.599 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.599 60.599 0 0 0 3.478 2.405Z" />
                    </svg>
                </button>
            </div>

        </div>
        
        <!-- Écran du Jeu (à implémenter) -->
        <div id="game-screen" class="screen p-4 flex flex-col items-center justify-center h-full">
            <h1 class="text-3xl font-extrabold text-gray-900">Écran du Jeu</h1>
            <p class="mt-4 text-gray-600">Le jeu est en cours. Vos actions et informations de rôle seront affichées ici.</p>
        </div>

        <!-- Modale de Confirmation (Invisible par défaut) -->
        <div id="confirmation-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
            <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-2xl">
                <p id="confirmation-message" class="text-lg font-medium text-gray-800 mb-4">Êtes-vous sûr ?</p>
                <div class="flex justify-end space-x-3">
                    <button id="confirm-cancel-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-150">
                        Annuler
                    </button>
                    <button id="confirm-ok-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-150">
                        Confirmer
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        // --- Variables Globales ---
        let ws;
        let currentScreen = 'home';
        let currentRoomCode = null;
        let lobbyData = {};
        let userId = null; // ID unique du client
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        let confirmationCallback = null;
        
        // PARAMÈTRE DE CONNEXION FIXE
        // URL du serveur WebSocket (WSS) extraite de l'URL Render fournie.
        const WEBSOCKET_SERVER_URL = "wss://webrtc-epuisement-professionnel.onrender.com";


        // Éléments du DOM (mis en cache pour une utilisation facile)
        const appContainer = document.getElementById('app-container');
        const homeScreen = document.getElementById('home-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const joinCodeInput = document.getElementById('join-code-input');
        const createLobbyBtn = document.getElementById('create-lobby-btn');
        const joinLobbyBtn = document.getElementById('join-lobby-btn');
        const errorMessage = document.getElementById('error-message');
        const lobbyCodeDisplay = document.getElementById('lobby-code-display');
        const hostNameDisplay = document.getElementById('host-name-display');
        const playerCount = document.getElementById('player-count');
        const statusDisplay = document.getElementById('status-display');
        const leaveLobbyBtn = document.getElementById('leave-lobby-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendMessageBtn = document.getElementById('send-message-btn');
        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmationMessage = document.getElementById('confirmation-message');
        const confirmOkBtn = document.getElementById('confirm-ok-btn');
        const confirmCancelBtn = document.getElementById('confirm-cancel-btn');

        // Variables de Jeu/Énergie (pour la simulation)
        let energy = 10; // Énergie de départ
        let maxEnergy = 10; 
        let energyGainInterval = null;

        // --- Fonctions d'Utilité ---

        /** Navigation entre les écrans */
        function navigate(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
                screen.classList.add('hidden');
            });
            const targetScreen = document.getElementById(`${screenId}-screen`);
            if (targetScreen) {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('active');
                currentScreen = screenId;
                // Ajustement pour le mobile : assure le focus sur l'entrée du chat si c'est l'écran du lobby
                if (screenId === 'lobby') {
                    // Petite astuce pour s'assurer que le navigateur comprend la nouvelle disposition
                    setTimeout(() => messagesContainer.scrollTop = messagesContainer.scrollHeight, 100);
                }
            }
            clearMessage();
        }

        /** Génère un ID utilisateur unique ou le récupère depuis le stockage local */
        function initPersistance() {
            let storedId = localStorage.getItem('userId');
            if (!storedId) {
                storedId = crypto.randomUUID();
                localStorage.setItem('userId', storedId);
            }
            userId = storedId;
            // Récupérer le dernier pseudo utilisé
            const storedNickname = localStorage.getItem('nickname');
            if (storedNickname) {
                nicknameInput.value = storedNickname;
            }
        }

        /** Affiche un message d'erreur temporaire */
        function displayError(message) {
            errorMessage.textContent = message;
            setTimeout(() => {
                errorMessage.textContent = '';
            }, 5000);
        }

        /** Réinitialise l'affichage des messages */
        function clearMessage() {
             errorMessage.textContent = '';
        }

        /** Convertit l'heure en format lisible HH:MM */
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        /** Ajoute un message au conteneur de messages et fait défiler vers le bas */
        function addMessage(msg) {
            const isSystem = msg.action === 'SYSTEM_MESSAGE';
            const isSelf = msg.senderId === userId;
            const msgElement = document.createElement('div');
            
            // Conteneur de message
            msgElement.className = `flex ${isSelf ? 'justify-end' : 'justify-start'} w-full`;
            
            // Contenu du message
            const contentElement = document.createElement('div');
            contentElement.className = isSystem 
                ? 'system-message text-sm w-full' 
                : isSelf 
                    ? 'user-message-self' 
                    : 'user-message-other';
            
            if (isSystem) {
                contentElement.innerHTML = `[${formatTime(msg.timestamp)}] ${msg.content}`;
            } else {
                // Afficher le pseudo de l'autre utilisateur
                if (!isSelf) {
                    const nicknameElement = document.createElement('div');
                    nicknameElement.className = 'message-nickname';
                    nicknameElement.textContent = msg.nickname;
                    contentElement.appendChild(nicknameElement);
                }
                
                // Contenu principal du message
                const textElement = document.createElement('p');
                textElement.textContent = msg.content;
                contentElement.appendChild(textElement);

                // Horodatage dans le message
                const timeElement = document.createElement('span');
                timeElement.className = 'block text-right mt-1 text-xs opacity-70';
                timeElement.textContent = formatTime(msg.timestamp);
                contentElement.appendChild(timeElement);
            }

            msgElement.appendChild(contentElement);
            messagesContainer.appendChild(msgElement);

            // Défiler vers le bas (le plus important pour le chat)
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        /** Affiche une modale de confirmation */
        function showConfirmation(message, onConfirm) {
            confirmationMessage.textContent = message;
            confirmationModal.classList.remove('hidden', 'fade-out');
            confirmationModal.classList.add('flex', 'fade-in');
            confirmationCallback = onConfirm;
        }
        
        /** Gère la confirmation de la modale */
        confirmOkBtn.addEventListener('click', () => {
            if (confirmationCallback) {
                confirmationCallback();
            }
            confirmationModal.classList.remove('flex', 'fade-in');
            confirmationModal.classList.add('hidden', 'fade-out');
            confirmationCallback = null;
        });

        /** Gère l'annulation de la modale */
        confirmCancelBtn.addEventListener('click', () => {
            confirmationModal.classList.remove('flex', 'fade-in');
            confirmationModal.classList.add('hidden', 'fade-out');
            confirmationCallback = null;
        });


        // --- Gestion de l'Énergie (pour la simulation) ---

        function startEnergyGain() {
            if (energyGainInterval) clearInterval(energyGainInterval);
            // Simule l'obtention d'un point d'énergie toutes les 10 secondes
            energyGainInterval = setInterval(() => {
                if (energy < maxEnergy) {
                    energy++;
                    // Mettre à jour l'affichage de l'énergie (TODO: à ajouter dans l'UI)
                    console.log(`Énergie +1. Total: ${energy}`);
                }
            }, 10000); 
        }

        function stopEnergyGain() {
            if (energyGainInterval) {
                clearInterval(energyGainInterval);
                energyGainInterval = null;
            }
        }

        // --- Fonctions de WebSocket et API ---

        /** Initialisation de la connexion WebSocket */
        function initWebSocket() {
            // Utilisation de l'URL de serveur fixe fournie
            const wsUrl = WEBSOCKET_SERVER_URL; 

            try {
                ws = new WebSocket(wsUrl);
            } catch (e) {
                console.error("Erreur de création de WebSocket, URL invalide:", wsUrl, e);
                displayError("Erreur de connexion (URL invalide). Veuillez vérifier le protocole.");
                return; // Arrêter si la création échoue
            }
            

            ws.onopen = () => {
                console.log('Connecté au serveur WebSocket.');
                reconnectAttempts = 0; // Réinitialiser les tentatives de reconnexion
                
                // Si l'utilisateur est dans un salon, tenter de s'y reconnecter (pour les déconnexions courtes)
                if (currentRoomCode) {
                    sendToServer({
                        action: 'REJOIN_LOBBY',
                        code: currentRoomCode,
                        nickname: localStorage.getItem('nickname'),
                        userId: userId
                    });
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleServerMessage(data);
                } catch (e) {
                    console.error('Erreur de parsing du message:', e, event.data);
                }
            };

            ws.onclose = (event) => {
                console.log('Déconnecté du serveur WebSocket.', event);
                
                // Tenter de se reconnecter
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    console.log(`Tentative de reconnexion dans ${2 ** reconnectAttempts} secondes... (Tentative ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                    setTimeout(initWebSocket, (2 ** reconnectAttempts) * 1000);
                } else {
                    displayError('Connexion perdue. Veuillez recharger la page.');
                    leaveLobby(); // Revenir à l'écran d'accueil
                }
            };

            ws.onerror = (error) => {
                console.error('Erreur WebSocket:', error);
                // L'erreur sera suivie d'un événement de fermeture, donc pas besoin de naviguer ici.
            };
        }

        /** Envoie un message au serveur (avec vérification de l'état) */
        function sendToServer(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                message.userId = userId; // Ajouter l'ID utilisateur à tous les messages sortants
                ws.send(JSON.stringify(message));
            } else {
                console.error('WebSocket non connecté. Impossible d\'envoyer le message.', message);
                displayError('Erreur de connexion. Tentative de reconnexion en cours...');
            }
        }

        /** Gestion des messages reçus du serveur */
        function handleServerMessage(data) {
            console.log('Message reçu:', data);

            switch (data.action) {
                case 'LOBBY_CREATED':
                case 'LOBBY_JOINED':
                    currentRoomCode = data.code;
                    localStorage.setItem('nickname', data.nickname); // Sauvegarder le pseudo
                    lobbyCodeDisplay.textContent = data.code;
                    addMessage({ action: 'SYSTEM_MESSAGE', content: `Vous avez rejoint le salon ${data.code} !`, timestamp: Date.now() });
                    navigate('lobby');
                    startEnergyGain();
                    break;
                case 'LOBBY_LEFT':
                    // Le serveur a confirmé la sortie
                    leaveLobby();
                    break;
                case 'LOBBY_UPDATE':
                    lobbyData = data.lobby;
                    updateLobbyUI(lobbyData);
                    break;
                case 'ERROR':
                    displayError(`Erreur du serveur: ${data.content}`);
                    break;
                case 'MESSAGE':
                case 'SYSTEM_MESSAGE':
                    addMessage(data);
                    break;
                // --- Gestion du Jeu ---
                case 'GAME_STARTING':
                    addMessage({ action: 'SYSTEM_MESSAGE', content: `Le jeu va commencer ! Distribution des rôles...`, timestamp: Date.now() });
                    // TODO: Passer à l'écran de jeu ('game')
                    break;
                default:
                    console.warn('Action inconnue du serveur:', data.action);
            }
        }

        /** Met à jour l'interface du lobby */
        function updateLobbyUI(lobby) {
            const isHost = lobby.hostId === userId;
            const MIN_PLAYERS = 4; // Doit correspondre à la constante serveur
            const isReadyToStart = lobby.clients.length >= MIN_PLAYERS && lobby.gameStatus === 'WAITING';

            // Mettre à jour les infos principales
            playerCount.textContent = `Joueurs: ${lobby.clients.length}`;
            statusDisplay.textContent = lobby.gameStatus;
            
            // Afficher le nom de l'hôte (chercher dans la liste des joueurs)
            const hostClient = lobby.clients.find(c => c.id === lobby.hostId);
            hostNameDisplay.textContent = hostClient ? hostClient.nickname : 'Inconnu';

            // Afficher/Masquer le bouton Démarrer le Jeu
            if (isHost && isReadyToStart) { 
                startGameBtn.classList.remove('hidden');
            } else {
                startGameBtn.classList.add('hidden');
            }
        }

        // --- Événements d'Action ---

        createLobbyBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            if (nickname.length < 2) {
                displayError('Veuillez entrer un pseudo d\'au moins 2 caractères.');
                return;
            }
            sendToServer({
                action: 'CREATE_LOBBY',
                nickname: nickname
            });
        });

        joinLobbyBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            const code = joinCodeInput.value.trim();

            if (nickname.length < 2) {
                displayError('Veuillez entrer un pseudo d\'au moins 2 caractères.');
                return;
            }
            if (code.length !== 5 || isNaN(code)) {
                displayError('Veuillez entrer un code de salon valide à 5 chiffres.');
                return;
            }

            sendToServer({
                action: 'JOIN_LOBBY',
                nickname: nickname,
                code: code
            });
        });

        startGameBtn.addEventListener('click', () => {
             showConfirmation("Êtes-vous sûr de vouloir démarrer le jeu ? Les autres joueurs devront attendre pour rejoindre.", () => {
                 sendToServer({
                    action: 'START_GAME'
                });
             });
        });

        function sendMessage() {
            const content = messageInput.value.trim();
            if (content === '') {
                // Pas d'alerte sur mobile, juste ignorer
                return;
            }
            
            // TODO: Vérifier si le joueur a assez d'énergie pour parler et la dépenser.
            // Pour l'instant, on laisse le chat libre pour les tests.

            sendToServer({
                action: 'MESSAGE',
                content: content
            });

            messageInput.value = '';
            // Ajustement important: S'assurer que le focus n'est pas perdu et que le clavier reste bas
            messageInput.focus();
        }
        
        leaveLobbyBtn.addEventListener('click', () => {
            showConfirmation("Êtes-vous sûr de vouloir quitter le salon ? La déconnexion est immédiate.", () => {
                sendToServer({
                    action: 'LEAVE_LOBBY'
                });
            });
        });
        
        function leaveLobby() {
            messagesContainer.innerHTML = '';
            currentRoomCode = null;
            lobbyData = {};
            // TODO: stopTimer(); 
            stopEnergyGain(); // S'assurer que le gain d'énergie s'arrête en quittant
            navigate('home');
            clearMessage();
        }

        // --- Événements Clavier/Bouton ---
        
        sendMessageBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            // Empêche la touche Entrée par défaut d'ajouter un saut de ligne dans la zone de texte
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // --- Initialisation ---
        initPersistance(); 
        window.onload = initWebSocket;
    </script>
</body>
</html>
