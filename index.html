<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épuisement Professionnel - Jeu Social P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs du jeu */
            --color-bg-dark: #2A2E33; /* Gris ardoisé foncé */
            --color-chat-dark: #373b40;
            --color-accent-white: #e0e0e0;
            --color-progress-bar: #e0e0e0;
        }

        /* Couleurs pour les joueurs (pâles) */
        .color-Rouge { --player-color: #F8BBD0; }
        .color-Orange { --player-color: #FFCC80; }
        .color-Bleu { --player-color: #BBDEFB; }
        .color-Mauve { --player-color: #E1BEE7; }
        .color-Vert { --player-color: #C8E6C9; }
        .color-Rose { --player-color: #F8BBD0; }
        .color-Turquoise { --player-color: #B2EBF2; }
        .color-Jaune { --player-color: #FFF9C4; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background-color: var(--color-chat-dark);
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Styles spécifiques aux bulles de conversation */
        #chat-window {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-top: 5rem; /* Espace pour la barre supérieure */
        }

        .message-bubble {
            max-width: 75%;
            padding: 0.5rem 0.75rem;
            border-radius: 1rem;
            position: relative;
            word-wrap: break-word;
        }

        .message-left {
            align-self: flex-start;
            background-color: var(--color-bg-dark); /* Bulle des autres joueurs */
            border-top-left-radius: 0;
            border: 2px solid var(--player-color, var(--color-accent-white));
        }

        .message-right {
            align-self: flex-end;
            background-color: #3f4449; /* Bulle du joueur local */
            border-top-right-radius: 0;
            border: 2px solid var(--player-color, var(--color-accent-white));
        }

        .message-meta {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        
        /* Couleur du nom dans le chat */
        .player-name-in-chat {
            font-weight: bold;
            color: var(--player-color);
        }

        /* Barre de saisie */
        .input-area {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--color-accent-white);
        }

        #message-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: none;
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
            outline: none;
            resize: none;
        }
        
        /* Style des boutons */
        .btn-primary {
            background-color: #4CAF50; /* Vert */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #45a049;
        }

        .btn-primary:disabled {
            background-color: #5A5A5A;
            cursor: not-allowed;
        }

        /* Barre de statut supérieure */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background-color: var(--color-chat-dark);
            z-index: 10; /* S'assure qu'elle est au-dessus du chat */
            border-bottom: 1px solid var(--color-accent-white);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #5A5A5A;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%; /* Sera mis à jour par JS */
            background-color: var(--color-progress-bar);
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="game-container">
    
    <!-- Barre de statut supérieure (pour le jeu) -->
    <div class="status-bar hidden" id="game-status-bar">
        <!-- Barre de progression de l'objectif de manche -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        
        <div class="flex justify-between items-center text-sm font-mono">
            <!-- Compte à rebours -->
            <div id="countdown-timer">00:00</div>
            <!-- Points de travail du joueur local -->
            <div id="work-points" class="font-bold" style="color: var(--player-color, var(--color-accent-white));">
                Points de travail: 0
            </div>
        </div>
    </div>
    
    <!-- Écran de connexion/Lobby -->
    <div id="lobby-screen" class="p-8 flex flex-col justify-center items-center h-full text-center">
        <h1 class="text-3xl font-bold mb-6">Épuisement Professionnel</h1>
        <p class="mb-6">Entrez votre nom et choisissez votre couleur pour rejoindre le lobby.</p>

        <input type="text" id="player-name-input" placeholder="Votre nom" 
               class="w-full max-w-xs p-3 rounded-lg mb-4 bg-gray-600 text-white focus:ring-blue-500 focus:border-blue-500">
        
        <div class="flex space-x-2 mb-6">
            <select id="player-color-select" class="p-3 rounded-lg bg-gray-600 text-white">
                <!-- Les options de couleur seront ajoutées par JS -->
            </select>
        </div>

        <button id="join-lobby-btn" class="btn-primary w-full max-w-xs" disabled>
            Rejoindre le Lobby
        </button>
        
        <div id="lobby-info" class="mt-8 text-center hidden">
            <p class="text-lg font-semibold mb-2">Statut du Lobby</p>
            <p id="player-count">Joueurs connectés: 1 (Vous)</p>
            
            <!-- Affiché UNIQUEMENT si l'utilisateur est l'HÔTE -->
            <button id="start-game-btn" class="btn-primary mt-4" disabled>
                Démarrer la partie (Min 4 joueurs)
            </button>
        </div>

        <p id="connection-status" class="mt-4 text-sm text-gray-400">Statut: Déconnecté</p>

    </div>

    <!-- Interface du jeu (Chat) -->
    <div id="game-interface" class="flex flex-col h-full hidden">
        <div id="chat-window" class="flex-grow">
            <!-- Les messages seront ajoutés ici -->
        </div>

        <div class="input-area">
            <textarea id="message-input" rows="1" placeholder="Écrire un message..."
                      class="focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
    </div>

</div>

<script type="module">
    // --- IMPORTATIONS FIREBASE ET WEBRTC ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    
    // --- VARIABLES GLOBALES FIREBASE ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    
    let app, db, auth, userId = null;

    // --- CONFIGURATION DU JEU ---
    const SIGNALING_SERVER_URL = "wss://webrtc-epuisement-professionnel.onrender.com";
    const MIN_PLAYERS = 4;
    const MAX_PLAYERS = 8;
    const TIME_TO_EARN_POINTS_MS = 10000; // 10 secondes
    const POINTS_EARNED_PER_INTERVAL = 10; // 10 points
    
    // Couleurs du jeu
    const PLAYER_COLORS = [
        { name: "Rouge", class: "color-Rouge" },
        { name: "Orange", class: "color-Orange" },
        { name: "Bleu", class: "color-Bleu" },
        { name: "Mauve", class: "color-Mauve" },
        { name: "Vert", class: "color-Vert" },
        { name: "Rose", class: "color-Rose" },
        { name: "Turquoise", class: "color-Turquoise" },
        { name: "Jaune", class: "color-Jaune" },
    ];

    // --- ÉTAT LOCAL DU JEU ---
    let localPlayer = {
        id: crypto.randomUUID(), // ID unique pour ce joueur dans la session
        name: null,
        colorName: null,
        colorClass: null,
        isHost: false, // Seulement l'hôte maintient l'état du lobby
        workPoints: 0,
    };
    
    let ws = null;
    let peers = new Map(); // Map de 'peerId' -> RTCPeerConnection
    let dataChannels = new Map(); // Map de 'peerId' -> RTCDataChannel

    // État du Lobby (maintenu par l'hôte)
    let connectedPlayers = new Map(); // Map de 'playerId' -> { name, colorClass, isReady, peerConnectionId }
    
    // --- ÉLÉMENTS DU DOM ---
    const $nameInput = document.getElementById('player-name-input');
    const $colorSelect = document.getElementById('player-color-select');
    const $joinBtn = document.getElementById('join-lobby-btn');
    const $startBtn = document.getElementById('start-game-btn');
    const $lobbyScreen = document.getElementById('lobby-screen');
    const $gameInterface = document.getElementById('game-interface');
    const $chatWindow = document.getElementById('chat-window');
    const $messageInput = document.getElementById('message-input');
    const $connectionStatus = document.getElementById('connection-status');
    const $playerCount = document.getElementById('player-count');
    const $gameStatusBar = document.getElementById('game-status-bar');
    const $workPoints = document.getElementById('work-points');

    // --- FONCTIONS UTILITAIRES ---

    /** Initialise Firebase (Auth et Firestore) */
    async function initFirebase() {
        try {
            if (Object.keys(firebaseConfig).length === 0) {
                console.warn("Configuration Firebase manquante. L'authentification et Firestore ne seront pas disponibles.");
                return;
            }
            
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Tente de se connecter avec le token personnalisé ou de manière anonyme
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("Authentification Firebase réussie. User ID:", userId);
                    // L'authentification est prête, on peut initialiser le lobby
                    checkLobbyReadiness();
                } else {
                    console.error("Échec de l'authentification Firebase.");
                }
            });
        } catch (error) {
            console.error("Erreur lors de l'initialisation de Firebase:", error);
        }
    }

    /** Met à jour l'affichage de l'hôte avec le nombre de joueurs */
    function updatePlayerCountDisplay() {
        const count = connectedPlayers.size;
        $playerCount.textContent = `Joueurs connectés: ${count} / ${MAX_PLAYERS}`;

        if (localPlayer.isHost) {
            const canStart = count >= MIN_PLAYERS;
            $startBtn.disabled = !canStart;
            $startBtn.textContent = canStart 
                ? `Démarrer la partie (${count} joueurs)` 
                : `Démarrer la partie (Min ${MIN_PLAYERS} joueurs)`;
        }
    }

    /** Ajoute un message à la fenêtre de chat */
    function addMessage(senderName, senderColorClass, message, isLocal = false) {
        const messageContainer = document.createElement('div');
        const bubble = document.createElement('div');
        const meta = document.createElement('div');

        // Récupère la variable CSS pour la couleur du joueur
        const colorVar = getComputedStyle(document.documentElement)
                                .getPropertyValue(`--player-color`);

        bubble.classList.add('message-bubble');
        bubble.textContent = message;

        if (isLocal) {
            messageContainer.classList.add('flex', 'justify-end');
            bubble.classList.add('message-right');
            bubble.style.setProperty('--player-color', localPlayer.colorClass ? `var(${localPlayer.colorClass})` : colorVar);
        } else {
            messageContainer.classList.add('flex', 'justify-start', senderColorClass);
            bubble.classList.add('message-left');
            // Définit la couleur d'accentuation de la bulle pour les autres joueurs
            bubble.style.setProperty('--player-color', `var(--player-color)`);
            
            // Méta-données (Nom de l'expéditeur)
            meta.classList.add('message-meta');
            meta.textContent = senderName;
            meta.style.color = `var(--player-color)`; // Nom dans la couleur du joueur
            messageContainer.appendChild(meta);
            
            messageContainer.style.setProperty('--player-color', `var(--player-color)`);
        }
        
        messageContainer.appendChild(bubble);
        $chatWindow.appendChild(messageContainer);
        $chatWindow.scrollTop = $chatWindow.scrollHeight;
    }
    
    /** Ajout des options de couleur au sélecteur */
    function populateColorSelect() {
        PLAYER_COLORS.forEach(color => {
            const option = document.createElement('option');
            option.value = color.name;
            option.textContent = color.name;
            option.className = color.class;
            $colorSelect.appendChild(option);
        });
        // Sélectionne une couleur aléatoire par défaut
        const randomIndex = Math.floor(Math.random() * PLAYER_COLORS.length);
        $colorSelect.value = PLAYER_COLORS[randomIndex].name;
    }
    
    // --- LOGIQUE WEBRTC ET SIGNALING ---

    /** Connecte au serveur de signalisation WebSocket */
    function connectToSignalingServer(isHost) {
        return new Promise((resolve, reject) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                resolve(ws);
                return;
            }
            
            ws = new WebSocket(SIGNALING_SERVER_URL);
            $connectionStatus.textContent = "Statut: Connexion au serveur...";

            ws.onopen = () => {
                console.log("Connecté au serveur de signalisation.");
                $connectionStatus.textContent = "Statut: Connecté. En attente d'autres joueurs...";
                localPlayer.isHost = isHost;
                
                // L'hôte est le premier joueur dans sa propre liste
                connectedPlayers.set(localPlayer.id, {
                    name: localPlayer.name,
                    colorClass: localPlayer.colorClass,
                    isHost: true,
                    peerConnectionId: null // Pas de connexion P2P vers soi-même
                });
                updatePlayerCountDisplay();
                
                resolve(ws);
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                console.log("Message de signalisation reçu:", message);

                switch (message.type) {
                    case 'offer':
                        handleOffer(message);
                        break;
                    case 'answer':
                        handleAnswer(message);
                        break;
                    case 'candidate':
                        handleCandidate(message);
                        break;
                    case 'new_peer':
                        // Reçu par l'hôte et les autres joueurs déjà connectés
                        if (localPlayer.isHost) {
                            // L'hôte crée une offre pour le nouveau pair
                            createOffer(message.senderId);
                        } else {
                            // Les autres joueurs créent une offre pour le nouveau pair
                            // S'ils n'ont pas encore de connexion avec lui (mappage full mesh)
                            if (!peers.has(message.senderId)) {
                                createOffer(message.senderId);
                            }
                        }
                        break;
                    case 'join_lobby':
                        handleLobbyJoin(message);
                        break;
                    case 'chat':
                        // Message reçu via le canal de données (P2P)
                        if (message.senderId !== localPlayer.id) {
                            const sender = connectedPlayers.get(message.senderId);
                            if (sender) {
                                addMessage(sender.name, sender.colorClass, message.text);
                            } else {
                                console.warn("Message de chat d'un expéditeur inconnu:", message.senderId);
                            }
                        }
                        break;
                    case 'start_game':
                        startGame();
                        break;
                    // Ajoutez d'autres types de messages de jeu ici...
                }
            };

            ws.onerror = (error) => {
                console.error("Erreur WebSocket:", error);
                $connectionStatus.textContent = "Statut: Erreur de connexion.";
                reject(error);
            };

            ws.onclose = () => {
                console.log("Déconnecté du serveur de signalisation.");
                $connectionStatus.textContent = "Statut: Déconnecté.";
            };
        });
    }

    /** Envoie un message de signalisation au serveur */
    function sendSignalingMessage(message) {
        message.senderId = localPlayer.id;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(message));
        } else {
            console.error("WebSocket non connecté. Impossible d'envoyer le message de signalisation.");
        }
    }
    
    /** Envoie un message P2P à tous les pairs connectés */
    function broadcastData(message) {
        dataChannels.forEach((channel, peerId) => {
            if (channel.readyState === 'open') {
                try {
                    channel.send(JSON.stringify(message));
                } catch (e) {
                    console.error(`Erreur lors de l'envoi au pair ${peerId}:`, e);
                }
            } else {
                console.warn(`Canal de données vers ${peerId} n'est pas prêt. État: ${channel.readyState}`);
            }
        });
    }

    /** Crée une nouvelle connexion RTCPeerConnection */
    function createPeerConnection(peerId, isInitiator) {
        const pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        });

        // 1. Gestion des candidats ICE
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignalingMessage({
                    type: 'candidate',
                    targetId: peerId,
                    candidate: event.candidate
                });
            }
        };

        // 2. Événement de canal de données
        if (isInitiator) {
            // Créateur de la connexion
            const dataChannel = pc.createDataChannel("chat-channel");
            setupDataChannel(peerId, dataChannel);
            pc.ondatachannel = (event) => setupDataChannel(peerId, event.channel); // Fallback ou double-vérification
        } else {
            // Récepteur de la connexion
            pc.ondatachannel = (event) => setupDataChannel(peerId, event.channel);
        }

        // 3. Gestion de l'état de la connexion (pour le débogage)
        pc.oniceconnectionstatechange = (event) => {
            console.log(`État ICE pour ${peerId}: ${pc.iceConnectionState}`);
            // Gérer les déconnexions ici
            if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') {
                console.log(`Connexion échouée/fermée avec ${peerId}.`);
                handlePeerDisconnection(peerId);
            }
        };

        peers.set(peerId, pc);
        return pc;
    }
    
    /** Configuration d'un canal de données */
    function setupDataChannel(peerId, channel) {
        channel.onopen = () => {
            console.log(`Canal de données ouvert avec ${peerId}`);
            dataChannels.set(peerId, channel);
            
            // Si c'est un nouveau pair, le pair local doit s'annoncer à l'autre pair.
            // L'hôte a déjà géré l'ajout à la liste dans handleLobbyJoin.
            
            // Si le pair est l'hôte, il peut mettre à jour le compteur global via le canal de données si besoin.
            if (localPlayer.isHost) {
                // S'assurer que le nouveau joueur est informé de tous les joueurs connectés
                sendLobbyState(peerId);
            }
        };
        
        channel.onmessage = (event) => {
            const message = JSON.parse(event.data);
            // Si le message est un message de chat, il sera géré par ws.onmessage
            // Sinon, il peut s'agir d'un message de jeu P2P
            if (message.type === 'chat') {
                 if (message.senderId !== localPlayer.id) {
                    const sender = connectedPlayers.get(message.senderId);
                    if (sender) {
                        addMessage(sender.name, sender.colorClass, message.text);
                    }
                }
            } else if (message.type === 'lobby_state') {
                // Reçu par un non-hôte. Met à jour la liste des joueurs
                handleLobbyState(message);
            }
        };
        
        channel.onclose = () => {
            console.log(`Canal de données fermé avec ${peerId}`);
            dataChannels.delete(peerId);
            handlePeerDisconnection(peerId);
        };
    }
    
    /** Envoie l'état complet du lobby à un pair spécifique via P2P */
    function sendLobbyState(targetId) {
        if (!localPlayer.isHost) return;

        const playerList = Array.from(connectedPlayers.entries()).map(([id, player]) => ({
            id,
            name: player.name,
            colorClass: player.colorClass,
            isHost: player.isHost,
        }));

        const message = {
            type: 'lobby_state',
            players: playerList,
            hostId: localPlayer.id,
        };

        const channel = dataChannels.get(targetId);
        if (channel && channel.readyState === 'open') {
            channel.send(JSON.stringify(message));
        }
    }

    /** Gère la réception de l'état du lobby par un non-hôte */
    function handleLobbyState(message) {
        // Le non-hôte met à jour sa liste de joueurs en fonction de l'hôte
        connectedPlayers.clear();
        message.players.forEach(p => {
            connectedPlayers.set(p.id, p);
            if (p.id === localPlayer.id) {
                // Assurez-vous que les informations locales sont à jour
                localPlayer.colorClass = p.colorClass;
            }
        });
        updatePlayerCountDisplay();
        $lobbyScreen.querySelector('#lobby-info').classList.remove('hidden');
        $playerCount.textContent = `Lobby de l'hôte (${message.hostId}): ${connectedPlayers.size} joueurs.`;
    }

    /** Gère la déconnexion d'un pair */
    function handlePeerDisconnection(peerId) {
        peers.delete(peerId);
        dataChannels.delete(peerId);
        
        // Si c'est l'hôte, retirez le joueur de la liste des joueurs
        if (localPlayer.isHost) {
            const disconnectedPlayer = connectedPlayers.get(peerId);
            if (disconnectedPlayer) {
                connectedPlayers.delete(peerId);
                console.log(`Le joueur ${disconnectedPlayer.name} a quitté le lobby.`);
                updatePlayerCountDisplay();
                // Annoncer la déconnexion à tous les pairs (via P2P)
                broadcastData({ type: 'player_leave', playerId: peerId });
            }
        }
        // TODO: Gérer la migration de l'hôte si l'hôte se déconnecte.
    }
    
    /** Création d'une offre WebRTC (Initiateur) */
    async function createOffer(targetId) {
        const pc = createPeerConnection(targetId, true);
        
        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            sendSignalingMessage({
                type: 'offer',
                targetId: targetId,
                sessionDescription: pc.localDescription
            });
        } catch (error) {
            console.error("Erreur lors de la création de l'offre:", error);
        }
    }

    /** Gestion d'une offre WebRTC (Récepteur) */
    async function handleOffer(message) {
        const pc = createPeerConnection(message.senderId, false);
        
        try {
            await pc.setRemoteDescription(new RTCSessionDescription(message.sessionDescription));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            sendSignalingMessage({
                type: 'answer',
                targetId: message.senderId,
                sessionDescription: pc.localDescription
            });
            
        } catch (error) {
            console.error("Erreur lors de la gestion de l'offre:", error);
        }
    }

    /** Gestion d'une réponse WebRTC (Initiateur) */
    async function handleAnswer(message) {
        const pc = peers.get(message.senderId);
        if (pc) {
            try {
                await pc.setRemoteDescription(new RTCSessionDescription(message.sessionDescription));
            } catch (error) {
                console.error("Erreur lors de la gestion de la réponse:", error);
            }
        }
    }

    /** Ajout d'un candidat ICE */
    async function handleCandidate(message) {
        const pc = peers.get(message.senderId);
        if (pc && message.candidate) {
            try {
                await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
            } catch (error) {
                console.error("Erreur lors de l'ajout du candidat ICE:", error);
            }
        }
    }
    
    // --- LOGIQUE SPÉCIFIQUE DU LOBBY ---

    /** Gère la réception d'un message 'join_lobby' (sur le canal de signalisation) */
    function handleLobbyJoin(message) {
        // Cet événement est principalement pour l'hôte qui reçoit le message
        // avant que la connexion P2P ne soit établie.
        if (localPlayer.isHost) {
            console.log(`Nouveau joueur: ${message.playerName} (ID: ${message.playerId})`);
            
            // 1. Ajouter le joueur à la liste locale de l'hôte (s'il n'y est pas)
            if (!connectedPlayers.has(message.playerId)) {
                 // S'assurer que la couleur choisie est parmi les couleurs disponibles
                 const color = PLAYER_COLORS.find(c => c.name === message.playerColor);
                 
                 connectedPlayers.set(message.playerId, {
                    id: message.playerId,
                    name: message.playerName,
                    colorClass: color ? `color-${color.name}` : 'color-Rouge',
                    isHost: false,
                    peerConnectionId: message.senderId // L'ID pour la connexion WS
                });

                updatePlayerCountDisplay();
            }
            
            // 2. L'hôte démarre la création de la connexion WebRTC avec le nouveau pair
            createOffer(message.senderId);
        } else {
             // Si je ne suis pas l'hôte, j'ai déjà envoyé ma demande,
             // le message 'join_lobby' reçu est probablement un écho du serveur ou
             // un autre joueur qui se connecte. Le non-hôte va attendre le 'lobby_state'
             // de l'hôte après l'établissement du canal de données.
        }
    }
    
    /** Envoie le message de join_lobby à tous (le serveur le relaye) */
    function sendJoinLobbyMessage() {
        // Trouver la classe CSS de la couleur sélectionnée
        const selectedColorName = $colorSelect.value;
        const color = PLAYER_COLORS.find(c => c.name === selectedColorName);
        
        localPlayer.name = $nameInput.value;
        localPlayer.colorName = selectedColorName;
        localPlayer.colorClass = color ? `color-${color.name}` : 'color-Rouge';
        
        // Appliquer la couleur au style local pour les messages locaux/statut
        document.body.style.setProperty('--player-color', localPlayer.colorClass ? `var(${localPlayer.colorClass})` : 'var(--color-accent-white)');
        
        sendSignalingMessage({
            type: 'join_lobby',
            playerId: localPlayer.id,
            playerName: localPlayer.name,
            playerColor: localPlayer.colorName,
            senderId: localPlayer.id // S'assure que le destinataire sait qui envoie
        });
        
        console.log(`Envoyé demande de join_lobby: ${localPlayer.name}`);
        
        // Afficher l'écran du lobby
        document.getElementById('lobby-info').classList.remove('hidden');
        $joinBtn.disabled = true;
        
        // Si je suis l'hôte, je dois attendre les connexions entrantes pour faire l'offre.
        if (localPlayer.isHost) {
            console.log("Vous êtes l'hôte. En attente de connexions P2P.");
        }
    }

    // --- LOGIQUE DU JEU ---
    
    function startGame() {
        $lobbyScreen.classList.add('hidden');
        $gameInterface.classList.remove('hidden');
        $gameStatusBar.classList.remove('hidden');
        
        // Focus sur la zone de saisie pour commencer à écrire
        setTimeout(() => $messageInput.focus(), 100);
        
        console.log("La partie a commencé!");
        addMessage("Système", "color-Rouge", "La partie a commencé! Bon travail à tous!", true);
        
        // Démarrer l'accumulation de points
        startWorkPointsAccumulation();
    }
    
    function startWorkPointsAccumulation() {
        // Cette fonction sera exécutée toutes les 10 secondes (TIME_TO_EARN_POINTS_MS)
        setInterval(() => {
            localPlayer.workPoints += POINTS_EARNED_PER_INTERVAL;
            $workPoints.textContent = `Points de travail: ${localPlayer.workPoints}`;
            console.log(`Points de travail accumulés: ${localPlayer.workPoints}`);
        }, TIME_TO_EARN_POINTS_MS);
    }


    // --- GESTION DES ÉVÉNEMENTS ---

    /** Vérifie si l'utilisateur peut rejoindre le lobby */
    function checkLobbyReadiness() {
        const nameValid = $nameInput.value.trim().length > 0;
        $joinBtn.disabled = !nameValid || ws === null || ws.readyState !== WebSocket.OPEN;
    }
    
    $nameInput.addEventListener('input', checkLobbyReadiness);

    $joinBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            // Le premier joueur à cliquer sur "Rejoindre" devient l'hôte par défaut
            // dans cette implémentation simple.
            localPlayer.isHost = true;
            connectToSignalingServer(true)
                .then(() => sendJoinLobbyMessage())
                .catch(err => console.error("Échec de la connexion et de l'envoi du message de lobby.", err));
        } else {
             // Si WS est déjà ouvert, cela signifie que je me suis déjà connecté,
             // mais je n'ai pas envoyé le message de lobby.
             sendJoinLobbyMessage();
        }
    });

    $startBtn.addEventListener('click', () => {
        if (localPlayer.isHost && connectedPlayers.size >= MIN_PLAYERS) {
            // L'hôte envoie un message P2P à tout le monde pour démarrer la partie
            broadcastData({ type: 'start_game' });
            // L'hôte démarre aussi sa partie
            startGame();
        } else {
            // Afficher un message d'erreur/avertissement (modal ou console)
            console.warn("Impossible de démarrer la partie : pas assez de joueurs ou vous n'êtes pas l'hôte.");
        }
    });

    $messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const messageText = $messageInput.value.trim();
            if (messageText) {
                // 1. Ajouter le message local
                addMessage(localPlayer.name, localPlayer.colorClass, messageText, true);
                
                // 2. Créer le message P2P
                const chatMessage = {
                    type: 'chat',
                    senderId: localPlayer.id,
                    text: messageText,
                };
                
                // 3. Diffuser à tous les pairs connectés
                broadcastData(chatMessage);
                
                $messageInput.value = '';
                // S'assurer que le focus est maintenu après l'envoi
                $messageInput.focus(); 
            }
        }
    });
    
    // --- INITIALISATION ---
    
    // Initialisation de Firebase et de l'état du lobby
    populateColorSelect();
    initFirebase();
    
    // Pour les non-hôtes, si la connexion au serveur de signalisation est déjà faite
    // (par exemple, si la page a été rechargée), on tente de rejoindre sans être hôte.
    // Pour simplifier, le joueur doit cliquer sur "Rejoindre le Lobby" pour initier la connexion
    // et déterminer son rôle (hôte ou non).
    
</script>
</body>
</html>
