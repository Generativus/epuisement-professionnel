<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Déduction Sociale - Mobile</title>
    <!-- Chargement de la police Inter et de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuration de la police Inter et configuration de base */
        :root {
            font-family: 'Inter', sans-serif;
            --main-color: #4f46e5; /* indigo-600 */
        }

        /* Utilisation de dvh (Dynamic Viewport Height) pour une meilleure gestion sur mobile (barre d'adresse/clavier) */
        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        
        /* Conteneur principal: prend toute la hauteur de l'écran visible */
        #app-container {
            height: 100dvh;
            max-height: 100dvh;
            width: 100%;
            margin: 0;
            /* Limiter la largeur sur les grands écrans pour le desktop */
            @media (min-width: 1024px) {
                max-width: 42rem; /* lg:max-w-xl */
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }

        /* S'assurer que le conteneur de messages gère correctement le défilement dans le Flexbox */
        #messages-container {
            min-height: 0; /* Important pour que flex-1 fonctionne dans un conteneur flex-col */
        }
        
        /* Styles pour les messages */
        .message-box {
            background-color: #ffffff;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .system-message {
            text-align: center;
            font-style: italic;
            color: #4b5563; /* gray-600 */
        }
    </style>
</head>
<body class="selection:bg-indigo-300 selection:text-indigo-900">
    <!-- Conteneur principal de l'application -->
    <div id="app-container" class="bg-white w-screen flex flex-col items-center justify-center overflow-hidden">
        
        <!-- Vue Accueil (Connexion/Création) -->
        <div id="home-view" class="w-full p-6 sm:p-8 flex flex-col items-center justify-center space-y-6">
            <h1 class="text-3xl font-bold text-gray-800">Jeu de Déduction Sociale</h1>
            
            <div id="error-message" class="hidden text-red-600 bg-red-100 p-3 rounded-lg w-full text-center"></div>

            <input type="text" id="nickname-input" placeholder="Votre pseudonyme" class="p-3 border border-gray-300 rounded-xl w-full max-w-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" maxlength="15">
            <input type="text" id="code-input" placeholder="Code du salon (5 chiffres)" class="p-3 border border-gray-300 rounded-xl w-full max-w-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" maxlength="5">
            
            <button id="join-btn" class="w-full max-w-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-150 transform hover:scale-[1.01] active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
                Rejoindre le salon
            </button>
            
            <div class="flex items-center w-full max-w-sm">
                <hr class="flex-grow border-t border-gray-300">
                <span class="px-3 text-gray-500">OU</span>
                <hr class="flex-grow border-t border-gray-300">
            </div>

            <button id="create-btn" class="w-full max-w-sm bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-150 transform hover:scale-[1.01] active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50">
                Créer un nouveau salon
            </button>
        </div>

        <!-- Vue Salon/Jeu (Mobile-First: Structure en 3 parties) -->
        <div id="lobby-view" class="hidden w-full h-full lg:max-w-xl flex flex-col bg-white overflow-hidden">
            
            <!-- 1. En-tête (Header) : Infos du Salon et Bouton Quitter -->
            <div id="lobby-header" class="p-4 border-b border-gray-100 bg-white flex flex-col space-y-2">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Salon: <span id="room-code-display" class="text-indigo-600"></span></h2>
                    <button id="leave-lobby-btn" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-sm font-medium rounded-full transition duration-150 active:scale-95">
                        Quitter
                    </button>
                </div>

                <!-- Informations et Statut du Jeu -->
                <div id="lobby-info" class="text-sm text-gray-600 flex justify-between items-center">
                    <p>Joueurs: <span id="players-count">0</span> / <span id="max-players">10</span></p>
                    <p>Hôte: <span id="host-id-display"></span></p>
                </div>
                
                <!-- BOUTON DÉMARRER LA PARTIE (Ajouté) -->
                <button id="start-game-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl shadow-lg transition duration-150 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    Démarrer la partie
                </button>

                <div id="game-status" class="hidden flex justify-between items-center text-sm font-semibold">
                    <p id="role-display" class="text-green-600"></p>
                    <p id="game-timer" class="text-red-600"></p>
                </div>
            </div>
            
            <!-- 2. Corps (Body) : Messages et Affichage des Rôles (Scrollable) -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-3 shadow-inner">
                <!-- Les messages seront ajoutés ici par JavaScript -->
            </div>

            <!-- 3. Pied de Page (Footer) : Zone de Saisie du Chat (Toujours Visible) -->
            <form id="message-form" class="flex space-x-2 p-4 border-t border-gray-200 bg-white items-end">
                <input type="text" id="message-input" placeholder="Écrire un message..." class="flex-1 p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                <button type="submit" id="send-message-btn" class="flex-shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-150 transform hover:scale-[1.01] active:scale-[0.98]">
                    Envoyer
                </button>
            </form>
        </div>

        <!-- Modale de Confirmation (hors écran, affichée par JS) -->
        <div id="confirmation-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 transition-opacity duration-300">
            <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm space-y-4">
                <p id="confirmation-text" class="text-gray-800 text-lg font-medium">Êtes-vous sûr ?</p>
                <div class="flex justify-end space-x-3">
                    <button id="confirm-cancel-btn" class="px-4 py-2 text-sm font-semibold text-gray-600 bg-gray-200 rounded-lg hover:bg-gray-300 transition duration-150">
                        Annuler
                    </button>
                    <button id="confirm-ok-btn" class="px-4 py-2 text-sm font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 transition duration-150">
                        Confirmer
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript">
        // --- Configuration du Serveur WebSocket ---
        // L'URL de votre serveur Render
        const WS_SERVER = 'wss://webrtc-epuisement-professionnel.onrender.com';
        
        // --- Constantes Client ---
        const MIN_PLAYERS = 4; // Doit correspondre à la constante serveur
        const ENERGY_CAPACITY = 5;
        const ENERGY_GAIN_RATE = 2000; // 2000 ms = 2 secondes pour regagner 1 point
        const ENERGY_MESSAGE_COST = 1;
        
        let ws = null;
        let isConnected = false;
        let currentRoomCode = null;
        let nickname = '';
        let userId = null;
        let lobbyData = {};
        let currentTimer = null;
        let energyInterval = null;
        let currentEnergy = ENERGY_CAPACITY;

        // --- Récupération des éléments DOM ---
        const appContainer = document.getElementById('app-container');
        const homeView = document.getElementById('home-view');
        const lobbyView = document.getElementById('lobby-view');
        const messagesContainer = document.getElementById('messages-container');
        const nicknameInput = document.getElementById('nickname-input');
        const codeInput = document.getElementById('code-input');
        const joinBtn = document.getElementById('join-btn');
        const createBtn = document.getElementById('create-btn');
        const errorMessage = document.getElementById('error-message');
        const roomCodeDisplay = document.getElementById('room-code-display');
        const playersCountDisplay = document.getElementById('players-count');
        const hostIdDisplay = document.getElementById('host-id-display');
        const leaveLobbyBtn = document.getElementById('leave-lobby-btn');
        const messageInput = document.getElementById('message-input');
        const sendMessageBtn = document.getElementById('send-message-btn');
        const messageForm = document.getElementById('message-form');
        const gameStatusDiv = document.getElementById('game-status');
        const roleDisplay = document.getElementById('role-display');
        const gameTimer = document.getElementById('game-timer');
        const startGameBtn = document.getElementById('start-game-btn'); // NOUVEAU: Bouton Démarrer la partie
        
        // Modale de confirmation
        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmationText = document.getElementById('confirmation-text');
        let confirmCallback = null;
        const confirmOkBtn = document.getElementById('confirm-ok-btn');
        const confirmCancelBtn = document.getElementById('confirm-cancel-btn');


        // --- Fonctions de Navigation et UI ---

        /** Navigue entre les vues de l'application. */
        function navigate(viewName) {
            homeView.classList.add('hidden');
            lobbyView.classList.add('hidden');

            if (viewName === 'home') {
                homeView.classList.remove('hidden');
                // S'assurer que le conteneur principal a la bonne taille pour la vue d'accueil
                appContainer.classList.remove('h-full', 'w-full', 'overflow-hidden');
                appContainer.classList.add('lg:max-w-xl', 'rounded-xl', 'shadow-2xl', 'p-6');
            } else if (viewName === 'lobby') {
                lobbyView.classList.remove('hidden');
                // S'assurer que le conteneur principal est en plein écran pour la vue du lobby/chat
                appContainer.classList.add('h-full', 'w-full', 'overflow-hidden');
                appContainer.classList.remove('lg:max-w-xl', 'rounded-xl', 'shadow-2xl', 'p-6');
            }
        }

        /** Affiche un message d'erreur temporaire. */
        function displayError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        /** Ajoute un message au conteneur de messages. */
        function addMessage(msg) {
            const isSystem = msg.action === 'SYSTEM_MESSAGE';
            const isSelf = msg.userId === userId && !isSystem;

            const msgElement = document.createElement('div');
            msgElement.classList.add('message-item', 'flex', 'flex-col');
            
            let htmlContent = '';
            
            if (isSystem) {
                msgElement.classList.add('system-message', 'py-1');
                htmlContent = `<span class="text-sm italic text-gray-500">${msg.content}</span>`;
            } else {
                const nicknameClass = isSelf ? 'text-indigo-600 font-semibold' : 'text-gray-700 font-semibold';
                msgElement.classList.add(isSelf ? 'items-end' : 'items-start');
                
                htmlContent = `
                    <span class="${nicknameClass} text-xs mb-1">${isSelf ? 'Vous' : msg.nickname}</span>
                    <div class="message-box max-w-[85%] ${isSelf ? 'bg-indigo-100' : 'bg-white'}">
                        <p class="text-sm text-gray-800 whitespace-pre-wrap">${msg.content}</p>
                    </div>
                `;
            }

            msgElement.innerHTML = htmlContent;
            messagesContainer.appendChild(msgElement);

            // Défiler jusqu'au dernier message
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        /** Met à jour l'affichage de l'énergie. */
        function updateEnergyDisplay() {
            // Afficher l'énergie dans la zone de saisie
            messageInput.placeholder = `Écrire un message... (Énergie: ${currentEnergy}/${ENERGY_CAPACITY})`;
            
            // Désactiver le bouton d'envoi si l'énergie est insuffisante
            sendMessageBtn.disabled = currentEnergy < ENERGY_MESSAGE_COST;
            if (sendMessageBtn.disabled) {
                sendMessageBtn.classList.add('opacity-50', 'cursor-not-allowed');
                sendMessageBtn.classList.remove('hover:bg-indigo-700');
            } else {
                sendMessageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                sendMessageBtn.classList.add('hover:bg-indigo-700');
            }
        }

        /** Démarre le gain d'énergie. */
        function startEnergyGain() {
            if (energyInterval) clearInterval(energyInterval);
            energyInterval = setInterval(() => {
                if (currentEnergy < ENERGY_CAPACITY) {
                    currentEnergy++;
                    updateEnergyDisplay();
                    // addMessage({ action: 'SYSTEM_MESSAGE', content: `+1 Énergie. Total: ${currentEnergy}/${ENERGY_CAPACITY}` }); // Optionnel: pour le debug
                }
            }, ENERGY_GAIN_RATE);
        }

        /** Arrête le gain d'énergie. */
        function stopEnergyGain() {
            if (energyInterval) {
                clearInterval(energyInterval);
                energyInterval = null;
            }
        }
        
        /** Affiche la modale de confirmation. */
        function showConfirmation(text, callback) {
            confirmationText.textContent = text;
            confirmCallback = callback;
            confirmationModal.classList.remove('hidden');
        }

        /** Gère la confirmation (OK). */
        confirmOkBtn.addEventListener('click', () => {
            confirmationModal.classList.add('hidden');
            if (confirmCallback) {
                confirmCallback();
            }
        });

        /** Gère l'annulation. */
        confirmCancelBtn.addEventListener('click', () => {
            confirmationModal.classList.add('hidden');
            confirmCallback = null;
        });
        
        // --- Gestion de la Persistance ---

        /** Initialise les données de persistance (nickname) */
        function initPersistance() {
            nickname = sessionStorage.getItem('nickname') || '';
            userId = sessionStorage.getItem('userId') || crypto.randomUUID(); // Utiliser un UUID aléatoire si inexistant
            sessionStorage.setItem('userId', userId);
            
            if (nickname) {
                nicknameInput.value = nickname;
            }
        }

        /** Met à jour le nickname dans la session */
        function saveNickname(newNickname) {
            nickname = newNickname;
            sessionStorage.setItem('nickname', nickname);
        }

        // --- Communication WebSocket ---

        /** Initialise la connexion WebSocket. */
        function initWebSocket() {
            console.log(`Tentative de connexion au serveur: ${WS_SERVER}`);
            ws = new WebSocket(WS_SERVER);

            ws.onopen = () => {
                isConnected = true;
                console.log('Connecté au serveur WebSocket.');
                addMessage({ action: 'SYSTEM_MESSAGE', content: 'Connecté au serveur. Entrez votre pseudo et le code du salon.' });
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = (event) => {
                isConnected = false;
                console.log('Déconnexion du serveur:', event.reason);
                if (currentRoomCode) {
                    leaveLobby(); // Nettoyage de l'UI
                    displayError('Déconnecté du serveur. Veuillez vous reconnecter.');
                }
                setTimeout(initWebSocket, 5000); // Tente de se reconnecter
            };

            ws.onerror = (error) => {
                console.error('Erreur WebSocket:', error);
                displayError('Erreur de connexion au serveur.');
                ws.close();
            };
        }

        /** Envoie un message au serveur si la connexion est ouverte. */
        function sendToServer(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            } else {
                displayError('Connexion au serveur perdue. Tentative de reconnexion...');
                initWebSocket();
            }
        }

        /** Gère les messages reçus du serveur. */
        function handleMessage(data) {
            // console.log('Message reçu:', data);

            if (data.action === 'SYSTEM_MESSAGE' || data.action === 'MESSAGE') {
                addMessage(data);
            } else if (data.action === 'LOBBY_CREATED') {
                currentRoomCode = data.code;
                saveNickname(nicknameInput.value.trim());
                navigate('lobby');
                addMessage({ action: 'SYSTEM_MESSAGE', content: `Salon créé. Code: ${currentRoomCode}. Vous êtes l'hôte.` });
                startEnergyGain();
            } else if (data.action === 'LOBBY_JOINED') {
                currentRoomCode = data.code;
                saveNickname(nicknameInput.value.trim());
                navigate('lobby');
                addMessage({ action: 'SYSTEM_MESSAGE', content: `Salon rejoint: ${currentRoomCode}.` });
                startEnergyGain();
            } else if (data.action === 'LOBBY_UPDATE') {
                updateLobbyUI(data.lobby);
                // Si l'hôte vient d'être transféré, le message système est déjà reçu, on ne fait que l'update UI.
            } else if (data.action === 'ERROR') {
                displayError(data.content);
            } else if (data.action === 'LOBBY_LEFT') {
                leaveLobby();
            }
            
            // --- Gestion du Jeu ---
            if (data.action === 'GAME_STATUS_UPDATE') {
                updateGameStatus(data.status, data.players, data.timer, data.role);
            }
        }

        /** Met à jour l'UI du salon après une mise à jour du serveur. */
        function updateLobbyUI(lobby) {
            lobbyData = lobby;
            roomCodeDisplay.textContent = lobby.code;

            // CORRECTION: Vérification pour s'assurer que lobby.clients existe.
            const playerCount = lobby.clients ? lobby.clients.length : 0;
            
            if (lobby.clients) {
                playersCountDisplay.textContent = playerCount;

                const hostClient = lobby.clients.find(c => c.id === lobby.hostId);
                hostIdDisplay.textContent = hostClient ? lobby.players[hostClient.id]?.nickname || hostClient.id : 'N/A';
            } else {
                playersCountDisplay.textContent = 'Erreur de données';
                hostIdDisplay.textContent = 'N/A';
                console.error("Lobby data missing 'clients' array.", lobby);
            }
            
            // --- Gestion du Bouton Démarrer la Partie (NOUVEAU) ---
            const isHost = lobby.hostId === userId;
            const canStart = playerCount >= MIN_PLAYERS;
            
            startGameBtn.classList.add('hidden'); // Cacher par défaut
            startGameBtn.disabled = true;

            if (isHost && lobby.gameStatus === 'WAITING') {
                startGameBtn.classList.remove('hidden');
                
                if (canStart) {
                    startGameBtn.disabled = false;
                    startGameBtn.textContent = 'Démarrer la partie';
                } else {
                    startGameBtn.disabled = true;
                    // Afficher le nombre de joueurs manquants
                    startGameBtn.textContent = `En attente de ${MIN_PLAYERS - playerCount} joueur(s) minimum... (4 requis)`;
                }
            } else {
                 startGameBtn.classList.add('hidden');
            }


            // Toujours mettre à jour l'énergie pour refléter l'état initial
            updateEnergyDisplay();
        }
        
        function clearMessage() {
             messagesContainer.innerHTML = '';
        }

        // --- Fonctions de Jeu/Timer ---

        /** Démarre ou met à jour le compte à rebours du jeu. */
        function updateGameStatus(status, players, timer, role) {
            gameStatusDiv.classList.remove('hidden');
            
            // Rôle
            if (role) {
                roleDisplay.textContent = `Votre rôle: ${role}`;
            }

            // Timer
            if (timer !== null && timer >= 0) {
                const minutes = Math.floor(timer / 60);
                const seconds = timer % 60;
                gameTimer.textContent = `Temps restant: ${minutes}:${seconds.toString().padStart(2, '0')}`;
            } else {
                gameTimer.textContent = '';
            }
            
            if (status === 'ENDED') {
                gameTimer.textContent = 'Partie terminée !';
                stopTimer();
            }
            
            // Masquer le bouton de démarrage si la partie n'est plus en attente
            if (status !== 'WAITING') {
                startGameBtn.classList.add('hidden');
            }
        }
        
        function stopTimer() {
            // Dans ce prototype, le timer est géré côté serveur.
            // Cette fonction est un simple marqueur pour le nettoyage côté client.
        }

        // --- Événements Formulaires/Boutons ---
        
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });
        
        // NOUVEAU: Événement pour le bouton de démarrage
        startGameBtn.addEventListener('click', () => {
            if (startGameBtn.disabled) return;
            showConfirmation("Confirmez-vous le lancement de la partie ? Tous les joueurs seront notifiés.", () => {
                sendToServer({
                    action: 'START_GAME'
                });
            });
        });

        /** Gère la tentative de rejoindre un salon. */
        joinBtn.addEventListener('click', () => {
            if (!isConnected) {
                displayError('Pas connecté au serveur. Veuillez réessayer.');
                return;
            }

            const code = codeInput.value.trim();
            const nick = nicknameInput.value.trim();

            if (nick.length < 3 || nick.length > 15) {
                displayError('Le pseudonyme doit contenir entre 3 et 15 caractères.');
                return;
            }
            if (!/^\d{5}$/.test(code)) {
                displayError('Le code du salon doit être un nombre à 5 chiffres.');
                return;
            }

            sendToServer({
                action: 'JOIN_LOBBY',
                code: code,
                nickname: nick,
                userId: userId // Envoi de l'ID pour la persistance
            });
        });

        /** Gère la tentative de création d'un salon. */
        createBtn.addEventListener('click', () => {
            if (!isConnected) {
                displayError('Pas connecté au serveur. Veuillez réessayer.');
                return;
                
            }

            const nick = nicknameInput.value.trim();
            if (nick.length < 3 || nick.length > 15) {
                displayError('Le pseudonyme doit contenir entre 3 et 15 caractères.');
                return;
                
            }

            sendToServer({
                action: 'CREATE_LOBBY',
                nickname: nick,
                userId: userId // Envoi de l'ID pour la persistance
            });
        });

        /** Envoie un message de chat. */
        function sendMessage() {
            const content = messageInput.value.trim();
            if (content === '') {
                return;
            }

            if (currentEnergy < ENERGY_MESSAGE_COST) {
                displayError('Énergie insuffisante pour envoyer un message !');
                return;
            }
            
            // Dépense de l'énergie
            currentEnergy -= ENERGY_MESSAGE_COST;
            updateEnergyDisplay();

            sendToServer({
                action: 'MESSAGE',
                content: content
            });

            messageInput.value = '';
        }
        
        leaveLobbyBtn.addEventListener('click', () => {
            showConfirmation("Êtes-vous sûr de vouloir quitter le salon ? La déconnexion est immédiate.", () => {
                sendToServer({
                    action: 'LEAVE_LOBBY'
                });
            });
        });
        
        function leaveLobby() {
            messagesContainer.innerHTML = '';
            currentRoomCode = null;
            lobbyData = {};
            stopTimer(); 
            stopEnergyGain(); // S'assurer que le gain d'énergie s'arrête en quittant
            // Réinitialiser l'énergie pour la prochaine partie
            currentEnergy = ENERGY_CAPACITY;
            navigate('home');
            clearMessage();
        }

        // --- Événements Clavier/Bouton ---
        
        // La soumission du formulaire est maintenant gérée par l'événement 'submit'
        // du formulaire pour capturer aussi bien le bouton que la touche Entrée.

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                // Empêche la touche Entrée de soumettre le formulaire deux fois (car 'submit' est déjà écouté)
                // et assure que le curseur ne crée pas de nouvelle ligne dans l'input text.
                // NOTE: L'événement 'submit' du formulaire appelle déjà sendMessage()
            }
        });
        
        // --- Initialisation ---\
        initPersistance(); 
        window.onload = initWebSocket;
    </script>
</body>
</html>
