<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Déduction Sociale - Lobby WebSocket</title>
    <!-- Chargement de Tailwind CSS pour un style moderne et réactif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuration de la police Inter et configuration de base */
        :root {
            font-family: 'Inter', sans-serif;
        }

        /* FLEXBOX CRUCIAL pour l'optimisation mobile/clavier */
        /* Le corps prend la hauteur de l'écran visible */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; /* Retirer le padding du body global */
        }
        
        /* Le conteneur d'application prend la hauteur totale de l'écran ou une taille maximale sur desktop */
        #app-container {
            height: 100vh; /* Permet au Flexbox de fonctionner en pleine hauteur */
            max-height: 100vh; /* S'assure qu'il ne dépasse pas sur mobile */
            width: 100%;
            max-width: 6xl; /* Taille maximale pour desktop */
            margin: 0;
            border-radius: 0;
            overflow-y: auto; /* Permet le défilement si le contenu dépasse */
        }
        
        /* Conteneur de messages pour forcer le défilement vers le bas */
        #messages-container {
            overflow-y: auto;
            /* Définit une hauteur max pour que le chat scroll */
            max-height: calc(100vh - 300px); 
            min-height: 200px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="app-container" class="bg-white shadow-xl flex flex-col p-4 sm:p-8">
        
        <!-- Vue Accueil/Connexion -->
        <section id="home-view" class="space-y-6 max-w-md mx-auto w-full">
            <h1 class="text-4xl font-extrabold text-indigo-700 text-center">Jeu Social</h1>
            <p class="text-center text-gray-600">Connectez-vous pour jouer.</p>

            <div class="space-y-4">
                <input type="text" id="nickname-input" placeholder="Votre Surnom (min 3 lettres)" maxlength="15"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                <input type="text" id="code-input" placeholder="Code du Salon (ex: 12345)" maxlength="5"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 uppercase">
            </div>

            <div class="flex flex-col space-y-3">
                <button id="join-btn" disabled
                        class="w-full p-3 bg-indigo-500 text-white font-semibold rounded-lg shadow hover:bg-indigo-600 transition duration-150 disabled:bg-indigo-300">
                    Rejoindre un Salon
                </button>
                <button id="create-btn" disabled
                        class="w-full p-3 bg-green-500 text-white font-semibold rounded-lg shadow hover:bg-green-600 transition duration-150 disabled:bg-green-300">
                    Créer un Salon
                </button>
            </div>

            <div id="system-feedback" class="text-center text-sm text-red-500 min-h-[1.5rem]"></div>
        </section>

        <!-- Vue Lobby -->
        <section id="lobby-view" class="hidden flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-gray-700">Salon: <span id="lobby-code-display" class="text-indigo-600"></span></h2>
                <div class="flex items-center space-x-2">
                    <span id="host-badge" class="hidden bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-0.5 rounded-full">Hôte</span>
                    <button id="leave-lobby-btn" class="text-sm text-gray-500 hover:text-red-600 transition duration-150">
                        Quitter
                    </button>
                </div>
            </div>
            
            <!-- Informations Lobby & Joueurs -->
            <div class="mb-4 bg-gray-50 p-4 rounded-lg shadow-inner">
                <p class="text-lg font-semibold text-gray-700 mb-2">Joueurs (<span id="player-count">0</span>):</p>
                <ul id="players-list" class="space-y-1 text-gray-600 text-sm">
                    <!-- Les joueurs seront listés ici -->
                </ul>
            </div>
            
            <!-- Bouton Démarrer Jeu (visible uniquement par l'hôte) -->
            <button id="start-game-btn" disabled
                    class="w-full p-3 bg-red-600 text-white font-semibold rounded-lg shadow hover:bg-red-700 transition duration-150 disabled:bg-red-300 mb-4 hidden">
                Démarrer le Jeu (Min 4 joueurs)
            </button>
            
            <!-- Affichage du Chat -->
            <div id="messages-container" class="flex-1 bg-gray-100 p-4 rounded-lg space-y-2 overflow-y-auto mb-4">
                <!-- Messages de chat ici -->
            </div>
            
            <!-- Affichage de l'Énergie et de la Saisie de Message -->
            <div id="chat-controls" class="pt-4 border-t border-gray-200">
                <div class="flex items-center mb-2 space-x-4">
                    <label class="text-sm font-medium text-gray-700 whitespace-nowrap">Énergie:</label>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="energy-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="flex space-x-3">
                    <input type="text" id="message-input" placeholder="Taper un message..." maxlength="100"
                           class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <button id="send-message-btn" disabled
                            class="p-3 bg-indigo-500 text-white font-semibold rounded-lg shadow hover:bg-indigo-600 transition duration-150 disabled:bg-indigo-300">
                        Envoyer
                    </button>
                </div>
            </div>
        </section>

        <!-- Modal de Confirmation (pour le 'Quitter' ou autres actions critiques) -->
        <div id="confirmation-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden items-center justify-center p-4">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full space-y-4">
                <p id="confirmation-message" class="text-gray-700 text-lg font-medium"></p>
                <div class="flex justify-end space-x-3">
                    <button id="cancel-confirmation" class="px-4 py-2 text-gray-500 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                        Annuler
                    </button>
                    <button id="confirm-action" class="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700 transition">
                        Confirmer
                    </button>
                </div>
            </div>
        </div>
        
    </div>

    <script type="text/javascript">
        // --- Variables Globales ---
        
        // L'utilisateur a demandé d'utiliser l'URL Render en dur (WSS)
        const WS_URL = 'wss://webrtc-epuisement-professionnel.onrender.com';
        
        /*
        // Ancien code pour la détection dynamique (décommenter si vous revenez au local)
        // const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        // const WS_URL = `${protocol}${window.location.host}`; 
        */

        let ws = null;
        let currentRoomCode = null;
        let lobbyData = {}; // Stocke les données du salon
        let userId = null; // ID du client généré par le serveur
        let nickname = null; // Surnom du joueur
        let energy = 100;
        let energyGainInterval = null;
        const ENERGY_GAIN_RATE = 1; // 1 point d'énergie par seconde
        const ENERGY_MAX = 100;
        const ENERGY_COST_PER_MESSAGE = 10; // Coût d'un message
        const MIN_PLAYERS = 4;


        // --- Éléments du DOM ---
        const appContainer = document.getElementById('app-container');
        const homeView = document.getElementById('home-view');
        const lobbyView = document.getElementById('lobby-view');

        const nicknameInput = document.getElementById('nickname-input');
        const codeInput = document.getElementById('code-input');
        const joinBtn = document.getElementById('join-btn');
        const createBtn = document.getElementById('create-btn');
        const systemFeedback = document.getElementById('system-feedback');

        const lobbyCodeDisplay = document.getElementById('lobby-code-display');
        const hostBadge = document.getElementById('host-badge');
        const playersList = document.getElementById('players-list');
        const leaveLobbyBtn = document.getElementById('leave-lobby-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendMessageBtn = document.getElementById('send-message-btn');
        const energyBar = document.getElementById('energy-bar');

        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmationMessage = document.getElementById('confirmation-message');
        let confirmationCallback = null;

        // --- Navigation ---

        function navigate(view) {
            console.log(`[NAV] Appel: navigate('${view}'). Tentative de modification des classes 'hidden'.`); // LOG DE DÉBOGAGE
            
            // NOTE: Le conteneur #app-container a 'flex flex-col' pour la vue lobby.
            // La vue home-view a 'max-w-md mx-auto w-full' pour centrer.
            // On s'assure que le conteneur principal reste flex pour la vue lobby, ou s'adapte pour la vue home.
            
            homeView.classList.add('hidden');
            lobbyView.classList.add('hidden');
            
            if (view === 'home') {
                homeView.classList.remove('hidden');
                // Ajuster l'alignement pour centrer la page d'accueil
                appContainer.classList.remove('flex-1', 'flex-col'); // Supprimer les classes de flexbox du lobby si besoin
                appContainer.classList.add('flex', 'flex-col', 'items-center', 'justify-center');
                console.log(`[NAV] Statut: homeView visible? ${!homeView.classList.contains('hidden')}`); // LOG DE DÉBOGAGE
            } else if (view === 'lobby') {
                lobbyView.classList.remove('hidden');
                // Réappliquer les classes pour le layout du lobby
                appContainer.classList.remove('items-center', 'justify-center'); // Supprimer le centrage vertical/horizontal
                appContainer.classList.add('flex', 'flex-col', 'flex-1');
                console.log(`[NAV] Statut: lobbyView visible? ${!lobbyView.classList.contains('hidden')}`); // LOG DE DÉBOGAGE
            }
        }

        // --- Persistance et Validation ---

        function initPersistance() {
            // Récupérer le dernier surnom utilisé
            const lastNickname = localStorage.getItem('lastNickname');
            if (lastNickname) {
                nicknameInput.value = lastNickname;
            }
            updateButtonState();
        }

        function updateButtonState() {
            const isNicknameValid = nicknameInput.value.trim().length >= 3;
            const isCodeValid = codeInput.value.trim().length === 5;

            createBtn.disabled = !isNicknameValid;
            joinBtn.disabled = !(isNicknameValid && isCodeValid);
        }

        // Écoute des entrées pour mettre à jour l'état des boutons
        nicknameInput.addEventListener('input', updateButtonState);
        codeInput.addEventListener('input', () => {
            // Forcer la majuscule pour le code
            codeInput.value = codeInput.value.toUpperCase();
            updateButtonState();
        });


        // --- Gestion des WebSockets ---

        function initWebSocket() {
            try {
                if (ws) {
                    ws.close();
                }
                
                // L'initialisation utilise maintenant l'URL Render codée en dur
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log(`[WS] Connecté au serveur: ${WS_URL}`);
                    // Une fois connecté, essayer de se reconnecter au lobby si le code est stocké
                    const storedCode = localStorage.getItem('currentRoomCode');
                    const storedNickname = localStorage.getItem('lastNickname');
                    
                    if (storedCode && storedNickname) {
                        currentRoomCode = storedCode;
                        nickname = storedNickname;
                        sendToServer({ 
                            action: 'REJOIN_LOBBY', 
                            code: storedCode, 
                            nickname: storedNickname 
                        });
                    }
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (e) {
                        console.error("[WS] Erreur de parsing JSON:", e, event.data);
                    }
                };

                ws.onclose = (event) => {
                    console.log(`[WS] Déconnecté du serveur (Code: ${event.code}, Raison: ${event.reason})`);
                    // Gérer la déconnexion
                    handleDisconnection();
                    // Tenter une reconnexion après 3 secondes
                    setTimeout(initWebSocket, 3000);
                };

                ws.onerror = (error) => {
                    console.error("[WS] Erreur WebSocket:", error);
                    displayFeedback("Erreur de connexion au serveur. Vérifiez l'URL ou la disponibilité du serveur.");
                };
            } catch (error) {
                console.error("[GLOBAL] Erreur lors de l'initialisation du WebSocket:", error);
                displayFeedback("Impossible de créer la connexion WebSocket. L'URL du serveur est peut-être incorrecte.");
            }
        }

        function sendToServer(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            } else {
                console.warn("[WS] Tentative d'envoi de message sans connexion ouverte.");
                displayFeedback("Serveur déconnecté. Tentative de reconnexion...");
            }
        }

        function handleMessage(data) {
            // console.log("[DATA REÇUE]", data); // Décommenter pour debug
            
            switch(data.action) {
                case 'LOBBY_CREATED':
                case 'LOBBY_JOINED':
                case 'LOBBY_REJOINED':
                    console.log(`[NAV] Succès: Tentative de navigation vers 'lobby'. Données reçues:`, data); // LOG DE DÉBOGAGE
                    
                    // Actions communes lors de la réussite d'une connexion
                    currentRoomCode = data.code;
                    userId = data.userId;
                    // Note: Le nickname est déjà mis à jour au moment du clic sur 'Créer'/'Rejoindre'
                    nickname = localStorage.getItem('lastNickname'); 
                    localStorage.setItem('currentRoomCode', currentRoomCode);
                    
                    displayFeedback(`Connecté au salon ${currentRoomCode}.`, 'green');
                    // updateLobbyUI(data.lobby); // CORRECTION 1: Retiré car le serveur n'envoie pas data.lobby ici et cela causait un crash. 
                    // Nous nous fions à LOBBY_UPDATE qui est envoyé juste après.
                    navigate('lobby');
                    break;
                
                case 'LOBBY_UPDATE':
                    // CORRECTION 2: Le serveur envoie 'lobbyData', nous acceptons 'lobbyData' ou 'lobby'.
                    updateLobbyUI(data.lobbyData || data.lobby);
                    break;

                case 'LOBBY_LEFT':
                    // Le serveur a confirmé la sortie
                    leaveLobby();
                    break;
                    
                case 'ERROR':
                    console.error(`[SERVER ERROR] ${data.content}`);
                    displayFeedback(data.content);
                    if (data.disconnect) {
                        // En cas d'erreur critique (ex: salon plein/inexistant)
                        handleDisconnection();
                    }
                    break;

                case 'SYSTEM_MESSAGE':
                    addMessage(data.content, 'system');
                    break;

                case 'MESSAGE':
                    addMessage(data.content, 'chat', data.sender, data.timestamp);
                    break;

                case 'GAME_STARTING':
                    addMessage("Le jeu va commencer ! Préparation des rôles...", 'system-important');
                    // TODO: Passer à la vue de jeu
                    break;
                
                // ... autres actions du jeu (rôles, votes, etc.)
            }
        }

        // --- Fonctions de l'Interface Utilisateur ---
        
        function updateEnergyDisplay() {
            energyBar.style.width = `${energy}%`;
        }

        function startEnergyGain() {
            if (energyGainInterval) clearInterval(energyGainInterval);
            energyGainInterval = setInterval(() => {
                if (energy < ENERGY_MAX) {
                    energy = Math.min(ENERGY_MAX, energy + ENERGY_GAIN_RATE);
                    updateEnergyDisplay();
                }
            }, 1000); // Gagner de l'énergie chaque seconde
        }

        function stopEnergyGain() {
            if (energyGainInterval) {
                clearInterval(energyGainInterval);
                energyGainInterval = null;
            }
        }

        function updateLobbyUI(lobby) {
            lobbyData = lobby;
            lobbyCodeDisplay.textContent = lobby.code;
            document.getElementById('player-count').textContent = lobby.clients.length;
            
            // Mise à jour de la liste des joueurs
            playersList.innerHTML = '';
            lobby.clients.forEach(client => {
                const isHost = client.id === lobby.hostId;
                const isMe = client.id === userId;
                const li = document.createElement('li');
                li.className = 'flex items-center space-x-2';
                
                let text = client.nickname;
                if (isMe) {
                    text += " (Moi)";
                }
                if (isHost) {
                    text += " 🔥"; // Indicateur hôte
                }
                
                li.textContent = text;
                playersList.appendChild(li);
            });
            
            // Gestion du badge Hôte et du bouton Démarrer
            const isHost = userId === lobby.hostId;
            if (isHost) {
                hostBadge.classList.remove('hidden');
                startGameBtn.classList.remove('hidden');
                
                // Mettre à jour l'état du bouton Démarrer
                const canStart = lobby.clients.length >= MIN_PLAYERS;
                startGameBtn.disabled = !canStart;
            } else {
                hostBadge.classList.add('hidden');
                startGameBtn.classList.add('hidden');
            }
            
            // S'assurer que le gain d'énergie est actif une fois dans le lobby
            startEnergyGain();
        }

        function addMessage(content, type, sender = null, timestamp = null) {
            const messageEl = document.createElement('div');
            messageEl.classList.add('p-2', 'rounded-lg', 'break-words', 'shadow-sm');
            
            let htmlContent = '';
            
            if (type === 'chat') {
                messageEl.classList.add('bg-white', 'text-gray-800', 'border', 'border-gray-200');
                const time = timestamp ? new Date(timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
                htmlContent = `
                    <p class="font-semibold text-sm ${sender === nickname ? 'text-indigo-600' : 'text-green-600'}">${sender} <span class="text-xs font-normal text-gray-400 ml-2">${time}</span></p>
                    <p class="text-gray-700">${content}</p>
                `;
            } else if (type === 'system') {
                messageEl.classList.add('bg-gray-200', 'text-gray-600', 'text-sm', 'text-center');
                htmlContent = content;
            } else if (type === 'system-important') {
                messageEl.classList.add('bg-red-100', 'text-red-700', 'font-bold', 'text-center', 'text-sm');
                htmlContent = content;
            }
            
            messageEl.innerHTML = htmlContent;
            messagesContainer.appendChild(messageEl);
            // Faire défiler vers le bas
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function displayFeedback(message, type = 'red') {
            systemFeedback.textContent = message;
            systemFeedback.className = `text-center text-sm min-h-[1.5rem] mt-2`;
            if (type === 'red') {
                systemFeedback.classList.add('text-red-500');
            } else if (type === 'green') {
                systemFeedback.classList.add('text-green-500');
            }
            setTimeout(() => {
                 // Effacer le message après un court délai
                if (systemFeedback.textContent === message) {
                    systemFeedback.textContent = '';
                }
            }, 5000);
        }

        function clearMessage() {
            displayFeedback('');
        }

        function handleDisconnection() {
            localStorage.removeItem('currentRoomCode');
            currentRoomCode = null;
            nickname = null;
            stopEnergyGain();
            navigate('home');
            addMessage("Vous avez été déconnecté du serveur.", 'system-important');
        }

        // --- Modale de Confirmation ---
        
        function showConfirmation(message, callback) {
            confirmationMessage.textContent = message;
            confirmationCallback = callback;
            confirmationModal.classList.remove('hidden');
            confirmationModal.classList.add('flex');
        }

        document.getElementById('confirm-action').addEventListener('click', () => {
            confirmationModal.classList.remove('flex');
            confirmationModal.classList.add('hidden');
            if (confirmationCallback) {
                confirmationCallback();
            }
        });

        document.getElementById('cancel-confirmation').addEventListener('click', () => {
            confirmationModal.classList.remove('flex');
            confirmationModal.classList.add('hidden');
            confirmationCallback = null;
        });


        // --- Logique de l'Application ---
        
        createBtn.addEventListener('click', () => {
            nickname = nicknameInput.value.trim();
            localStorage.setItem('lastNickname', nickname);
            
            sendToServer({ 
                action: 'CREATE_LOBBY', 
                nickname: nickname 
            });
        });

        joinBtn.addEventListener('click', () => {
            nickname = nicknameInput.value.trim();
            const code = codeInput.value.trim().toUpperCase();
            localStorage.setItem('lastNickname', nickname);

            sendToServer({ 
                action: 'JOIN_LOBBY', 
                code: code, 
                nickname: nickname 
            });
        });

        startGameBtn.addEventListener('click', () => {
            if (userId === lobbyData.hostId) {
                 sendToServer({
                    action: 'START_GAME'
                });
            } else {
                displayFeedback("Seul l'hôte peut démarrer le jeu.");
            }
        });

        function sendMessage() {
            const content = messageInput.value.trim();
            if (content.length === 0) {
                return;
            }
            
            if (energy < ENERGY_COST_PER_MESSAGE) {
                displayFeedback(`Vous n'avez pas assez d'énergie pour parler. Coût: ${ENERGY_COST_PER_MESSAGE}.`);
                return;
            }
            
            // Dépenser l'énergie
            energy = Math.max(0, energy - ENERGY_COST_PER_MESSAGE);
            updateEnergyDisplay();

            sendToServer({
                action: 'MESSAGE',
                content: content
            });

            messageInput.value = '';
        }
        
        leaveLobbyBtn.addEventListener('click', () => {
            showConfirmation("Êtes-vous sûr de vouloir quitter le salon ? La déconnexion est immédiate.", () => {
                sendToServer({
                    action: 'LEAVE_LOBBY'
                });
            });
        });
        
        function leaveLobby() {
            messagesContainer.innerHTML = '';
            currentRoomCode = null;
            lobbyData = {};
            stopEnergyGain(); // S'assurer que le gain d'énergie s'arrête en quittant
            navigate('home');
            clearMessage();
        }

        // --- Événements Clavier/Bouton ---\r\n        
        sendMessageBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // --- Initialisation ---\r\n        
        initPersistance(); 
        window.onload = initWebSocket;
    </script>
</body>
