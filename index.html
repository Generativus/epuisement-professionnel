<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épuisement Professionnel - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #2F3640; /* Gris ardoise foncé pour le fond */
            color: #EAECEF; /* Texte clair */
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Empêche le défilement du corps */
        }
        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            /* Masque la barre de défilement pour un look plus propre */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        #chat-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
        .message-bubble {
            max-width: 80%;
            padding: 0.5rem 0.75rem;
            border-radius: 1.25rem; /* Coins arrondis */
            position: relative;
        }
        /* Message de l'utilisateur (à droite) */
        .user-message {
            background-color: #3F72AF; /* Couleur d'accent bleu/foncé */
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        /* Message des autres (à gauche) */
        .other-message {
            background-color: #495057; /* Gris un peu plus clair que le fond */
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .header-bar {
            background-color: #262D34; /* Barre d'en-tête */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .input-area {
            background-color: #262D34; /* Zone de saisie */
        }
    </style>
</head>
<body>

    <!-- Barre de Progression et Score (Mockup selon la description) -->
    <header class="header-bar p-3">
        <!-- Ligne 1: Barre de progression (Objectif de manche) -->
        <div class="h-2 w-full bg-white rounded-full mb-2 overflow-hidden">
            <!-- Remplissage de la barre (ex: 50% de progression) -->
            <div id="progress-bar-fill" class="h-full bg-green-400" style="width: 50%;"></div>
        </div>
        <!-- Ligne 2: Compteurs -->
        <div class="flex justify-between items-center text-sm">
            <!-- Compte à rebours -->
            <div id="countdown" class="text-white">Temps restant: 03:45</div>
            <!-- Compteur de points de travail du joueur -->
            <div id="work-points" class="font-bold p-1 rounded-lg" style="background-color: #FFFFFF; color: #2F3640;">
                Points de Travail: <span class="font-mono">120</span>
            </div>
        </div>
    </header>

    <!-- Conteneur de la Conversation -->
    <div id="chat-container">
        <!-- Les messages seront ajoutés ici par JavaScript -->
    </div>

    <!-- Zone de Saisie de Message -->
    <div class="input-area p-3 flex gap-2 border-t border-gray-700">
        <input type="text" id="message-input" placeholder="Écrivez votre message..."
               class="flex-grow p-3 rounded-full bg-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 transition shadow-lg">
        <button id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-full transition duration-150 shadow-md">
            Envoyer
        </button>
    </div>

    <!-- Scripts Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth, signInAnonymously, signInWithCustomToken,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, onSnapshot, collection, query, orderBy,
            addDoc, serverTimestamp, getDocs, limit
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Variables Globales Fournies par Canvas ---
        // Sécurité contre la non-déclaration des variables par l'environnement
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, currentUserId;

        // --- Références DOM ---
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        // --- Données Mockup (à remplacer par la logique réelle du jeu) ---
        // Ceci est un mockup pour tester l'affichage des couleurs
        const playerColors = {
            // L'utilisateur actuel est simulé comme 'user-123'
            'user-123': { name: "Joueur Alpha", color: "#FF6347" }, // Rouge clair
            'patrone': { name: "Patron(e)", color: "#FFFFFF" }, // Blanc pour la Patronne
            'player-456': { name: "Béta", color: "#7F00FF" }, // Mauve clair
            'player-789': { name: "Gamma", color: "#3CB371" }  // Vert clair
        };

        // --- Fonctions Firestore ---

        /**
         * Construit la référence de la collection de chat public.
         * @param {object} firestore Instance de Firestore.
         * @returns {object} Référence à la collection de messages.
         */
        function getChatCollectionRef(firestore) {
            // Chemin de la collection publique pour le chat de groupe :
            // /artifacts/{appId}/public/data/messages
            return collection(firestore, `artifacts/${appId}/public/data/messages`);
        }

        /**
         * Formate un message et l'ajoute à Firestore.
         * @param {string} text Le texte du message.
         */
        async function sendMessage(text) {
            if (!currentUserId || text.trim() === "") {
                console.warn("Utilisateur non authentifié ou message vide.");
                return;
            }

            const senderInfo = playerColors[currentUserId] || { name: `Utilisateur ${currentUserId.substring(0, 4)}`, color: "#EAECEF" };

            const message = {
                senderId: currentUserId,
                senderName: senderInfo.name,
                text: text.trim(),
                timestamp: serverTimestamp(),
                color: senderInfo.color
            };

            try {
                await addDoc(getChatCollectionRef(db), message);
                console.log("Message envoyé.");
            } catch (error) {
                console.error("Erreur lors de l'envoi du message:", error);
            }
        }

        /**
         * Vérifie et ajoute le message initial de la Patron(e) si la collection est vide.
         * @param {object} firestore Instance de Firestore.
         */
        async function checkAndAddInitialMessage(firestore) {
            const chatCollectionRef = getChatCollectionRef(firestore);
            // On cherche le premier message (ordonné par timestamp ascendant)
            const q = query(chatCollectionRef, limit(1));
            
            try {
                const snapshot = await getDocs(q);

                // Si aucun message n'existe, ajouter le message de la patronne
                if (snapshot.empty) {
                    console.log("Ajout du message initial de la Patron(e).");
                    const bossMessage = {
                        senderId: "patrone",
                        senderName: "Patron(e)",
                        text: "Bienvenue dans l'équipe. L'objectif de cette manche est de compléter 150 pages de rapports. Au travail !",
                        timestamp: serverTimestamp(),
                        color: playerColors['patrone'].color
                    };
                    await addDoc(chatCollectionRef, bossMessage);
                }
            } catch (error) {
                console.error("Erreur lors de la vérification du message initial:", error);
            }
        }

        /**
         * Dessine les messages dans l'interface utilisateur.
         * @param {Array<object>} messages Liste des messages.
         */
        function renderMessages(messages) {
            chatContainer.innerHTML = ''; // Nettoyer l'affichage
            const fragment = document.createDocumentFragment();

            messages.forEach(msg => {
                const isUser = msg.senderId === currentUserId;
                const senderInfo = playerColors[msg.senderId] || { name: msg.senderName, color: "#EAECEF" };

                // 1. Conteneur du message (flexbox)
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

                // 2. Bulle de message
                const bubble = document.createElement('div');
                bubble.className = `message-bubble ${isUser ? 'user-message' : 'other-message'} max-w-xs sm:max-w-md`;

                // 3. Nom de l'expéditeur (en petit au-dessus)
                const senderNameElement = document.createElement('div');
                senderNameElement.className = `text-xs font-semibold mb-0.5 ${isUser ? 'text-right' : 'text-left'}`;
                // Appliquer la couleur du joueur au nom
                senderNameElement.style.color = senderInfo.color;
                senderNameElement.textContent = senderInfo.name;

                // 4. Texte du message
                const textElement = document.createElement('p');
                textElement.className = 'text-sm break-words';
                // Remplacer les noms de joueurs dans le texte par leur couleur (LOGIQUE MOCKUP)
                let formattedText = msg.text;
                Object.values(playerColors).forEach(player => {
                    const regex = new RegExp(`\\b${player.name}\\b`, 'g');
                    // Crée un span avec la couleur du joueur pour le nom
                    formattedText = formattedText.replace(regex, `<span style="color:${player.color}; font-weight: 600;">${player.name}</span>`);
                });
                textElement.innerHTML = formattedText;


                // 5. Temps du message (optionnel, plus petit)
                const timeElement = document.createElement('div');
                timeElement.className = `text-xs text-gray-400 mt-1 ${isUser ? 'text-right' : 'text-left'}`;
                if (msg.timestamp && msg.timestamp.toDate) {
                    timeElement.textContent = msg.timestamp.toDate().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                }

                // 6. Assemblage
                bubble.appendChild(senderNameElement);
                bubble.appendChild(textElement);
                bubble.appendChild(timeElement);
                messageWrapper.appendChild(bubble);
                fragment.appendChild(messageWrapper);
            });

            chatContainer.appendChild(fragment);

            // Faire défiler vers le bas
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- Gestion des événements UI ---

        /**
         * Gère l'envoi du message lorsque le bouton est cliqué.
         */
        function handleSendClick() {
            const text = messageInput.value;
            if (text.trim() !== "") {
                sendMessage(text);
                messageInput.value = ""; // Vider l'input
                messageInput.focus(); // Re-focuser l'input
            }
        }

        /**
         * Gère l'appui sur la touche Entrée dans la zone de saisie.
         * @param {KeyboardEvent} event
         */
        function handleInputKeypress(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Empêche le retour à la ligne dans certains cas
                handleSendClick();
            }
        }

        // --- Logique du Jeu (Firebase & Chat) ---

        function setupChatListener() {
            const chatCollectionRef = getChatCollectionRef(db);
            // Requête: tous les messages, ordonnés par timestamp
            const q = query(chatCollectionRef, orderBy("timestamp", "asc"));

            // onSnapshot écoute les changements en temps réel
            onSnapshot(q, (snapshot) => {
                const messages = [];
                snapshot.forEach((doc) => {
                    messages.push(doc.data());
                });
                renderMessages(messages);
            }, (error) => {
                console.error("Erreur de l'écouteur de chat en temps réel:", error);
            });

            // Une fois que l'écouteur est branché et que le jeu est prêt, on met le focus sur l'input
            messageInput.focus();
        }

        async function initializeAppAndAuth() {
            try {
                // 1. Initialisation des services Firebase
                const firebaseApp = initializeApp(firebaseConfig);
                db = getFirestore(firebaseApp);
                auth = getAuth(firebaseApp);
                // Configuration pour voir les logs dans la console si besoin
                // setLogLevel('Debug');

                // 2. Authentification
                let userCredential;
                if (initialAuthToken) {
                    userCredential = await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    userCredential = await signInAnonymously(auth);
                }
                currentUserId = userCredential.user.uid;
                console.log(`Authentifié avec succès. ID Utilisateur: ${currentUserId}`);

                // Mettre à jour la liste des joueurs avec l'utilisateur actuel
                // Ceci permet d'utiliser l'ID de l'utilisateur pour le rendu droite/gauche
                if (!playerColors[currentUserId]) {
                     playerColors[currentUserId] = { name: `Vous (${currentUserId.substring(0, 4)})`, color: "#3F72AF" };
                }

                // 3. Démarrer le jeu (vérifier le message initial et lancer l'écouteur)
                await checkAndAddInitialMessage(db);
                setupChatListener();

            } catch (error) {
                console.error("Échec de l'initialisation ou de l'authentification:", error);
                // Afficher un message d'erreur dans le chat si l'initialisation échoue
                chatContainer.innerHTML = `<div class="text-red-400 p-4">Erreur critique d'initialisation: ${error.message}. Vérifiez la console.</div>`;
            }
        }

        // --- Démarrage ---
        window.onload = () => {
            // Attacher les gestionnaires d'événements
            sendButton.addEventListener('click', handleSendClick);
            messageInput.addEventListener('keydown', handleInputKeypress);

            initializeAppAndAuth();
        };

    </script>
</body>
</html>
