<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épuisement Professionnel - Jeu Social P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs du jeu */
            --color-bg-dark: #2A2E33; /* Gris ardoisé foncé */
            --color-chat-dark: #373b40;
            --color-accent-white: #e0e0e0;
            --color-progress-bar: #e0e0e0;
        }

        /* Couleurs pour les joueurs (pâles) */
        .color-Rouge { --player-color: #F8BBD0; }
        .color-Orange { --player-color: #FFCC80; }
        .color-Bleu { --player-color: #BBDEFB; }
        .color-Mauve { --player-color: #E1BEE7; }
        .color-Vert { --player-color: #C8E6C9; }
        .color-Rose { --player-color: #F8BBD0; }
        .color-Turquoise { --player-color: #B2EBF2; }
        .color-Jaune { --player-color: #FFF9C4; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background-color: var(--color-chat-dark);
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Styles spécifiques aux bulles de conversation */
        #chat-window {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-top: 5rem; /* Espace pour la barre supérieure */
        }

        .message-bubble {
            max-width: 75%;
            padding: 0.5rem 0.75rem;
            border-radius: 1rem;
            position: relative;
            word-wrap: break-word;
        }

        .message-left {
            align-self: flex-start;
            background-color: var(--color-bg-dark); /* Bulle des autres joueurs */
            border-top-left-radius: 0;
            border: 2px solid var(--player-color, var(--color-accent-white));
        }

        .message-right {
            align-self: flex-end;
            background-color: #3f4449; /* Bulle du joueur local */
            border-top-right-radius: 0;
            border: 2px solid var(--player-color, var(--color-accent-white));
        }

        .message-meta {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        
        /* Couleur du nom dans le chat */
        .player-name-in-chat {
            font-weight: bold;
            color: var(--player-color);
        }

        /* Barre de saisie */
        .input-area {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--color-accent-white);
        }

        #message-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: none;
            background-color: var(--color-bg-dark);
            color: var(--color-accent-white);
            outline: none;
            resize: none;
        }
        
        /* Style des boutons */
        .btn-primary {
            background-color: #4CAF50; /* Vert */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .btn-secondary {
            background-color: #3B82F6; /* Bleu */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #45a049;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background-color: #2563EB;
        }

        .btn-primary:disabled, .btn-secondary:disabled {
            background-color: #5A5A5A;
            cursor: not-allowed;
        }

        /* Barre de statut supérieure */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background-color: var(--color-chat-dark);
            z-index: 10; /* S'assure qu'elle est au-dessus du chat */
            border-bottom: 1px solid var(--color-accent-white);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #5A5A5A;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%; /* Sera mis à jour par JS */
            background-color: var(--color-progress-bar);
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="game-container">
    
    <!-- Barre de statut supérieure (pour le jeu) -->
    <div class="status-bar hidden" id="game-status-bar">
        <!-- Barre de progression de l'objectif de manche -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        
        <div class="flex justify-between items-center text-sm font-mono">
            <!-- Compte à rebours -->
            <div id="countdown-timer">00:00</div>
            <!-- Points de travail du joueur local -->
            <div id="work-points" class="font-bold">
                Points de travail: 0
            </div>
        </div>
    </div>
    
    <!-- Écran de connexion/Lobby -->
    <div id="lobby-screen" class="p-8 flex flex-col justify-center items-center h-full text-center">
        <h1 class="text-3xl font-bold mb-6">Épuisement Professionnel</h1>
        
        <!-- Étape 1: Nom et Couleur -->
        <div id="step-1" class="w-full max-w-xs">
            <p class="mb-4">1. Entrez votre nom et choisissez votre couleur.</p>
             <input type="text" id="player-name-input" placeholder="Votre nom" 
                    class="w-full p-3 rounded-lg mb-4 bg-gray-600 text-white focus:ring-blue-500 focus:border-blue-500">
            
            <div class="flex justify-center space-x-2 mb-6">
                <select id="player-color-select" class="p-3 rounded-lg bg-gray-600 text-white w-full">
                    <!-- Les options de couleur seront ajoutées par JS -->
                </select>
            </div>
            
            <button id="next-step-btn" class="btn-secondary w-full" disabled>
                Confirmer
            </button>
        </div>

        <!-- Étape 2: Hôte ou Rejoindre -->
        <div id="step-2" class="w-full max-w-xs hidden">
            <p class="mb-4">2. Voulez-vous créer ou rejoindre une partie?</p>

            <button id="create-host-btn" class="btn-primary w-full mb-3">
                Créer Partie (Hôte)
            </button>
            
            <div class="flex items-center space-x-2 mt-4">
                <input type="text" id="host-code-input" placeholder="Code de Partie" maxlength="6"
                       class="flex-grow p-3 rounded-lg bg-gray-600 text-white text-center uppercase tracking-widest focus:ring-blue-500 focus:border-blue-500">
                <button id="join-game-btn" class="btn-secondary p-3" style="width: 110px;" disabled>
                    Rejoindre
                </button>
            </div>
        </div>
        
        <!-- Écran du Lobby -->
        <div id="lobby-info" class="mt-8 text-center hidden w-full max-w-xs">
            <p class="text-lg font-semibold mb-2" id="lobby-title"></p>
            
            <!-- Affichage du Code de Partie (pour l'Hôte) ou du Statut (pour le Joiner) -->
            <div class="bg-gray-700 p-3 rounded-lg mb-4" id="code-display">
                <p class="text-sm">Code de Partie:</p>
                <code class="text-xl font-mono tracking-widest text-yellow-400" id="host-code-value">...</code>
            </div>
            
            <p id="player-count">Joueurs connectés: 1 / 8</p>
            
            <!-- Bouton Démarrer - UNIQUEMENT pour l'HÔTE -->
            <button id="start-game-btn" class="btn-primary mt-4" disabled>
                Démarrer la partie (Min 4 joueurs)
            </button>
        </div>

        <p id="connection-status" class="mt-4 text-sm text-gray-400">Statut: Déconnecté</p>

    </div>

    <!-- Interface du jeu (Chat) -->
    <div id="game-interface" class="flex flex-col h-full hidden">
        <div id="chat-window" class="flex-grow">
            <!-- Les messages seront ajoutés ici -->
        </div>

        <div class="input-area">
            <textarea id="message-input" rows="1" placeholder="Écrire un message..."
                      class="focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
    </div>

</div>

<script type="module">
    // --- IMPORTATIONS FIREBASE ET WEBRTC ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    
    // --- VARIABLES GLOBALES FIREBASE ---
    // NOTE: Ces variables sont fournies par l'environnement Canvas.
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    
    let app, db, auth, userId = null;

    // --- CONFIGURATION DU JEU ---
    const SIGNALING_SERVER_URL = "wss://webrtc-epuisement-professionnel.onrender.com";
    const MIN_PLAYERS = 4;
    const MAX_PLAYERS = 8;
    const TIME_TO_EARN_POINTS_MS = 10000; // 10 secondes
    const POINTS_EARNED_PER_INTERVAL = 10; // 10 points
    
    // Couleurs du jeu
    const PLAYER_COLORS = [
        { name: "Rouge", class: "color-Rouge" },
        { name: "Orange", class: "color-Orange" },
        { name: "Bleu", class: "color-Bleu" },
        { name: "Mauve", class: "color-Mauve" },
        { name: "Vert", class: "color-Vert" },
        { name: "Rose", class: "color-Rose" },
        { name: "Turquoise", class: "color-Turquoise" },
        { name: "Jaune", class: "color-Jaune" },
    ];

    // --- ÉTAT LOCAL DU JEU ---
    let localPlayer = {
        id: crypto.randomUUID(), // ID unique pour ce joueur dans la session
        name: null,
        colorName: null,
        colorClass: null,
        isHost: false, // Rôle du joueur
        hostId: null, // ID de l'hôte (si Joiner)
        workPoints: 0,
    };
    
    let ws = null;
    let peers = new Map(); // Map de 'peerId' -> RTCPeerConnection
    let dataChannels = new Map(); // Map de 'peerId' -> RTCDataChannel

    // État du Lobby (maintenu par l'hôte et copié par les joiners)
    let connectedPlayers = new Map(); // Map de 'playerId' -> { id, name, colorClass, isHost, peerConnectionId }
    
    // --- ÉLÉMENTS DU DOM ---
    const $nameInput = document.getElementById('player-name-input');
    const $colorSelect = document.getElementById('player-color-select');
    const $nextStepBtn = document.getElementById('next-step-btn');
    const $createHostBtn = document.getElementById('create-host-btn');
    const $hostCodeInput = document.getElementById('host-code-input');
    const $joinGameBtn = document.getElementById('join-game-btn');
    const $startBtn = document.getElementById('start-game-btn');
    
    const $step1 = document.getElementById('step-1');
    const $step2 = document.getElementById('step-2');
    const $lobbyScreen = document.getElementById('lobby-screen');
    const $lobbyInfo = document.getElementById('lobby-info');
    const $hostCodeValue = document.getElementById('host-code-value');

    const $gameInterface = document.getElementById('game-interface');
    const $chatWindow = document.getElementById('chat-window');
    const $messageInput = document.getElementById('message-input');
    const $connectionStatus = document.getElementById('connection-status');
    const $playerCount = document.getElementById('player-count');
    const $gameStatusBar = document.getElementById('game-status-bar');
    const $workPoints = document.getElementById('work-points');
    const $lobbyTitle = document.getElementById('lobby-title');


    // --- FONCTIONS UTILITAIRES ---

    /** Génère un code court de 6 caractères à partir d'un UUID */
    function generateShortCode(uuid) {
        return uuid.replace(/-/g, '').substring(0, 6).toUpperCase();
    }

    /** Initialise Firebase (Auth et Firestore) */
    async function initFirebase() {
        try {
            if (Object.keys(firebaseConfig).length === 0) {
                console.warn("Configuration Firebase manquante.");
                return;
            }
            
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Tente de se connecter avec le token personnalisé ou de manière anonyme
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("Authentification Firebase réussie. User ID:", userId);
                    // L'auth est prête, on peut passer à l'étape 1
                    checkStep1Readiness();
                } else {
                    console.error("Échec de l'authentification Firebase.");
                }
            });
        } catch (error) {
            console.error("Erreur lors de l'initialisation de Firebase:", error);
        }
    }

    /** Met à jour l'affichage de l'hôte avec le nombre de joueurs */
    function updatePlayerCountDisplay() {
        const count = connectedPlayers.size;
        $playerCount.textContent = `Joueurs connectés: ${count} / ${MAX_PLAYERS}`;

        if (localPlayer.isHost) {
            const canStart = count >= MIN_PLAYERS;
            $startBtn.disabled = !canStart;
            $startBtn.textContent = canStart 
                ? `Démarrer la partie (${count} joueurs)` 
                : `Démarrer la partie (Min ${MIN_PLAYERS} joueurs)`;
        }
    }

    /** Ajoute un message à la fenêtre de chat */
    function addMessage(senderName, senderColorClass, message, isLocal = false) {
        const messageContainer = document.createElement('div');
        const bubble = document.createElement('div');
        const meta = document.createElement('div');

        // Récupère la variable CSS pour la couleur du joueur (nécessaire pour la bulle left)
        const rootStyles = getComputedStyle(document.documentElement);
        
        bubble.classList.add('message-bubble');
        bubble.textContent = message;

        if (isLocal) {
            messageContainer.classList.add('flex', 'justify-end');
            bubble.classList.add('message-right');
            // La bulle locale utilise la couleur locale (définie sur body)
            bubble.style.setProperty('--player-color', rootStyles.getPropertyValue(localPlayer.colorClass)); 
        } else {
            // Pour les messages des autres, on trouve la bonne classe à partir de connectedPlayers
            const sender = connectedPlayers.get(senderId); // Supposons qu'on passe l'ID
            const colorClass = sender ? sender.colorClass : senderColorClass; // Fallback
            
            messageContainer.classList.add('flex', 'justify-start');
            messageContainer.classList.classList.add(colorClass); // Ajoute la classe de couleur
            bubble.classList.add('message-left');
            // La bulle extérieure utilise la couleur définie par la classe
            bubble.style.setProperty('--player-color', rootStyles.getPropertyValue(`--player-color`));
            
            // Méta-données (Nom de l'expéditeur)
            meta.classList.add('message-meta');
            meta.textContent = senderName;
            meta.style.color = rootStyles.getPropertyValue(`--player-color`); // Nom dans la couleur du joueur
            messageContainer.appendChild(meta);
        }
        
        messageContainer.appendChild(bubble);
        $chatWindow.appendChild(messageContainer);
        $chatWindow.scrollTop = $chatWindow.scrollHeight;
    }
    
    /** Ajout des options de couleur au sélecteur */
    function populateColorSelect() {
        PLAYER_COLORS.forEach(color => {
            const option = document.createElement('option');
            option.value = color.name;
            option.textContent = color.name;
            option.className = color.class;
            $colorSelect.appendChild(option);
        });
        // Sélectionne une couleur aléatoire par défaut
        const randomIndex = Math.floor(Math.random() * PLAYER_COLORS.length);
        $colorSelect.value = PLAYER_COLORS[randomIndex].name;
    }

    /** Met à jour l'état local du joueur après l'étape 1 et applique le style */
    function finalizeLocalPlayerInfo() {
        const selectedColorName = $colorSelect.value;
        const color = PLAYER_COLORS.find(c => c.name === selectedColorName);
        
        localPlayer.name = $nameInput.value.trim();
        localPlayer.colorName = selectedColorName;
        localPlayer.colorClass = color ? `color-${color.name}` : 'color-Rouge';
        
        // Appliquer la couleur au style local pour les messages locaux/statut
        const root = document.documentElement;
        root.style.setProperty('--player-color', root.style.getPropertyValue(localPlayer.colorClass));
        $workPoints.style.color = root.style.getPropertyValue('--player-color');
    }
    
    // --- LOGIQUE WEBRTC ET SIGNALING ---

    /** Connecte au serveur de signalisation WebSocket */
    function connectToSignalingServer(callback) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            callback();
            return;
        }
        
        ws = new WebSocket(SIGNALING_SERVER_URL);
        $connectionStatus.textContent = "Statut: Connexion au serveur...";

        ws.onopen = () => {
            console.log("Connecté au serveur de signalisation.");
            $connectionStatus.textContent = "Statut: Connecté.";
            callback();
        };

        ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            
            // Si le message est destiné à quelqu'un d'autre (basé sur le `targetId`), ignorer.
            if (message.targetId && message.targetId !== localPlayer.id) {
                // Ce message n'est pas pour moi (ex: A a fait une offre à B)
                return;
            }
            
            console.log("Message de signalisation ciblé reçu:", message);

            switch (message.type) {
                case 'request_to_join_host':
                    // **[HOST LOGIC]** Le joueur veut rejoindre. On met à jour le lobby et on démarre P2P.
                    if (localPlayer.isHost) {
                        handleLobbyJoinRequest(message);
                    }
                    break;
                case 'offer':
                    handleOffer(message);
                    break;
                case 'answer':
                    handleAnswer(message);
                    break;
                case 'candidate':
                    handleCandidate(message);
                    break;
                case 'chat':
                    // Message P2P relayé (Devrait être rare si P2P est établi, mais géré ici si canal de données lent)
                    // Pour ce jeu, on suppose que tous les CHATs passent par le canal P2P
                    break;
                // Ajoutez d'autres types de messages de jeu ici...
            }
        };

        ws.onerror = (error) => {
            console.error("Erreur WebSocket:", error);
            $connectionStatus.textContent = "Statut: Erreur de connexion.";
        };

        ws.onclose = () => {
            console.log("Déconnecté du serveur de signalisation.");
            $connectionStatus.textContent = "Statut: Déconnecté.";
        };
    }

    /** Envoie un message de signalisation au serveur */
    function sendSignalingMessage(message) {
        message.senderId = localPlayer.id; // J'ajoute toujours mon ID
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(message));
        } else {
            console.error("WebSocket non connecté. Impossible d'envoyer le message de signalisation.");
        }
    }
    
    /** Envoie un message P2P à tous les pairs connectés */
    function broadcastData(message) {
        dataChannels.forEach((channel, peerId) => {
            if (channel.readyState === 'open') {
                try {
                    channel.send(JSON.stringify(message));
                } catch (e) {
                    console.error(`Erreur lors de l'envoi au pair ${peerId}:`, e);
                }
            } else {
                console.warn(`Canal de données vers ${peerId} n'est pas prêt. État: ${channel.readyState}`);
            }
        });
    }

    /** Crée une nouvelle connexion RTCPeerConnection */
    function createPeerConnection(peerId, isInitiator) {
        const pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        });

        // 1. Gestion des candidats ICE
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignalingMessage({
                    type: 'candidate',
                    targetId: peerId,
                    candidate: event.candidate
                });
            }
        };

        // 2. Événement de canal de données
        if (isInitiator) {
            const dataChannel = pc.createDataChannel("chat-channel");
            setupDataChannel(peerId, dataChannel);
        } else {
            pc.ondatachannel = (event) => setupDataChannel(peerId, event.channel);
        }

        // 3. Gestion de l'état de la connexion (pour le débogage)
        pc.oniceconnectionstatechange = () => {
            console.log(`État ICE pour ${peerId}: ${pc.iceConnectionState}`);
            if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') {
                console.log(`Connexion échouée/fermée avec ${peerId}.`);
                handlePeerDisconnection(peerId);
            }
            if (pc.iceConnectionState === 'connected') {
                console.log(`P2P CONNECION OK avec ${peerId}`);
                // Si l'hôte vient de se connecter à un nouveau pair, il envoie l'état du lobby
                if (localPlayer.isHost) {
                    sendLobbyState(peerId);
                }
            }
        };

        peers.set(peerId, pc);
        return pc;
    }
    
    /** Configuration d'un canal de données */
    function setupDataChannel(peerId, channel) {
        channel.onopen = () => {
            console.log(`Canal de données ouvert avec ${peerId}`);
            dataChannels.set(peerId, channel);
        };
        
        channel.onmessage = (event) => {
            const message = JSON.parse(event.data);
            
            if (message.type === 'chat') {
                 if (message.senderId !== localPlayer.id) {
                    const sender = connectedPlayers.get(message.senderId);
                    if (sender) {
                        addMessage(sender.name, sender.colorClass, message.text);
                    } else {
                        // Cas où l'hôte envoie un message avant de recevoir l'état complet
                        addMessage("Joueur Inconnu", "color-Rouge", message.text);
                    }
                }
            } else if (message.type === 'lobby_state') {
                // Reçu par un non-hôte. Met à jour la liste des joueurs
                if (!localPlayer.isHost) {
                    handleLobbyState(message);
                }
            } else if (message.type === 'start_game') {
                // Reçu par tous les joueurs de l'hôte
                startGame();
            }
        };
        
        channel.onclose = () => {
            console.log(`Canal de données fermé avec ${peerId}`);
            dataChannels.delete(peerId);
            handlePeerDisconnection(peerId);
        };
    }
    
    /** Envoie l'état complet du lobby à un pair spécifique via P2P */
    function sendLobbyState(targetId) {
        if (!localPlayer.isHost) return;

        const playerList = Array.from(connectedPlayers.entries()).map(([id, player]) => ({
            id: player.id,
            name: player.name,
            colorClass: player.colorClass,
            isHost: player.isHost,
        }));

        const message = {
            type: 'lobby_state',
            players: playerList,
            hostId: localPlayer.id,
        };

        const channel = dataChannels.get(targetId);
        if (channel && channel.readyState === 'open') {
            channel.send(JSON.stringify(message));
            console.log(`[HOST] État du lobby envoyé à ${targetId.substring(0, 6)}`);
        } else {
             console.warn(`[HOST] Tentative d'envoyer l'état du lobby à ${targetId.substring(0, 6)}, mais le canal n'est pas ouvert.`);
        }
    }

    /** Gère la réception de l'état du lobby par un non-hôte */
    function handleLobbyState(message) {
        // Le non-hôte met à jour sa liste de joueurs en fonction de l'hôte
        connectedPlayers.clear();
        message.players.forEach(p => {
            connectedPlayers.set(p.id, p);
        });
        
        updatePlayerCountDisplay();
        $lobbyInfo.classList.remove('hidden');
        $lobbyTitle.textContent = `Lobby de ${connectedPlayers.get(message.hostId)?.name || 'l\'Hôte'}`;
        
        // Cacher le code de partie pour les non-hôtes
        document.getElementById('code-display').classList.add('hidden');
        $connectionStatus.textContent = "Statut: Connecté au Lobby (via P2P)";
    }

    /** Gère la déconnexion d'un pair */
    function handlePeerDisconnection(peerId) {
        const pc = peers.get(peerId);
        if (pc) pc.close();
        peers.delete(peerId);
        dataChannels.delete(peerId);
        
        // Si c'est l'hôte, retirez le joueur de la liste des joueurs
        if (localPlayer.isHost) {
            const disconnectedPlayer = connectedPlayers.get(peerId);
            if (disconnectedPlayer) {
                connectedPlayers.delete(peerId);
                console.log(`Le joueur ${disconnectedPlayer.name} a quitté le lobby.`);
                updatePlayerCountDisplay();
                // Diffuser le nouvel état du lobby à tous les joueurs restants
                broadcastData({ type: 'player_leave', playerId: peerId });
                // Mettre à jour l'état du lobby pour les autres joueurs
                connectedPlayers.forEach((player, id) => {
                    if (id !== localPlayer.id) sendLobbyState(id);
                });
            }
        }
    }
    
    /** Création d'une offre WebRTC (Initiateur) */
    async function createOffer(targetId) {
        const pc = createPeerConnection(targetId, true);
        
        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            sendSignalingMessage({
                type: 'offer',
                targetId: targetId,
                sessionDescription: pc.localDescription
            });
        } catch (error) {
            console.error(`Erreur lors de la création de l'offre pour ${targetId.substring(0, 6)}:`, error);
        }
    }

    /** Gestion d'une offre WebRTC (Récepteur) */
    async function handleOffer(message) {
        const pc = createPeerConnection(message.senderId, false);
        
        try {
            await pc.setRemoteDescription(new RTCSessionDescription(message.sessionDescription));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            sendSignalingMessage({
                type: 'answer',
                targetId: message.senderId,
                sessionDescription: pc.localDescription
            });
            
        } catch (error) {
            console.error("Erreur lors de la gestion de l'offre:", error);
        }
    }

    /** Gestion d'une réponse WebRTC (Initiateur) */
    async function handleAnswer(message) {
        const pc = peers.get(message.senderId);
        if (pc) {
            try {
                await pc.setRemoteDescription(new RTCSessionDescription(message.sessionDescription));
            } catch (error) {
                console.error("Erreur lors de la gestion de la réponse:", error);
            }
        }
    }

    /** Ajout d'un candidat ICE */
    async function handleCandidate(message) {
        const pc = peers.get(message.senderId);
        if (pc && message.candidate) {
            try {
                await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
            } catch (error) {
                console.error("Erreur lors de l'ajout du candidat ICE:", error);
            }
        }
    }
    
    // --- LOGIQUE HÔTE / JOINER ---
    
    /** LOGIQUE HÔTE : Le joueur A crée la partie */
    function createHostGame() {
        finalizeLocalPlayerInfo();
        localPlayer.isHost = true;
        localPlayer.hostId = localPlayer.id; // L'hôte est son propre hôte
        
        connectToSignalingServer(() => {
            const shortCode = generateShortCode(localPlayer.id);
            $hostCodeValue.textContent = shortCode;
            
            // Ajouter l'hôte à sa propre liste de joueurs connectés
            connectedPlayers.set(localPlayer.id, {
                id: localPlayer.id,
                name: localPlayer.name,
                colorClass: localPlayer.colorClass,
                isHost: true,
            });
            updatePlayerCountDisplay();
            
            // Afficher le lobby
            $step2.classList.add('hidden');
            $lobbyInfo.classList.remove('hidden');
            $lobbyTitle.textContent = "Lobby Hôte";
            
            $connectionStatus.textContent = `Statut: En attente de joueurs (Code: ${shortCode})`;
        });
    }
    
    /** LOGIQUE JOINER : Le joueur B rejoint la partie */
    function joinGame() {
        const hostCode = $hostCodeInput.value.toUpperCase();
        if (hostCode.length !== 6) {
            alert("Veuillez entrer un code de partie valide de 6 caractères.");
            return;
        }

        finalizeLocalPlayerInfo();
        localPlayer.isHost = false;
        
        // On ne connaît pas l'ID complet de l'hôte, mais on utilise le code court pour cibler
        // Le serveur de signalisation relaye le message à tous, mais l'hôte est le seul à réagir.
        
        connectToSignalingServer(() => {
            $step2.classList.add('hidden');
            $lobbyInfo.classList.remove('hidden');
            $lobbyTitle.textContent = `Connexion au Lobby...`;
            $hostCodeValue.textContent = hostCode; // Afficher le code entré
            document.getElementById('start-game-btn').classList.add('hidden'); // Cacher le bouton Démarrer

            $connectionStatus.textContent = "Statut: Envoi de la demande de connexion...";
            
            // 1. Envoyer une demande de rejoindre (au code court)
            sendSignalingMessage({
                type: 'request_to_join_host',
                targetCode: hostCode, // Le host (qui a le code en mémoire) réagira
                playerId: localPlayer.id,
                playerName: localPlayer.name,
                playerColorClass: localPlayer.colorClass,
                isHost: false,
            });
            
            // 2. Le Joiner attend l'offre de l'hôte (handleOffer se chargera du reste)
        });
    }
    
    /** LOGIQUE HÔTE : Gère la demande de connexion du joiner (reçue via le signal server) */
    function handleLobbyJoinRequest(message) {
        if (!localPlayer.isHost) return;
        
        // 1. Vérifie si le code court correspond à mon propre code
        const myShortCode = generateShortCode(localPlayer.id);
        if (message.targetCode !== myShortCode) {
            console.log(`Demande ignorée: Code ${message.targetCode} ne correspond pas au mien.`);
            return;
        }

        // 2. Ajouter le joueur à la liste locale de l'hôte
        if (!connectedPlayers.has(message.playerId)) {
             connectedPlayers.set(message.playerId, {
                id: message.playerId,
                name: message.playerName,
                colorClass: message.playerColorClass,
                isHost: false,
            });
            console.log(`Nouveau joueur ${message.playerName} (ID: ${message.playerId}) a rejoint le lobby.`);
            updatePlayerCountDisplay();
        }
        
        // 3. L'hôte démarre la création de la connexion WebRTC avec le nouveau pair
        createOffer(message.senderId);
    }


    // --- LOGIQUE DU JEU ---
    
    function startGame() {
        $lobbyScreen.classList.add('hidden');
        $gameInterface.classList.remove('hidden');
        $gameStatusBar.classList.remove('hidden');
        
        // Appliquer la couleur au statut des points
        $workPoints.style.color = getComputedStyle(document.documentElement).getPropertyValue('--player-color');
        
        // Focus sur la zone de saisie pour commencer à écrire
        setTimeout(() => $messageInput.focus(), 100);
        
        console.log("La partie a commencé!");
        addMessage("Système", "color-Rouge", "La partie a commencé! Bon travail à tous!", true);
        
        // Démarrer l'accumulation de points
        startWorkPointsAccumulation();
    }
    
    function startWorkPointsAccumulation() {
        // Cette fonction sera exécutée toutes les 10 secondes (TIME_TO_EARN_POINTS_MS)
        // NOTE: Dans une vraie partie P2P, l'hôte devrait contrôler le temps et diffuser les points.
        // Ici, chaque joueur gère ses propres points par simplicité.
        setInterval(() => {
            localPlayer.workPoints += POINTS_EARNED_PER_INTERVAL;
            $workPoints.textContent = `Points de travail: ${localPlayer.workPoints}`;
        }, TIME_TO_EARN_POINTS_MS);
    }


    // --- GESTION DES ÉVÉNEMENTS ---

    /** Vérifie si l'utilisateur peut passer à l'étape 2 */
    function checkStep1Readiness() {
        const nameValid = $nameInput.value.trim().length > 0;
        $nextStepBtn.disabled = !nameValid || userId === null; // Dépend de Firebase Auth
    }
    
    $nameInput.addEventListener('input', checkStep1Readiness);
    
    $nextStepBtn.addEventListener('click', () => {
        if (!$nextStepBtn.disabled) {
            finalizeLocalPlayerInfo();
            $step1.classList.add('hidden');
            $step2.classList.remove('hidden');
        }
    });

    $createHostBtn.addEventListener('click', createHostGame);
    
    $hostCodeInput.addEventListener('input', () => {
        const codeValid = $hostCodeInput.value.trim().length === 6;
        $joinGameBtn.disabled = !codeValid;
    });

    $joinGameBtn.addEventListener('click', joinGame);

    $startBtn.addEventListener('click', () => {
        if (localPlayer.isHost && connectedPlayers.size >= MIN_PLAYERS) {
            // 1. L'hôte démarre sa propre partie
            startGame();
            // 2. L'hôte envoie un message P2P à tout le monde pour démarrer la partie
            broadcastData({ type: 'start_game' });
        } else {
            console.warn("Impossible de démarrer la partie : pas assez de joueurs ou vous n'êtes pas l'hôte.");
        }
    });

    $messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const messageText = $messageInput.value.trim();
            if (messageText) {
                // 1. Ajouter le message local
                addMessage(localPlayer.name, localPlayer.colorClass, messageText, true);
                
                // 2. Créer le message P2P
                const chatMessage = {
                    type: 'chat',
                    senderId: localPlayer.id,
                    text: messageText,
                };
                
                // 3. Diffuser à tous les pairs connectés (exclut l'envoi au serveur de signalisation)
                broadcastData(chatMessage);
                
                $messageInput.value = '';
                $messageInput.focus(); 
            }
        }
    });
    
    // --- INITIALISATION ---
    
    populateColorSelect();
    initFirebase();
    
</script>
</body>
</html>
